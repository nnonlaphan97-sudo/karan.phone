
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17191e">
<title>KARAN'S PHONE</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#17191e;
 font-family:Arial,"Noto Sans Thai",sans-serif;
}
body{
 display:flex;
 justify-content:center;
 align-items:center;
}
#phone{
 position:relative;
 width:min(100vw,480px,calc(100dvh * 390 / 616));
 aspect-ratio:390/616;
 overflow:hidden;
 background:#d7d3e8;
 border:3px solid #292b35;
 border-radius:15px;
}
#display{
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
}
svg text{
 user-select:none;
 -webkit-user-select:none;
}
.clickable{cursor:pointer}
#dateText,
#timeText {
  paint-order: stroke fill;
  stroke: rgba(42, 38, 60, 0.18);
  stroke-width: 0.7px;
  filter: drop-shadow(0 1.5px 3px rgba(35,30,55,.32));
}
</style>
</head>

<body>
<div id="phone">

<svg id="display"
 xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 390 616"
 preserveAspectRatio="none">

<defs>
 <linearGradient id="fallback" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f4e6ef"/>
  <stop offset=".5" stop-color="#dcd7ee"/>
  <stop offset="1" stop-color="#aebddd"/>
 </linearGradient>

 <linearGradient id="musicGlass" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#7982a7"/>
  <stop offset="1" stop-color="#626b91"/>
 </linearGradient>
</defs>

<!-- ==============================
     LOCK SCREEN
============================== -->

<g id="lockPage">

 <rect width="390" height="616" fill="url(#fallback)"/>

 <!-- Wallpaper -->
 <image id="wallpaper"
  x="0" y="0"
  width="390" height="616"
  preserveAspectRatio="xMidYMid slice"
  href="https://i.ibb.co/WNR6WWjb/IMG-4394.jpg"/>

 <!-- Lock icon -->
<!-- Solid black lock -->
<g id="lockIcon"
 transform="translate(195 49) scale(.75)"
 fill="#17171D">

 <!-- Shackle -->
 <path d="
  M-6 1
  V-5
  A6 6 0 0 1 6 -5
  V1
  H3
  V-5
  A3 3 0 0 0 -3 -5
  V1
  Z"/>

 <!-- Lock body -->
 <rect x="-9" y="0"
  width="18" height="15"
  rx="3.2"/>

 <!-- White keyhole -->
 <circle cx="0" cy="6"
  r="2"
  fill="#FFFFFF"/>

 <path d="M-1 7.5H1L1.5 11H-1.5Z"
  fill="#FFFFFF"/>
</g>

 <!-- Date -->
 <text id="dateText"
  x="195" y="105"
  text-anchor="middle"
  font-size="14"
  font-weight="600"
  fill="#F5F1F2">วันพุธที่ 11 พฤศจิกายน</text>

 <!-- Time -->
 <text id="timeText"
  x="195" y="182"
  text-anchor="middle"
  font-size="72"
  font-weight="800"
  letter-spacing="-3"
  fill="#F5F1F2">12:00</text>

 <!-- Bottom shortcuts -->
 <g id="phoneShortcut" class="clickable">
  <circle id="phoneCircle"
   cx="46" cy="572" r="22"
   fill="#858fca" fill-opacity=".9"/>

  <path
   d="M38 564l5-1 3 6-3 3
      q3 5 8 7l3-3 6 3v5
      q-8 3-16-5t-6-15z"
   fill="none"
   stroke="#F5F1F2"
   stroke-width="2"
   stroke-linecap="round"
   stroke-linejoin="round"/>
 </g>

 <!-- Music capsule -->
 <g id="musicWidget">

  <rect id="musicBG"
   x="83" y="548"
   width="224" height="49"
   rx="24.5"
   fill="url(#musicGlass)"
   fill-opacity=".94"/>

  <!-- Album artwork -->
  <g id="albumArt">
   <circle cx="108" cy="572.5" r="18"
    fill="#a6d4d4"/>
   <circle cx="108" cy="572.5" r="13.5"
    fill="#dceee7"/>
   <path d="M95 578Q108 567 121 578"
    fill="none"
    stroke="#77b4b2"
    stroke-width="3"
    stroke-linecap="round"/>
  </g>

  <text id="songTitle"
   x="132" y="569"
   font-size="10.5"
   font-weight="700"
   fill="#F5F1F2">เพลงของการันต์</text>

  <text id="songArtist"
   x="132" y="583"
   font-size="9"
   fill="#F5F1F2"
   opacity=".8">Music Player</text>

  <!-- Previous -->
  <g id="previous" class="clickable"
   transform="translate(243 572.5)"
   fill="#F5F1F2">
   <path d="M-5 0L3-6V6Z"/>
   <rect x="-8" y="-6" width="2" height="12" rx="1"/>
   <rect x="-13" y="-16" width="25" height="32"
    fill="transparent"/>
  </g>

  <!-- Play / Pause -->
  <g id="playButton" class="clickable"
   transform="translate(268 572.5)">
   <path id="playShape"
    d="M-4-7L7 0-4 7Z"
    fill="#F5F1F2"/>
   <rect x="-12" y="-16" width="24" height="32"
    fill="transparent"/>
  </g>

  <!-- Next -->
  <g id="next" class="clickable"
   transform="translate(292 572.5)"
   fill="#F5F1F2">
   <path d="M-3-6L5 0-3 6Z"/>
   <rect x="6" y="-6" width="2" height="12" rx="1"/>
   <rect x="-12" y="-16" width="24" height="32"
    fill="transparent"/>
  </g>

 </g>

 <!-- Camera shortcut -->
 <g id="cameraShortcut" class="clickable">
  <circle id="cameraCircle"
   cx="344" cy="572" r="22"
   fill="#858fca" fill-opacity=".9"/>

  <g fill="none"
   stroke="#F5F1F2"
   stroke-width="1.8"
   stroke-linejoin="round">

   <rect x="332" y="565"
    width="24" height="17" rx="4"/>
   <path d="M338 565l2-4h8l2 4"/>
   <circle cx="344" cy="573.5" r="5"/>
  </g>
 </g>

</g>

<!-- ==============================
     PIN SCREEN
============================== -->

<g id="pinPage" display="none">

 <rect width="390" height="616"
  fill="url(#fallback)"/>

 <text x="195" y="130"
  text-anchor="middle"
  font-size="20"
  fill="#35313b">กรอกรหัส PIN</text>

 <g id="pinDots"
  stroke="#35313b"
  stroke-width="1.7"
  fill="none">
  <circle cx="147" cy="164" r="6"/>
  <circle cx="179" cy="164" r="6"/>
  <circle cx="211" cy="164" r="6"/>
  <circle cx="243" cy="164" r="6"/>
 </g>

 <text id="pinError"
  x="195" y="193"
  text-anchor="middle"
  font-size="12"
  fill="#8a4256"></text>

 <g id="keypad"></g>

</g>

<!-- ==============================
     TEMPORARY UNLOCK SCREEN
============================== -->

<g id="unlockedPage" display="none">
 <rect width="390" height="616" fill="#e8edf5"/>

 <text x="195" y="290"
  text-anchor="middle"
  font-size="22"
  fill="#4e6786">ปลดล็อกสำเร็จ</text>

 <text x="195" y="319"
  text-anchor="middle"
  font-size="13"
  fill="#73849c">
  หน้าหลักจะสร้างในขั้นต่อไป
 </text>
</g>

<!-- ==============================
     STATUS BAR
============================== -->

<g id="statusBar" fill="#35313B">

 <text id="carrier"
  x="19" y="22"
  font-size="11"
  fill="#35313B">karan</text>

 <!-- Silent -->
 <g transform="translate(294 12)"
  fill="none"
  stroke="#35313B"
  stroke-width="1.5"
  stroke-linecap="round">
  <path d="M2 5h3l5-4v14l-5-4H2z"/>
  <path d="M13 4l6 8M19 4l-6 8"/>
 </g>

 <!-- Signal -->
 <g stroke="#35313B"
  stroke-width="1.8"
  stroke-linecap="round">
  <path d="M323 25v-4M328 25v-7M333 25v-10M338 25v-13"/>
 </g>

 <!-- Wi-Fi -->
 <g stroke="#35313B"
  stroke-width="1.5"
  fill="none"
  stroke-linecap="round">
  <path d="M345 16q7-6 14 0"/>
  <path d="M349 20q3-3 6 0"/>
  <circle cx="352" cy="23" r="1"
   fill="#35313B" stroke="none"/>
 </g>

 <!-- Battery -->
<g id="batteryIcon">

 <defs>
  <clipPath id="batteryClip">
   <rect x="365" y="12"
    width="20" height="14" rx="6"/>
  </clipPath>
 </defs>

 <!-- Battery outline -->
 <rect x="365" y="12"
  width="20" height="14"
  rx="6"
  fill="#FFFFFF"
  fill-opacity=".12"
  stroke="#24242B"
  stroke-width="1.4"/>

 <!-- Filled battery level -->
 <rect id="batteryFill"
  x="365" y="12"
  width="17" height="14"
  fill="#24242B"
  clip-path="url(#batteryClip)"/>

 <!-- Terminal -->
 <rect id="batteryTerminal"
  x="385" y="16"
  width="3" height="6"
  rx="1"
  fill="#24242B"/>

 <!-- Percentage -->
 <text id="batteryLevel"
  x="375" y="22"
  text-anchor="middle"
  font-size="8"
  font-weight="800"
  fill="#FFFFFF">85</text>

</g>

</g>

<!-- Front camera -->
<g id="frontCamera">
 <circle cx="195" cy="17" r="9" fill="#171922"/>
 <circle cx="195" cy="17" r="6" fill="#05070c"/>
 <circle cx="193" cy="15" r="1.5"
  fill="#53617a" opacity=".55"/>
</g>

<!-- Gesture bar -->
<rect id="gestureBar"
 x="145" y="604"
 width="100" height="4"
 rx="2" fill="#F5F1F2"/>

</svg>
</div>

<script>
"use strict";

/* ==========================================
   MAIN CONFIG
   ปรับตำแหน่งและหน้าตาจากจุดนี้
========================================== */

const CONFIG = {
 pin: "1906",

 wallpaper:
  "https://i.ibb.co/WNR6WWjb/IMG-4394.jpg",

 carrier: "karan",

 textColor: "#F7F4F8",

 lock: {
  x: 195,
  y: 49,
  scale: 0.75
 },

 date: {
  x: 195,
  y: 105,
  size: 14
 },

 clock: {
  x: 195,
  y: 182,
  size: 72,
  weight: 800
 },

 bottom: {
  y: 572,
  leftX: 46,
  rightX: 344
 },

 music: {
  x: 83,
  y: 548,
  width: 224,
  height: 49,
  background: "#70799d",
  title: "เพลงของการันต์",
  artist: "Music Player",
  playing: false
 },

 battery: {
  level: 85,
  showTerminal: true
 }
};

/* ==========================================
   STATE AND HELPERS
========================================== */

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("display");

let currentPage = "lock";
let enteredPIN = "";
let pinBusy = false;
let swipeStart = null;

const byId = id => document.getElementById(id);

function setAttributes(element, attributes) {
 if (!element) return;
 Object.entries(attributes).forEach(([name,value]) => {
  element.setAttribute(name,String(value));
 });
}

/* ==========================================
   CONFIG RENDER
========================================== */

function applyConfig() {
 const c = CONFIG;

 byId("wallpaper").setAttribute("href",c.wallpaper);
 byId("carrier").textContent = c.carrier;

 setAttributes(byId("lockIcon"),{
  transform:
   `translate(${c.lock.x} ${c.lock.y}) scale(${c.lock.scale})`
 });

 setAttributes(byId("dateText"),{
  x:c.date.x,
  y:c.date.y,
  "font-size":c.date.size,
  fill:c.textColor
 });

 setAttributes(byId("timeText"),{
  x:c.clock.x,
  y:c.clock.y,
  "font-size":c.clock.size,
  "font-weight":c.clock.weight,
  fill:c.textColor
 });

 byId("songTitle").textContent = c.music.title;
 byId("songArtist").textContent = c.music.artist;

 const m = c.music;
 const centerY = m.y + m.height / 2;

 setAttributes(byId("musicBG"),{
  x:m.x,
  y:m.y,
  width:m.width,
  height:m.height,
  rx:m.height/2,
  fill:m.background
 });

 const musicOffsetX = m.x - 83;
 const musicOffsetY = centerY - 572.5;

 setAttributes(byId("albumArt"),{
  transform:
   `translate(${musicOffsetX} ${musicOffsetY})`
 });

 setAttributes(byId("songTitle"),{
  x:132+musicOffsetX,
  y:569+musicOffsetY
 });

 setAttributes(byId("songArtist"),{
  x:132+musicOffsetX,
  y:583+musicOffsetY
 });

 setAttributes(byId("previous"),{
  transform:
   `translate(${m.x+160} ${centerY})`
 });

 setAttributes(byId("playButton"),{
  transform:
   `translate(${m.x+185} ${centerY})`
 });

 setAttributes(byId("next"),{
  transform:
   `translate(${m.x+209} ${centerY})`
 });

 const leftX = c.bottom.leftX;
 const rightX = c.bottom.rightX;
 const bottomY = c.bottom.y;

 setAttributes(byId("phoneShortcut"),{
  transform:
   `translate(${leftX-46} ${bottomY-572})`
 });

 setAttributes(byId("cameraShortcut"),{
  transform:
   `translate(${rightX-344} ${bottomY-572})`
 });

const level = Math.max(0, Math.min(100, c.battery.level));

byId("batteryLevel").textContent = level;

byId("batteryFill").setAttribute(
  "width",
  20 * level / 100
);
 byId("batteryTerminal").setAttribute(
  "display",c.battery.showTerminal?"inline":"none"
 );

 updatePlayIcon();
}

/* ==========================================
   CLOCK AND DATE
========================================== */

function updateClock() {
 const now = new Date();

 const time = now.toLocaleTimeString("th-TH",{
  hour:"2-digit",
  minute:"2-digit",
  hour12:false
 });

 const date = now.toLocaleDateString("th-TH",{
  weekday:"long",
  day:"numeric",
  month:"long"
 });

 byId("timeText").textContent=time;
 byId("dateText").textContent=date;
}

/* ==========================================
   MUSIC
========================================== */

function updatePlayIcon() {
 const path = byId("playShape");

 if(CONFIG.music.playing){
  path.setAttribute(
   "d","M-5-7H-1V7H-5ZM2-7H6V7H2Z"
  );
 } else {
  path.setAttribute(
   "d","M-4-7L7 0-4 7Z"
  );
 }
}

byId("playButton").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=!CONFIG.music.playing;
 updatePlayIcon();
});

byId("previous").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=false;
 updatePlayIcon();
});

byId("next").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=false;
 updatePlayIcon();
});

/* ==========================================
   SCREEN MANAGEMENT
========================================== */

function showPage(page) {
 currentPage=page;

 byId("lockPage").setAttribute(
  "display",page==="lock"?"inline":"none"
 );

 byId("pinPage").setAttribute(
  "display",page==="pin"?"inline":"none"
 );

 byId("unlockedPage").setAttribute(
  "display",page==="unlocked"?"inline":"none"
 );

 byId("statusBar").setAttribute(
  "display",page==="unlocked"?"none":"inline"
 );

 byId("frontCamera").setAttribute(
  "display",page==="unlocked"?"none":"inline"
 );
}

function openPIN() {
 if(currentPage!=="lock")return;

 enteredPIN="";
 pinBusy=false;
 byId("pinError").textContent="";
 updateDots();
 showPage("pin");
}

function updateDots() {
 document.querySelectorAll("#pinDots circle")
  .forEach((dot,index)=>{
   dot.setAttribute(
    "fill",
    index<enteredPIN.length?"#35313b":"none"
   );
  });
}

function pressPIN(value) {
 if(currentPage!=="pin"||pinBusy)return;

 if(value==="cancel"){
  showPage("lock");
  return;
 }

 if(value==="delete"){
  enteredPIN=enteredPIN.slice(0,-1);
  updateDots();
  return;
 }

 if(enteredPIN.length>=4)return;

 enteredPIN+=value;
 updateDots();

 if(enteredPIN.length===4){
  pinBusy=true;

  if(enteredPIN===CONFIG.pin){
   setTimeout(()=>{
    pinBusy=false;
    showPage("unlocked");
   },180);
  }else{
   byId("pinError").textContent=
    "รหัส PIN ไม่ถูกต้อง";

   setTimeout(()=>{
    enteredPIN="";
    pinBusy=false;
    updateDots();
   },450);
  }
 }
}

/* ==========================================
   CREATE SVG PIN KEYPAD
========================================== */

function createKeypad() {
 const keys=[
  ["1",85,260],["2",195,260],["3",305,260],
  ["4",85,346],["5",195,346],["6",305,346],
  ["7",85,432],["8",195,432],["9",305,432],
  ["ยกเลิก",85,520],["0",195,520],["ลบ",305,520]
 ];

 const keypad=byId("keypad");

 keys.forEach(([value,x,y])=>{
  const group=document.createElementNS(NS,"g");
  group.setAttribute("class","clickable");

  const circle=document.createElementNS(NS,"circle");
  setAttributes(circle,{
   cx:x,cy:y,r:38,
   fill:"#ffffff",
   "fill-opacity":".30"
  });

  const label=document.createElementNS(NS,"text");
  setAttributes(label,{
   x:x,
   y:y+(value.length>1?5:10),
   "text-anchor":"middle",
   fill:"#35313b",
   "font-size":value.length>1?13:29
  });

  label.textContent=value;
  group.append(circle,label);

  group.addEventListener("click",event=>{
   event.stopPropagation();
   pressPIN(
    value==="ยกเลิก"?"cancel":
    value==="ลบ"?"delete":value
   );
  });

  keypad.appendChild(group);
 });
}

/* ==========================================
   SWIPE TO UNLOCK
========================================== */

function svgY(event) {
 const rect=svg.getBoundingClientRect();
 return (event.clientY-rect.top)*616/rect.height;
}

svg.addEventListener("pointerdown",event=>{
 if(currentPage!=="lock")return;
 swipeStart=svgY(event);
});

svg.addEventListener("pointerup",event=>{
 if(currentPage!=="lock"||swipeStart===null)return;

 const distance=swipeStart-svgY(event);
 swipeStart=null;

 if(distance>35){
  openPIN();
 }
});

svg.addEventListener("pointercancel",()=>{
 swipeStart=null;
});

byId("phoneShortcut").addEventListener("click",openPIN);
byId("cameraShortcut").addEventListener("click",openPIN);

document.addEventListener("keydown",event=>{
 if(currentPage==="pin"){
  if(/^[0-9]$/.test(event.key))pressPIN(event.key);
  else if(event.key==="Backspace")pressPIN("delete");
  else if(event.key==="Escape")pressPIN("cancel");
 }else if(currentPage==="lock"&&event.key==="ArrowUp"){
  openPIN();
 }
});

/* ==========================================
   INITIALIZE
========================================== */

createKeypad();
applyConfig();
updateClock();
setInterval(updateClock,1000);
showPage("lock");

</script>
</body>
</html>
