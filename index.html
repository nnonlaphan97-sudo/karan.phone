<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17191e">
<title>KARAN'S PHONE</title>

<style>
{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#17191e;
 font-family:Arial,"Noto Sans Thai",sans-serif;
}
body{
 display:flex;
 justify-content:center;
 align-items:center;
}
#phone{
  position:relative;
  width:min(100vw,calc(100dvh * 390 / 616));
  aspect-ratio:390/616;
  overflow:hidden;
  background:#d7d3e8;
  border:3px solid #292b35;
  border-radius:15px;
}
#display{
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
}
svg text{
 user-select:none;
 -webkit-user-select:none;
}
.clickable{cursor:pointer}
#dateText,
#timeText {
  paint-order: stroke fill;
  stroke: rgba(42, 38, 60, 0.18);
  stroke-width: 0.7px;
  filter: drop-shadow(0 1.5px 3px rgba(35,30,55,.32));
}
</style>
</head>

<body>
<div id="phone">

<svg id="display"
 xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 390 616"
 preserveAspectRatio="none">

<defs>
 <filter id="pinBlur" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="12"/>
 </filter>
 <linearGradient id="fallback" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f4e6ef"/>
  <stop offset=".5" stop-color="#dcd7ee"/>
  <stop offset="1" stop-color="#aebddd"/>
 </linearGradient>

 <linearGradient id="musicGlass" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#7982a7"/>
  <stop offset="1" stop-color="#626b91"/>
 </linearGradient>
</defs>

<!-- ==============================
     LOCK SCREEN
============================== -->

<g id="lockPage">

 <rect width="390" height="616" fill="url(#fallback)"/>

 <!-- Wallpaper -->
 <image id="wallpaper"
  x="0" y="0"
  width="390" height="616"
  preserveAspectRatio="xMidYMid slice"
  href="https://i.ibb.co/gMd6pkQ5/IMG-4434.jpg"/>

 <!-- Lock icon -->
<!-- Solid black lock -->
<g id="lockIcon"
 transform="translate(195 49) scale(.75)"
 fill="#17171D">

 <!-- Shackle -->
 <path d="
  M-6 1
  V-5
  A6 6 0 0 1 6 -5
  V1
  H3
  V-5
  A3 3 0 0 0 -3 -5
  V1
  Z"/>

 <!-- Lock body -->
 <rect x="-9" y="0"
  width="18" height="15"
  rx="3.2"/>

 <!-- White keyhole -->
 <circle cx="0" cy="6"
  r="2"
  fill="#FFFFFF"/>

 <path d="M-1 7.5H1L1.5 11H-1.5Z"
  fill="#FFFFFF"/>
</g>

 <!-- Date -->
<text id="dateText"
  x="195" y="105"
  text-anchor="middle"
  font-size="14"
  font-weight="600"
  fill="#35313B">วันพุธที่ 11 พฤศจิกายน</text>

 <!-- Time -->
 <text id="timeText"
  x="195" y="182"
  text-anchor="middle"
  font-size="72"
  font-weight="800"
  letter-spacing="-3"
  fill="#F5F1F2">12:00</text>

 <!-- Bottom shortcuts -->
 <g id="phoneShortcut" class="clickable">
  <circle id="phoneCircle"
   cx="46" cy="572" r="22"
   fill="#858fca" fill-opacity=".9"/>

  <path
   d="M38 564l5-1 3 6-3 3
      q3 5 8 7l3-3 6 3v5
      q-8 3-16-5t-6-15z"
   fill="none"
   stroke="#F5F1F2"
   stroke-width="2"
   stroke-linecap="round"
   stroke-linejoin="round"/>
 </g>

 <!-- Music capsule -->
 <g id="musicWidget">

  <rect id="musicBG"
   x="83" y="548"
   width="224" height="49"
   rx="24.5"
   fill="url(#musicGlass)"
   fill-opacity=".94"/>

  <!-- Album artwork -->
  <g id="albumArt">
   <circle cx="108" cy="572.5" r="18"
    fill="#a6d4d4"/>
   <circle cx="108" cy="572.5" r="13.5"
    fill="#dceee7"/>
   <path d="M95 578Q108 567 121 578"
    fill="none"
    stroke="#77b4b2"
    stroke-width="3"
    stroke-linecap="round"/>
  </g>

  <text id="songTitle"
   x="132" y="569"
   font-size="10.5"
   font-weight="700"
   fill="#F5F1F2">เพลงของการันต์</text>

  <text id="songArtist"
   x="132" y="583"
   font-size="9"
   fill="#F5F1F2"
   opacity=".8">Music Player</text>

  <!-- Previous -->
  <g id="previous" class="clickable"
   transform="translate(243 572.5)"
   fill="#F5F1F2">
   <path d="M-5 0L3-6V6Z"/>
   <rect x="-8" y="-6" width="2" height="12" rx="1"/>
   <rect x="-13" y="-16" width="25" height="32"
    fill="transparent"/>
  </g>

  <!-- Play / Pause -->
  <g id="playButton" class="clickable"
   transform="translate(268 572.5)">
   <path id="playShape"
    d="M-4-7L7 0-4 7Z"
    fill="#F5F1F2"/>
   <rect x="-12" y="-16" width="24" height="32"
    fill="transparent"/>
  </g>

  <!-- Next -->
  <g id="next" class="clickable"
   transform="translate(292 572.5)"
   fill="#F5F1F2">
   <path d="M-3-6L5 0-3 6Z"/>
   <rect x="6" y="-6" width="2" height="12" rx="1"/>
   <rect x="-12" y="-16" width="24" height="32"
    fill="transparent"/>
  </g>

 </g>

 <!-- Camera shortcut -->
 <g id="cameraShortcut" class="clickable">
  <circle id="cameraCircle"
   cx="344" cy="572" r="22"
   fill="#858fca" fill-opacity=".9"/>

  <g fill="none"
   stroke="#F5F1F2"
   stroke-width="1.8"
   stroke-linejoin="round">

   <rect x="332" y="565"
    width="24" height="17" rx="4"/>
   <path d="M338 565l2-4h8l2 4"/>
   <circle cx="344" cy="573.5" r="5"/>
  </g>
 </g>

</g>

<!-- ==============================
     PIN SCREEN
============================== -->

<g id="pinPage" display="none">

 <!-- Blurred lock-screen wallpaper -->
 <image id="pinWallpaper"
  x="-20" y="-20"
  width="430" height="656"
  preserveAspectRatio="xMidYMid slice"
  href="https://i.ibb.co/gMd6pkQ5/IMG-4434.jpg"
  filter="url(#pinBlur)"/>

 <!-- Dark overlay -->
 <rect width="390" height="616"
  fill="#17171D"
  fill-opacity=".25"/>

 <text x="195" y="130"
  text-anchor="middle"
  font-size="20"
  fill="#35313b">กรอกรหัส PIN</text>

 <g id="pinDots"
  stroke="#35313b"
  stroke-width="1.7"
  fill="none">
  <circle cx="147" cy="164" r="6"/>
  <circle cx="179" cy="164" r="6"/>
  <circle cx="211" cy="164" r="6"/>
  <circle cx="243" cy="164" r="6"/>
 </g>

 <text id="pinError"
  x="195" y="193"
  text-anchor="middle"
  font-size="12"
  fill="#8a4256"></text>

 <g id="keypad"></g>

</g>

<!-- ==============================
     TEMPORARY UNLOCK SCREEN
============================== -->

<g id="unlockedPage" display="none">
 <rect width="390" height="616" fill="#e8edf5"/>

 <text x="195" y="290"
  text-anchor="middle"
  font-size="22"
  fill="#4e6786">ปลดล็อกสำเร็จ</text>

 <text x="195" y="319"
  text-anchor="middle"
  font-size="13"
  fill="#73849c">
  หน้าหลักจะสร้างในขั้นต่อไป
 </text>
</g>

<!-- ==============================
     STATUS BAR
============================== -->

<g id="statusBar">

 <!-- Carrier -->
<text id="carrier"
  x="19" y="23"
  font-size="13"
  font-weight="700"
  fill="#35313B"
  stroke="#181820"
  stroke-opacity=".35"
  stroke-width=".4"
  paint-order="stroke fill">karan</text>

<!-- Samsung-style Silent -->
<g id="silentIcon"
 transform="translate(292 15)"
 fill="none"
 stroke="#35313B"
 stroke-linecap="round"
 stroke-linejoin="round">

 <!-- Speaker -->
 <path d="M0 4H3L7 1V11L3 8H0Z"
  fill="#35313B"
  stroke="none"/>

 <!-- Sound wave -->
 <path d="M9 3
          Q12 6 9 9
          M11 1
          Q16 6 11 11"
  stroke-width="1.3"/>

 <!-- Diagonal mute line -->
 <path d="M-1 0L13 12"
  stroke-width="1.7"/>

</g>

<!-- Mobile signal -->
<g fill="#35313B">
  <rect x="322" y="20" width="2.5" height="6" rx="1"/>
  <rect x="327" y="17" width="2.5" height="9" rx="1"/>
  <rect x="332" y="14" width="2.5" height="12" rx="1"/>
  <rect x="337" y="11" width="2.5" height="15" rx="1"/>
</g>

 <!-- Wi-Fi -->
 <g fill="none"
  stroke="#35313B"
  stroke-width="1.7"
  stroke-linecap="round">
  <path d="M347 16Q353 11 359 16"/>
  <path d="M350 20Q353 17 356 20"/>
  <circle cx="353" cy="23" r="1.4"
   fill="#35313B" stroke="none"/>
 </g>

 <!-- Battery -->
 <g id="batteryIcon">

  <defs>
   <clipPath id="batteryClip">
    <rect x="365" y="12"
     width="20" height="14" rx="5"/>
   </clipPath>
  </defs>

  <!-- Battery background -->
<rect x="365" y="12"
 width="20" height="14"
 rx="5"
 fill="#35313B"
 fill-opacity=".18"
 stroke="#35313B"
 stroke-width="1.3"/>

  <!-- Battery fill -->
  <rect id="batteryFill"
   x="365" y="12"
   width="17" height="14"
   fill="#17171D"
   clip-path="url(#batteryClip)"/>

  <!-- Battery terminal -->
 <rect id="batteryTerminal"
 x="385" y="16"
 width="3" height="6"
 rx="1"
 fill="#35313B"/>

  <!-- Battery number -->
  <text id="batteryLevel"
   x="375" y="22"
   text-anchor="middle"
   font-size="8"
   font-weight="800"
   fill="#FFFFFF">85</text>

 </g>

</g>

<!-- Front camera -->
<g id="frontCamera">
 <circle cx="195" cy="17" r="9" fill="#171922"/>
 <circle cx="195" cy="17" r="6" fill="#05070c"/>
 <circle cx="193" cy="15" r="1.5"
  fill="#53617a" opacity=".55"/>
</g>

<!-- Gesture bar -->
<rect id="gestureBar"
 x="145" y="604"
 width="100" height="4"
 rx="2" fill="#F5F1F2"/>

</svg>
</div>

<script>
"use strict";

/* ==========================================
   MAIN CONFIG
   ปรับตำแหน่งและหน้าตาจากจุดนี้
========================================== */

const CONFIG = {
 pin: "1906",

wallpaper:
  "https://i.ibb.co/gMd6pkQ5/IMG-4434.jpg",
  
 carrier: "karan",

textColor: "#35313B",

 lock: {
  x: 195,
  y: 49,
  scale: 0.75
 },

 date: {
  x: 195,
  y: 105,
  size: 14
 },

 clock: {
  x: 195,
  y: 182,
  size: 72,
  weight: 800
 },

 bottom: {
  y: 572,
  leftX: 46,
  rightX: 344
 },

 music: {
  x: 83,
  y: 548,
  width: 224,
  height: 49,
  background: "#70799d",
  title: "เพลงของการันต์",
  artist: "Music Player",
  playing: false
 },

 battery: {
  level: 85,
  showTerminal: true
 }
};

/* ==========================================
   STATE AND HELPERS
========================================== */

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("display");

let currentPage = "lock";
let enteredPIN = "";
let pinBusy = false;
let swipeStart = null;

const byId = id => document.getElementById(id);

function setAttributes(element, attributes) {
 if (!element) return;
 Object.entries(attributes).forEach(([name,value]) => {
  element.setAttribute(name,String(value));
 });
}

/* ==========================================
   CONFIG RENDER
========================================== */

function applyConfig() {
 const c = CONFIG;

 byId("wallpaper").setAttribute("href",c.wallpaper);
byId("pinWallpaper").setAttribute("href",c.wallpaper);
 byId("carrier").textContent = c.carrier;

 setAttributes(byId("lockIcon"),{
  transform:
   `translate(${c.lock.x} ${c.lock.y}) scale(${c.lock.scale})`
 });

 setAttributes(byId("dateText"),{
  x:c.date.x,
  y:c.date.y,
  "font-size":c.date.size,
  fill:c.textColor
 });

 setAttributes(byId("timeText"),{
  x:c.clock.x,
  y:c.clock.y,
  "font-size":c.clock.size,
  "font-weight":c.clock.weight,
  fill:c.textColor
 });

 byId("songTitle").textContent = c.music.title;
 byId("songArtist").textContent = c.music.artist;

 const m = c.music;
 const centerY = m.y + m.height / 2;

 setAttributes(byId("musicBG"),{
  x:m.x,
  y:m.y,
  width:m.width,
  height:m.height,
  rx:m.height/2,
  fill:m.background
 });

 const musicOffsetX = m.x - 83;
 const musicOffsetY = centerY - 572.5;

 setAttributes(byId("albumArt"),{
  transform:
   `translate(${musicOffsetX} ${musicOffsetY})`
 });

 setAttributes(byId("songTitle"),{
  x:132+musicOffsetX,
  y:569+musicOffsetY
 });

 setAttributes(byId("songArtist"),{
  x:132+musicOffsetX,
  y:583+musicOffsetY
 });

 setAttributes(byId("previous"),{
  transform:
   `translate(${m.x+160} ${centerY})`
 });

 setAttributes(byId("playButton"),{
  transform:
   `translate(${m.x+185} ${centerY})`
 });

 setAttributes(byId("next"),{
  transform:
   `translate(${m.x+209} ${centerY})`
 });

 const leftX = c.bottom.leftX;
 const rightX = c.bottom.rightX;
 const bottomY = c.bottom.y;

 setAttributes(byId("phoneShortcut"),{
  transform:
   `translate(${leftX-46} ${bottomY-572})`
 });

 setAttributes(byId("cameraShortcut"),{
  transform:
   `translate(${rightX-344} ${bottomY-572})`
 });

const level = Math.max(0, Math.min(100, c.battery.level));

byId("batteryLevel").textContent = level;

byId("batteryFill").setAttribute(
  "width",
  20 * level / 100
);

byId("batteryLevel").setAttribute(
  "fill",
  level >= 50 ? "#FFFFFF" : "#17171D"
);

byId("batteryTerminal").setAttribute(
  "display",
  c.battery.showTerminal ? "inline" : "none"
);

updatePlayIcon();
}

/* ==========================================
   CLOCK AND DATE
========================================== */

function updateClock() {
 const now = new Date();

 const time = now.toLocaleTimeString("th-TH",{
  hour:"2-digit",
  minute:"2-digit",
  hour12:false
 });

 const date = now.toLocaleDateString("th-TH",{
  weekday:"long",
  day:"numeric",
  month:"long"
 });

 byId("timeText").textContent=time;
 byId("dateText").textContent=date;
}

/* ==========================================
   MUSIC
========================================== */

function updatePlayIcon() {
 const path = byId("playShape");

 if(CONFIG.music.playing){
  path.setAttribute(
   "d","M-5-7H-1V7H-5ZM2-7H6V7H2Z"
  );
 } else {
  path.setAttribute(
   "d","M-4-7L7 0-4 7Z"
  );
 }
}

byId("playButton").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=!CONFIG.music.playing;
 updatePlayIcon();
});

byId("previous").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=false;
 updatePlayIcon();
});

byId("next").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=false;
 updatePlayIcon();
});

/* ==========================================
   SCREEN MANAGEMENT
========================================== */

function showPage(page) {
 currentPage=page;

 byId("lockPage").setAttribute(
  "display",page==="lock"?"inline":"none"
 );

 byId("pinPage").setAttribute(
  "display",page==="pin"?"inline":"none"
 );

 byId("unlockedPage").setAttribute(
  "display",page==="unlocked"?"inline":"none"
 );

 byId("statusBar").setAttribute(
  "display",page==="unlocked"?"none":"inline"
 );

 byId("frontCamera").setAttribute(
  "display",page==="unlocked"?"none":"inline"
 );
}

function openPIN() {
 if(currentPage!=="lock")return;

 enteredPIN="";
 pinBusy=false;
 byId("pinError").textContent="";
 updateDots();
 showPage("pin");
}

function updateDots() {
 document.querySelectorAll("#pinDots circle")
  .forEach((dot,index)=>{
   dot.setAttribute(
    "fill",
    index<enteredPIN.length?"#35313b":"none"
   );
  });
}

function pressPIN(value) {
 if(currentPage!=="pin"||pinBusy)return;

 if(value==="cancel"){
  showPage("lock");
  return;
 }

 if(value==="delete"){
  enteredPIN=enteredPIN.slice(0,-1);
  updateDots();
  return;
 }

 if(enteredPIN.length>=4)return;

 enteredPIN+=value;
 updateDots();

 if(enteredPIN.length===4){
  pinBusy=true;

  if(enteredPIN===CONFIG.pin){
   setTimeout(()=>{
    pinBusy=false;
    showPage("unlocked");
   },180);
  }else{
   byId("pinError").textContent=
    "รหัส PIN ไม่ถูกต้อง";

   setTimeout(()=>{
    enteredPIN="";
    pinBusy=false;
    updateDots();
   },450);
  }
 }
}

/* ==========================================
   CREATE SVG PIN KEYPAD
========================================== */


function createKeypad() {
  const keypad = byId("keypad");
  keypad.replaceChildren();

  // ตัวเลข 1–9 และ 0 อยู่ตรงกลางแถวสุดท้าย
  const keys = [
    ["1", 95, 255], ["2", 195, 255], ["3", 295, 255],
    ["4", 95, 337], ["5", 195, 337], ["6", 295, 337],
    ["7", 95, 419], ["8", 195, 419], ["9", 295, 419],
    ["0", 195, 501]
  ];

  keys.forEach(([value, x, y]) => {
    const group = document.createElementNS(NS, "g");
    group.setAttribute("class", "clickable");

    const circle = document.createElementNS(NS, "circle");
    setAttributes(circle, {
      cx: x,
      cy: y,
      r: 32,
      fill: "#FFFFFF",
      "fill-opacity": ".24",
      stroke: "#FFFFFF",
      "stroke-opacity": ".25",
      "stroke-width": 1
    });

    const label = document.createElementNS(NS, "text");
    setAttributes(label, {
      x: x,
      y: y + 10,
      "text-anchor": "middle",
      fill: "#35313B",
      "font-size": 30,
      "font-weight": 400
    });
    label.textContent = value;

    group.append(circle, label);
    group.addEventListener("click", event => {
      event.stopPropagation();
      pressPIN(value);
    });
    keypad.appendChild(group);
  });

  // ปุ่มด้านล่าง แยกจากวงกลมตัวเลข
  [
    ["ฉุกเฉิน", 75, 579, "emergency"],
    ["ยกเลิก", 315, 579, "cancel"]
  ].forEach(([text, x, y, action]) => {
    const group = document.createElementNS(NS, "g");
    group.setAttribute("class", "clickable");

    const hitbox = document.createElementNS(NS, "rect");
    setAttributes(hitbox, {
      x: x - 46,
      y: y - 24,
      width: 92,
      height: 40,
      fill: "transparent"
    });

    const label = document.createElementNS(NS, "text");
    setAttributes(label, {
      x: x,
      y: y,
      "text-anchor": "middle",
      fill: "#35313B",
      "font-size": 14
    });
    label.textContent = text;

    group.append(hitbox, label);

    group.addEventListener("click", event => {
      event.stopPropagation();

      if (action === "cancel") {
        pressPIN("cancel");
      } else {
        // ยังไม่มีระบบโทรฉุกเฉินในเกม
        byId("pinError").textContent =
          "ยังไม่เปิดใช้งานการโทรฉุกเฉิน";
      }
    });

    keypad.appendChild(group);
  });
}

/* ==========================================
   SWIPE TO UNLOCK
========================================== */

function svgY(event) {
 const rect=svg.getBoundingClientRect();
 return (event.clientY-rect.top)*616/rect.height;
}

svg.addEventListener("pointerdown",event=>{
 if(currentPage!=="lock")return;
 swipeStart=svgY(event);
});

svg.addEventListener("pointerup",event=>{
 if(currentPage!=="lock"||swipeStart===null)return;

 const distance=swipeStart-svgY(event);
 swipeStart=null;

 if(distance>35){
  openPIN();
 }
});

svg.addEventListener("pointercancel",()=>{
 swipeStart=null;
});

byId("phoneShortcut").addEventListener("click",openPIN);
byId("cameraShortcut").addEventListener("click",openPIN);

document.addEventListener("keydown",event=>{
 if(currentPage==="pin"){
  if(/^[0-9]$/.test(event.key))pressPIN(event.key);
  else if(event.key==="Backspace")pressPIN("delete");
  else if(event.key==="Escape")pressPIN("cancel");
 }else if(currentPage==="lock"&&event.key==="ArrowUp"){
  openPIN();
 }
});

/* ==========================================
   INITIALIZE
========================================== */

createKeypad();
applyConfig();
updateClock();
setInterval(updateClock,1000);
showPage("lock");
</script>

  let currentTab = "chats";

  function page(name) {
    Object.keys(pages).forEach(key => {
      pages[key].classList.toggle("active", key === name);
    });
  }

  function openHome() {
    root.style.display = "block";
    page("home");
  }

  function openLine() {
    root.style.display = "block";
    setTab("chats");
  }

  function closeAddon() {
    root.style.display = "none";
  }

  function setTab(tab) {
    currentTab = tab;
    $("kgChatsTab").classList.toggle("selected",tab==="chats");
    $("kgFriendsTab").classList.toggle("selected",tab==="friends");
    $("kgNavChats").classList.toggle("selected",tab==="chats");
    $("kgNavFriends").classList.toggle("selected",tab==="friends");
    renderList();
    page("line");
  }

  function renderList() {
    const list = $("kgList");
    const search = $("kgSearch").value.trim().toLowerCase();
    list.replaceChildren();

    contacts.filter(c =>
      c.name.toLowerCase().includes(search)
    ).forEach(contact => {
      const button = document.createElement("button");
      button.className = "kg-person";

      const avatar = document.createElement("span");
      avatar.className = "kg-avatar";
      avatar.style.background = contact.color;
      avatar.textContent = contact.name.charAt(0);

      const info = document.createElement("span");
      info.className = "kg-person-info";

      const name = document.createElement("div");
      name.className = "kg-person-name";
      name.textContent = contact.name;

      const preview = document.createElement("div");
      preview.className = "kg-preview";
      const last = contact.messages.at(-1);
      preview.textContent = last ? last.text : "เริ่มการสนทนา";

      info.append(name,preview);
      button.append(avatar,info);
      button.onclick = () => openChat(contact.id);
      list.appendChild(button);
    });
  }

  function openChat(id) {
    currentContact = contacts.find(c => c.id === id);
    if (!currentContact) return;

    $("kgChatTitle").textContent = currentContact.name;
    renderMessages();
    page("chat");
  }

  function renderMessages() {
    const box = $("kgMessages");
    box.replaceChildren();
    if (!currentContact) return;

    currentContact.messages.forEach(message => {
      const bubble = document.createElement("div");
      bubble.className =
        "kg-bubble " + (message.from === "me" ? "me" : "them");
      bubble.textContent = message.text;
      box.appendChild(bubble);
    });

    box.scrollTop = box.scrollHeight;
  }

  $("kgOpenLine").onclick = openLine;
  $("kgChatsTab").onclick = () => setTab("chats");
  $("kgFriendsTab").onclick = () => setTab("friends");
  $("kgNavChats").onclick = () => setTab("chats");
  $("kgNavFriends").onclick = () => setTab("friends");
  $("kgNavHome").onclick = openHome;
  $("kgSearch").oninput = renderList;
  $("kgBack").onclick = openLine;
  $("kgLineGesture").onclick = openHome;
  $("kgChatGesture").onclick = openHome;

  $("kgCompose").onsubmit = function(event) {
    event.preventDefault();
    const input = $("kgMessageInput");
    const value = input.value.trim();
    if (!value || !currentContact) return;

    currentContact.messages.push({
      from:"me",
      text:value
    });
    input.value = "";
    renderMessages();
    renderList();
  };

  // ฟังก์ชันสำหรับเชื่อมเนื้อเรื่องเกมในอนาคต
  window.openKaranHome = openHome;
  window.openKaranLine = openLine;
  window.closeKaranHomeLine = closeAddon;

  window.karanLineReceive = function(id,text) {
    const contact = contacts.find(c => c.id === id);
    if (!contact) return false;

    contact.messages.push({
      from:"them",
      text:String(text)
    });
    renderList();

    if (currentContact === contact) renderMessages();
    return true;
  };

  // เชื่อมหน้า Home กับระบบปลดล็อกจริงของการันต์
  const unlockedPage = document.getElementById("unlockedPage");

  if (unlockedPage) {
    const observer = new MutationObserver(() => {
      const unlocked =
        unlockedPage.getAttribute("display") !== "none";

      if (unlocked && root.style.display !== "block") {
        openHome();
      }
    });

    observer.observe(unlockedPage, {
      attributes: true,
      attributeFilter: ["display"]
    });

    if (unlockedPage.getAttribute("display") !== "none") {
      openHome();
    }
  }

  renderList();
})();

      answer:"ได้สิครับ เดี๋ยวผมไปหาอชิที่แผนก",
      reply:"ได้ครับ งั้นผมรออยู่ที่โต๊ะนะครับ"
    }
  };

  function receive(text) {
    if (typeof window.karanLineReceive === "function") {
      window.karanLineReceive("achi",text);
    }
  }

  function sendAsKaran(text) {
    const input = $("kgMessageInput");
    const form = $("kgCompose");

    if (!input || !form) return;

    input.value = text;

    form.dispatchEvent(new Event("submit",{
      bubbles:true,
      cancelable:true
    }));
  }

  function isAchiChat() {
    return chat.classList.contains("active") &&
      $("kgChatTitle")?.textContent.trim() === "อชิ";
  }

  function updateChoices() {
    const visible = isAchiChat();

    if (!visible) {
      choices.style.display = "none";
      return;
    }

    if (story.stage === "choose") {
      choices.style.display = "flex";

      choices.querySelectorAll("[data-choice]").forEach(
        button => button.style.display = "block"
      );

      $("ksContinue").style.display = "none";
    } else if (story.stage === "continue") {
      choices.style.display = "flex";

      choices.querySelectorAll("[data-choice]").forEach(
        button => button.style.display = "none"
      );

      $("ksContinue").style.display = "block";
    } else {
      choices.style.display = "none";
    }
  }

  function openAchiChat() {
    if (typeof window.openKaranLine === "function") {
      window.openKaranLine();
    }

    const search = $("kgSearch");
    if (search) {
      search.value = "";
      search.dispatchEvent(new Event("input",{
        bubbles:true
      }));
    }

    const achi = [...document.querySelectorAll(
      "#kgList .kg-person"
    )].find(button =>
      button.querySelector(".kg-person-name")
        ?.textContent.trim() === "อชิ"
    );

    if (achi) achi.click();

    updateChoices();
  }

  function startChapter() {
    if (story.started) return;

    story.started = true;
    story.stage = "choose";

    // แทนข้อความตัวอย่างเดิมของอชิ
    const achi = [...document.querySelectorAll(
      "#kgList .kg-person"
    )].find(button =>
      button.querySelector(".kg-person-name")
        ?.textContent.trim() === "อชิ"
    );

    if (achi) {
      achi.click();

      const messages = $("kgMessages");
      if (messages) {
        messages.replaceChildren();
      }
    }

    receive(openingMessage);
    receive(secondMessage);

    // กลับไปหน้า Home เพื่อให้ผู้เล่นกดแจ้งเตือน
    if (typeof window.openKaranHome === "function") {
      window.openKaranHome();
    }

    $("ksNotification").style.display = "flex";
  }

  $("ksNotification").addEventListener("click", () => {
    $("ksNotification").style.display = "none";
    openAchiChat();
  });

  choices.addEventListener("click", event => {
    const button = event.target.closest("[data-choice]");
    if (!button || story.stage !== "choose") return;

    const number = button.dataset.choice;
    const route = routes[number];
    if (!route) return;

    story.choice = number;
    story.stage = "replying";

    choices.style.display = "none";
    sendAsKaran(route.answer);

    setTimeout(() => {
      receive(route.reply);
      story.stage = "continue";
      updateChoices();
    },900);
  });

  $("ksContinue").addEventListener("click", () => {
    story.stage = "finished";
    choices.style.display = "none";

    const next = {
      1:"ถ้าอย่างนั้นผมขอเข้าไปปรึกษาที่โต๊ะคุณการันต์ได้ไหมครับ",
      2:"เรื่องงานน่ะครับ... คุณการันต์สะดวกให้ผมเข้าไปหาไหมครับ",
      3:"ขอบคุณครับ เดี๋ยวผมเตรียมเอกสารไว้ให้ครับ"
    };

    receive(next[story.choice]);

    setTimeout(() => {
      receive("แล้วเจอกันนะครับ");
    },750);
  });

  // ติดตามการเปิดและปิดห้องแชต
  const chatObserver = new MutationObserver(updateChoices);

  chatObserver.observe(chat,{
    attributes:true,
    attributeFilter:["class"]
  });

  const chatTitle = $("kgChatTitle");
  if (chatTitle) {
    new MutationObserver(updateChoices).observe(chatTitle,{
      childList:true,
      characterData:true,
      subtree:true
    });
  }

  // เชื่อมกับระบบปลดล็อก PIN 1906 โดยตรง
  // ไม่เปลี่ยนการทำงานของ showPage เดิม
  if (typeof showPage === "function") {
    const originalShowPage = showPage;

    showPage = function(page) {
      originalShowPage(page);

      if (page === "unlocked") {
        if (typeof window.openKaranHome === "function") {
          window.openKaranHome();
        }

        if (!story.started) {
          setTimeout(startChapter,500);
        }
      }
    };
  }

  // สำหรับเรียกจากบทถัดไป
  window.karanStory = story;
  window.karanStartChapter1 = startChapter;

})();
</script>
<!-- END KARAN STORY : CHAPTER 1 -->
