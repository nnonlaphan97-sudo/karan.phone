<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KARAN'S PHONE</title><style>
:root{font-family:Arial,'Noto Sans Thai',sans-serif;color:#182235;background:#d9dee8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center}.device{width:min(100vw,430px);height:min(100dvh,920px);min-height:620px;background:#111827;border:7px solid #182033;border-radius:36px;overflow:hidden;position:relative;box-shadow:0 18px 70px #1c2a4466}.screen{position:absolute;inset:0;background:#f8fafc;overflow:hidden}.wall{background:linear-gradient(150deg,#1b2b4a 0%,#334a70 53%,#8997b8 100%);color:white}.status{height:37px;display:flex;align-items:center;justify-content:space-between;padding:8px 20px 0;font-size:12px;position:relative;z-index:5}.status-right{display:flex;gap:7px;align-items:center}.camera{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#0c1523;border:2px solid #27364c;z-index:8}.bottom{position:absolute;bottom:0;left:0;right:0;height:31px;display:grid;place-items:center;z-index:7;cursor:pointer}.handle{width:110px;height:4px;border-radius:6px;background:currentColor;opacity:.55}.locktime{padding-top:70px;text-align:center}.locktime .date{font-size:15px;opacity:.85}.locktime .clock{font-size:66px;font-weight:300;letter-spacing:-4px}.lockhint{position:absolute;bottom:85px;text-align:center;width:100%;font-size:13px;opacity:.85}.unlockbtn{border:1px solid #ffffff55;background:#ffffff16;color:white;padding:12px 25px;border-radius:22px;margin-top:20px}.homehead{padding:45px 25px 18px}.homehead h1{font-size:32px;font-weight:350;margin:0}.homehead p{font-size:13px;opacity:.8}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 8px;padding:18px 14px}.app{border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:7px;font:inherit;font-size:12px;cursor:pointer}.appicon{width:61px;height:61px;border-radius:19px;background:#ffffff30;display:grid;place-items:center;box-shadow:0 3px 12px #11182718}.app.locked .appicon{background:#18253e85;border:1px solid #ffffff20}.app svg{width:28px;height:28px;stroke:white;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.app .name{max-width:100%;white-space:nowrap}.topbar{height:59px;display:flex;align-items:center;gap:13px;padding:0 15px;border-bottom:1px solid #e7ebf1;background:white}.topbar strong{flex:1;font-size:18px}.iconbtn{border:0;background:none;color:#26334b;padding:6px;cursor:pointer;display:grid;place-items:center}.iconbtn svg,.tinyicon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.content{height:calc(100% - 127px);overflow-y:auto;padding:14px}.chatrow{display:flex;gap:13px;padding:15px 4px;border-bottom:1px solid #e9edf2;cursor:pointer}.avatar{height:45px;width:45px;border-radius:50%;background:#e5eaf3;display:grid;place-items:center;color:#5b6c87;flex-shrink:0}.avatar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}.chatmain{flex:1;min-width:0}.chatmain .line1{display:flex;justify-content:space-between;gap:5px}.chatmain small{color:#7c8798}.preview{font-size:13px;color:#7b8493;margin-top:7px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.chatbg{background:#d8e1ed}.messages{display:flex;flex-direction:column;gap:13px;padding:17px 13px 100px;min-height:100%}.bubble{max-width:82%;background:white;border-radius:15px 15px 15px 4px;padding:11px 13px;font-size:14px;line-height:1.65;white-space:pre-wrap;box-shadow:0 1px 2px #0000000d}.bubble.mine{align-self:flex-end;background:#b7eb9d;border-radius:15px 15px 4px 15px}.bubble.theirs{align-self:flex-start}.bubble time{display:block;text-align:right;font-size:10px;color:#718096;margin-top:4px}.choices{position:absolute;bottom:31px;left:0;right:0;z-index:6;background:#f8fafc;padding:11px;border-top:1px solid #e2e8f0}.choices button,.action{width:100%;border:1px solid #cdd7e5;background:white;border-radius:12px;padding:12px;margin:5px 0;font:inherit;font-size:13px;text-align:left;color:#25344b;cursor:pointer}.action.primary{background:#234c81;color:white;border:0;text-align:center}.action:disabled{opacity:.45}.panel{background:white;border:1px solid #e5eaf0;border-radius:16px;padding:16px;margin-bottom:13px}.panel h3{margin:0 0 9px;font-size:15px}.panel p{font-size:13px;line-height:1.7;color:#526176}.muted{color:#718096;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:11px;background:#e8eef6;padding:5px 9px;border-radius:20px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{border:0;background:#edf1f6;border-radius:10px;aspect-ratio:1;display:grid;place-items:center;font:inherit;font-size:13px;color:#384861}.day.special{background:#b8cbe5;font-weight:bold}.day.active{background:#264e84;color:white}.wedding{background:#f5eee2;min-height:355px;border:1px solid #cdbda7;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#6a594a;position:relative;gap:13px}.wedding:before{content:'';position:absolute;inset:9px;border:1px solid #bda88e;pointer-events:none}.wedding h2{font:normal 34px Georgia,serif;margin:5px}.wedding .amp{font:italic 23px Georgia,serif}.wedding .over{letter-spacing:3px;font-size:10px}.wedding .quote{font-size:12px}.swatches{display:flex;gap:9px;justify-content:center;margin:13px 0}.swatch{width:36px;height:36px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #a4b1c2;cursor:pointer}.field{display:block;font-size:12px;margin:14px 0 5px}.input{width:100%;padding:12px;border:1px solid #d7dfe8;border-radius:10px;font:inherit}.toast{position:absolute;bottom:42px;left:12%;right:12%;background:#1e293bdc;color:white;border-radius:14px;padding:12px;text-align:center;font-size:12px;z-index:10;pointer-events:none}.smallcard{padding:13px;border-radius:13px;background:#f1f5fa;margin:9px 0}.smallcard strong{font-size:14px}.smallcard p{margin:5px 0 0}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{height:145px;border-radius:13px;background:linear-gradient(145deg,#b9c8db,#6d85a8);display:grid;place-items:center;color:#fff;text-align:center;padding:14px;font-size:13px;cursor:pointer}.photo:nth-child(2){background:linear-gradient(140deg,#c3ad9b,#677e91)}.photo:nth-child(3){background:linear-gradient(140deg,#b8a8c8,#647b9c)}.photo:nth-child(4){background:linear-gradient(140deg,#b7c9b6,#6c8c7c)}.progress{height:5px;background:#e4eaf2;border-radius:8px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#5079ad;transition:width .2s}.footnote{font-size:11px;color:#78869a;line-height:1.5}.hidden{display:none!important}@media(min-width:500px){body{padding:20px}}@media(max-width:440px){.device{border:0;border-radius:0;width:100vw;height:100dvh;min-height:0}.camera{top:6px}} </style></head><body><div class="device"><div id="screen" class="screen wall"></div><div class="camera"></div></div><script>
const paths={back:'<path d="m15 18-6-6 6-6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',line:'<path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-4.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 4 8.5 8.5 0 0 1 20 11.5Z"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19 19 0 0 1-8.3-3 19 19 0 0 1-6-6 19 19 0 0 1-3-8.4A2 2 0 0 1 4.5 2h3a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.6 1.8L7.7 10a16 16 0 0 0 6.3 6.3l1.5-1.7a2 2 0 0 1 1.8-.6l3 .5a2 2 0 0 1 1.7 1.8Z"/>',gallery:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',note:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',orders:'<path d="M5 8h14l-1 13H6L5 8ZM9 9V6a3 3 0 0 1 6 0v3"/>',browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',files:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',wifi:'<path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>',signal:'<path d="M4 20v-4M9 20v-8M14 20V8M19 20V4"/>',battery:'<rect x="2" y="6" width="18" height="12" rx="3"/><path d="M22 10v4"/><rect x="5" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/>',check:'<path d="m4 12 5 5L20 6"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'};
const svg=(name,size=24)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.lock}</svg>`;
const APPS=[['LINE','line','#06c755'],['โทรศัพท์','phone','#4ba980'],['แกลเลอรี','gallery','#9c86b8'],['ปฏิทิน','calendar','#5c8bc9'],['โน้ต','note','#c8a65c'],['คำสั่งซื้อ','orders','#d58c68'],['เบราว์เซอร์','browser','#598db9'],['นาฬิกา','clock','#8b88bd'],['ไฟล์','files','#879cb5']];
const key='karan_phone_demo_v1';const fresh=()=>({unlocked:['LINE'],flags:{},choices:{},chapter:1,card:{color:'cream',style:'classic',text:'Together, always.'}});let state;try{state=JSON.parse(localStorage.getItem(key))||fresh()}catch{state=fresh()}let page='lock',thread='พี่ดุจ',toast='',day=30;const save=()=>localStorage.setItem(key,JSON.stringify(state));const flag=k=>{state.flags[k]=true;save()};const has=k=>!!state.flags[k];const unlock=(app)=>{if(!state.unlocked.includes(app)){state.unlocked.push(app);save();notify('แอป '+app+' พร้อมใช้งานแล้ว')}};function notify(s){toast=s;render();setTimeout(()=>{toast='';render()},2200)};
function status(dark=false){return `<div class="status" style="color:${dark?'#23314a':'white'}"><span>karan</span><span class="status-right">${svg('signal',15)}${svg('wifi',15)}${svg('battery',20)}</span></div>`}function shell(inner,wall=false){return `<div class="screen ${wall?'wall':''}">${status(!wall)}${inner}<div class="bottom" onclick="go('home')"><div class="handle"></div></div>${toast?`<div class="toast">${toast}</div>`:''}</div>`}function top(title,back='home'){return `<div class="topbar"><button class="iconbtn" onclick="go('${back}')" aria-label="กลับ">${svg('back')}</button><strong>${title}</strong></div>`}function go(p){page=p;render()}function app(n){if(!state.unlocked.includes(n)){notify('ยังไม่สามารถเปิดแอปนี้ได้');return}go(n)}
function render(){let html='';if(page==='lock'){html=shell(`<div class="locktime"><div class="date">KARAN'S PHONE</div><div class="clock">21:36</div><div class="date">ความทรงจำของการันต์และอชิ</div><button class="unlockbtn" onclick="go('home')">เปิดโทรศัพท์</button></div><div class="lockhint">แตะเพื่อสำรวจเรื่องราวย้อนหลัง</div>`,true)}else if(page==='home'){html=shell(`<div class="homehead"><h1>21:36</h1><p>KARAN'S PHONE</p></div><div class="apps">${APPS.map(([n,i,c])=>{let open=state.unlocked.includes(n);return `<button class="app ${open?'':'locked'}" onclick="app('${n}')"><span class="appicon" style="${open?`background:${c}`:''}">${svg(open?i:'lock',28)}</span><span class="name">${n}</span></button>`}).join('')}</div><div style="position:absolute;bottom:49px;width:100%;text-align:center;font-size:11px;opacity:.72">แตะแอปเพื่อสำรวจ</div>`,true)}else if(page==='LINE'){let chats=[['พี่ดุจ','เรื่องเค้กวันเกิดอชิ','28–30 ม.ค.'],['อชิ','ข้อความระหว่างการันต์และอชิ','30 ม.ค.'],['ประสานงานออฟฟิศ','ปาย ร็อค อชิ และทีมงาน','30 ม.ค.'],['ทีมฝ่ายขาย','ข้อมูลการทำงานของการันต์','30 ม.ค.']];html=shell(top('LINE')+`<div class="content">${chats.map(([n,p,t])=>`<div class="chatrow" onclick="openChat('${n}')"><div class="avatar">${svg('user')}</div><div class="chatmain"><div class="line1"><strong>${n}</strong><small>${t}</small></div><div class="preview">${p}</div></div></div>`).join('')}</div>`)}else if(page==='chat'){html=renderChat()}else if(page==='ปฏิทิน'){html=renderCalendar()}else if(page==='คำสั่งซื้อ'){html=renderOrders()}else if(page==='โน้ต'){html=renderNotes()}else if(page==='โทรศัพท์'){html=renderCalls()}else if(page==='แกลเลอรี'){html=renderGallery()}else if(page==='นาฬิกา'){html=shell(top('นาฬิกา')+`<div class="content"><div class="panel"><h3>นาฬิกาปลุก</h3>${['06:30 — วันทำงาน','07:00 — วันทำงาน','07:15 — ปลุกสำรอง'].map(s=>`<div class="smallcard">${s}</div>`).join('')}</div></div>`)}else if(page==='เบราว์เซอร์'){html=shell(top('เบราว์เซอร์')+`<div class="content"><div class="panel"><h3>ประวัติการค้นหา</h3><p>ร้านอาหารใกล้ที่ทำงาน</p><p>การเลือกของขวัญให้คนสำคัญ</p><p>สถานที่สำหรับวันพิเศษ</p><button class="action" onclick="discover('browser')">ดูประวัติการค้นหาเพิ่มเติม</button></div></div>`)}else if(page==='ไฟล์'){html=shell(top('ไฟล์')+`<div class="content"><div class="panel"><h3>เอกสาร</h3><p>รายงานฝ่ายขาย</p><p>เอกสารการประชุม</p><p>รายละเอียดงานแต่งงาน</p><button class="action primary" onclick="go('designer')">เปิดไฟล์การ์ดแต่งงาน</button></div></div>`)}else if(page==='designer'){html=renderDesigner()}document.getElementById('screen').outerHTML=html.replace('<div class="screen','<div id="screen" class="screen');}
function openChat(n){thread=n;page='chat';if(n==='พี่ดุจ')flag('dujOpened');render()}
function message(t,mine=false,time=''){return `<div class="bubble ${mine?'mine':'theirs'}">${t}<time>${time}</time></div>`}
function choose(k,val){state.choices[k]=val;save();if(k==='cake')flag('cakeReply');if(k==='achi')flag('achiReply');if(k==='office')flag('officeReply');if(k==='duj2')flag('duj2Reply');if(has('achiReply')&&has('duj2Reply'))unlock('แกลเลอรี');if(has('cakeReply')&&has('dujOpened'))unlock('ปฏิทิน');render()}
function renderChat(){let arr=[],choice='';if(thread==='พี่ดุจ'){arr=[message('การันต์ วันที่ 30 เป็นวันเกิดอชิใช่ไหมจ๊ะ','', '28 ม.ค.'),message('ครับ ผมเห็นในปฏิทินบริษัทน่ะครับ',true,'28 ม.ค.'),message('พี่ช่วยเรื่องเค้กได้เลยนะ เดี๋ยวพี่ดูให้','', '28 ม.ค.'),message('ขอบคุณครับ ถ้ามีอะไรให้ผมช่วยเพิ่มเติม บอกได้เลยนะครับ',true,'29 ม.ค.'),message('ร้านยืนยันแล้วจ้ะ พรุ่งนี้พี่จัดการให้'),message('ว่าแต่การันต์อยากให้พี่บอกอชิไหมว่าใครเป็นคนเตรียมเค้ก?')];if(!state.choices.cake)choice=options('cake',['ไม่ต้องบอกก็ได้ครับ ผมแค่อยากให้อชิมีความสุขในวันเกิด','บอกว่าเป็นเค้กจากทุกคนในออฟฟิศก็ได้ครับ','แล้วแต่พี่ดุจสะดวกเลยครับ ผมไม่ติดอะไร']);else{arr.push(message(state.choices.cake,true,'อ่านแล้ว'));arr.push(message('ได้เลยจ้ะ พี่จะจัดการให้เรียบร้อย'));arr.push(message('30 มกราคม — อชิได้รับเค้กแล้วนะ ดูดีใจมากเลย'));if(!state.choices.duj2)choice=options('duj2',['ขอบคุณพี่ดุจมากครับ','ดีแล้วครับ ฝากขอบคุณทุกคนด้วยนะครับ']);else{arr.push(message(state.choices.duj2,true));arr.push(message('ยินดีจ้ะ'));}}}else if(thread==='อชิ'){arr=[message('คุณการันต์ครับ ขอบคุณเรื่องเมื่อวานนะครับ'),message('ยินดีครับอชิ',true),message('ผมเกรงใจจังเลยครับ')];if(!state.choices.achi)choice=options('achi',['ไม่ต้องเกรงใจเลยครับ','ผมยินดีช่วยครับ ถ้ามีอะไรบอกได้เลยนะครับ','พักผ่อนด้วยนะครับ']);else{arr.push(message(state.choices.achi,true));arr.push(message('ขอบคุณครับคุณการันต์'));}}else if(thread==='ประสานงานออฟฟิศ'){arr=[message('ปาย: วันนี้มีน้องใหม่เข้าทีมโปรโมชั่นนะคะ ชื่อร็อคค่ะ'),message('ร็อค: สวัสดีครับ ผมร็อคครับ ฝากเนื้อฝากตัวด้วยนะครับ'),message('อชิ: ยินดีต้อนรับนะครับ ถ้าต้องประสานงานเรื่องเอกสาร ติดต่อผมได้เลยครับ')];if(!state.choices.office)choice=options('office',['ยินดีต้อนรับครับ','ยินดีต้อนรับนะครับร็อค']);else{arr.push(message(state.choices.office,true));arr.push(message('ร็อค: ขอบคุณครับคุณการันต์'));}}else{arr=[message('ฝ่ายขาย: ส่งเอกสารให้ลูกค้าเรียบร้อยแล้วครับ'),message('ขอบคุณครับ ฝากติดตามผลด้วยนะครับ',true),message('ฝ่ายขาย: รับทราบครับ')]}
return shell(top(thread,'LINE')+`<div class="content chatbg" style="padding:0;${choice?"height:calc(100% - 340px)":""}"><div class="messages">${arr.join('')}</div></div>${choice}`)}
function options(k,opts){return `<div class="choices"><div class="muted">เลือกข้อความตอบกลับ</div>${opts.map((s,i)=>`<button onclick="choose('${k}',${JSON.stringify(s).replace(/"/g,'&quot;')})">${s}</button>`).join('')}</div>`}
function renderCalendar(){return shell(top('ปฏิทิน')+`<div class="content"><div class="panel"><h3>มกราคม</h3><div class="calendar-grid">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<div class="muted">${x}</div>`).join('')}${Array.from({length:31},(_,i)=>`<button class="day ${i+1===30?'special':''} ${day===i+1?'active':''}" onclick="selectDay(${i+1})">${i+1}</button>`).join('')}</div></div><div class="panel"><h3>${day} มกราคม</h3>${day===30?`<div class="smallcard"><strong>วันเกิดอชิ</strong><p>ปฏิทินบริษัท</p><button class="action" onclick="seeBirthday()">ดูรายละเอียด</button></div><div class="smallcard">09:30 ประชุมฝ่ายขาย</div>`:`<p>รายการงานประจำวันและนัดหมายฝ่ายขาย</p>`}</div></div>`)}function selectDay(n){day=n;render()}function seeBirthday(){flag('birthday');if(has('cakeReply'))unlock('คำสั่งซื้อ');notify('เปิดรายละเอียดวันเกิดอชิแล้ว')}
function renderOrders(){return shell(top('คำสั่งซื้อ')+`<div class="content"><div class="panel"><h3>ประวัติคำสั่งซื้อ</h3><div class="smallcard"><strong>เค้กวันเกิด</strong><p>สั่งล่วงหน้า 28 มกราคม · รับ 30 มกราคม</p><p>ผู้รับสินค้า: พี่ดุจ</p><button class="action" onclick="inspectOrder('cake')">รายละเอียดคำสั่งซื้อ</button></div><div class="smallcard"><strong>อาหารเย็น 2 ชุด</strong><p>จัดส่งที่อาคารสำนักงาน</p><button class="action" onclick="inspectOrder('food')">รายละเอียดคำสั่งซื้อ</button></div></div></div>`)}function inspectOrder(k){flag(k+'Order');if(k==='cake')unlock('โทรศัพท์');if(k==='food')unlock('โน้ต');notify(k==='cake'?'พบข้อมูลการรับเค้ก':'พบรายละเอียดการจัดส่งอาหาร')}
function renderNotes(){return shell(top('โน้ต')+`<div class="content"><div class="panel"><h3>งานประจำสัปดาห์</h3><p>ติดตามรายงานฝ่ายขาย<br>ตรวจเอกสารเสนอราคา<br>ยืนยันนัดหมายลูกค้า</p></div><div class="panel"><h3>30 มกราคม</h3><p>เค้ก — พี่ดุจ<br>ตรวจตารางประชุม<br>อาหารเย็น</p><button class="action" onclick="discover('note')">ดูบันทึกเพิ่มเติม</button></div></div>`)}function renderCalls(){return shell(top('โทรศัพท์')+`<div class="content"><div class="panel"><h3>ล่าสุด</h3>${['09:12 — ลูกค้าบริษัท','13:45 — ฝ่ายขาย','18:52 — ร้านอาหาร','19:27 — พนักงานจัดส่ง'].map(s=>`<div class="smallcard">${s}</div>`).join('')}<button class="action" onclick="discover('calls')">ดูรายละเอียดสายโทร</button></div></div>`)}
function discover(k){flag(k);if(has('note')&&has('calls'))unlock('นาฬิกา');if(has('achiReply')&&has('duj2Reply'))unlock('แกลเลอรี');if(has('note')&&has('calls')&&has('achiReply'))unlock('เบราว์เซอร์');if(has('gallery')&&has('browser'))unlock('ไฟล์');notify('บันทึกการสำรวจแล้ว')}
function renderGallery(){return shell(top('แกลเลอรี')+`<div class="content"><div class="panel"><h3>รูปภาพ</h3><div class="gallery">${['มุมทำงาน','ท้องฟ้าหลังฝน','กิจกรรมบริษัท','วันสำคัญ'].map(s=>`<div class="photo" onclick="discover('gallery')">${s}</div>`).join('')}</div></div><p class="footnote">ภาพในต้นแบบใช้พื้นหลังจำลอง ไม่ใช่ภาพนิ่งจากซีรีส์</p></div>`)}
function weddingPreview(){let c=state.card;let colors={cream:['#f5eee2','#6a594a','#bda88e'],pink:['#f8e9ee','#855c6b','#ce9cb1'],blue:['#e6eef8','#4a6687','#8da8cc'],green:['#e9eee5','#556a59','#95a992']};let p=colors[c.color];return `<div id="weddingcard" class="wedding" style="background:${p[0]};color:${p[1]};border-color:${p[2]}"><div class="over">THE WEDDING OF</div><h2>${c.style==='modern'?'KARAN':'Karan'}</h2><div class="amp">&amp;</div><h2>${c.style==='modern'?'ACHI':'Achi'}</h2><div class="over">19 JUNE</div><div class="quote">${escapeHtml(c.text)}</div><div style="font-size:12px;color:${p[2]}">${c.style==='floral'?'Botanical Collection':c.style==='modern'?'Modern Collection':'Classic Collection'}</div></div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setCard(k,v){state.card[k]=v;save();render()}function renderDesigner(){return shell(top('การ์ดแต่งงาน','ไฟล์')+`<div class="content">${weddingPreview()}<div class="panel" style="margin-top:14px"><h3>ออกแบบการ์ดแต่งงาน</h3><label class="field">เลือกสี</label><div class="swatches">${[['cream','#f5eee2'],['pink','#f8e9ee'],['blue','#e6eef8'],['green','#e9eee5']].map(([n,c])=>`<button class="swatch" style="background:${c};outline:${state.card.color===n?'2px solid #2b527d':'none'}" onclick="setCard('color','${n}')" aria-label="${n}"></button>`).join('')}</div><label class="field">รูปแบบ</label><select class="input" onchange="setCard('style',this.value)"><option value="classic" ${state.card.style==='classic'?'selected':''}>คลาสสิก</option><option value="floral" ${state.card.style==='floral'?'selected':''}>ดอกไม้</option><option value="modern" ${state.card.style==='modern'?'selected':''}>โมเดิร์น</option></select><label class="field">ข้อความ</label><input class="input" maxlength="80" value="${escapeHtml(state.card.text)}" oninput="updateCardText(this.value)"><button class="action primary" onclick="exportCard()">บันทึกการ์ดเป็นภาพ</button><p class="footnote">การ์ดฉบับทดลองสามารถเปลี่ยนสี รูปแบบ และข้อความได้</p></div></div>`)}function updateCardText(s){state.card.text=s;save();document.querySelector('.wedding .quote').textContent=s}
function exportCard(){let c=state.card,colors={cream:['#f5eee2','#6a594a','#bda88e'],pink:['#f8e9ee','#855c6b','#ce9cb1'],blue:['#e6eef8','#4a6687','#8da8cc'],green:['#e9eee5','#556a59','#95a992']},p=colors[c.color],canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;let x=canvas.getContext('2d');x.fillStyle=p[0];x.fillRect(0,0,900,1200);x.strokeStyle=p[2];x.lineWidth=3;x.strokeRect(40,40,820,1120);x.fillStyle=p[1];x.textAlign='center';x.font='26px Georgia';x.fillText('THE WEDDING OF',450,330);x.font='100px Georgia';x.fillText('Karan',450,480);x.font='60px Georgia';x.fillText('&',450,575);x.font='100px Georgia';x.fillText('Achi',450,700);x.font='35px Georgia';x.fillText('19 JUNE',450,830);x.font='25px Arial';let words=c.text.split(' '),lines=[''];for(let w of words){let z=lines.length-1;if(x.measureText(lines[z]+' '+w).width>730)lines.push(w);else lines[z]+=(lines[z]?' ':'')+w}lines.slice(0,3).forEach((line,i)=>x.fillText(line,450,900+i*38));let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='Karan-Achi-Wedding-Card.png';a.click();notify('สร้างภาพการ์ดแต่งงานแล้ว')}
window.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'){if(page==='chat')go('LINE');else go('home')}});render();
</script></body></html>
