
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11151e">
<title>KARAN'S PHONE </title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#11151e;
 font-family:"SamsungOne","Noto Sans Thai",Arial,sans-serif;
}
body{display:flex;align-items:center;justify-content:center}
#device{
 width:min(100vw,500px,calc(100dvh * 1248 / 1972));
 aspect-ratio:1248/1972;
 position:relative;
 background:#05070b;
 border:3px solid #252933;
 border-radius:23px;
 overflow:hidden;
 box-shadow:0 16px 55px #0009;
}
#display{width:100%;height:100%;display:block;touch-action:none}
svg text{user-select:none;-webkit-user-select:none}
.tap{cursor:pointer}
@media(max-width:600px){
 #device{border-radius:17px;border-width:2px}
}
</style>
</head>
<body>
<div id="device">
<svg id="display" xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 390 616" preserveAspectRatio="xMidYMid meet">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#17253b"/>
  <stop offset=".42" stop-color="#4c6589"/>
  <stop offset=".72" stop-color="#a2a2bc"/>
  <stop offset="1" stop-color="#d2b4b9"/>
 </linearGradient>
 <radialGradient id="glow">
  <stop stop-color="#e8d7e6" stop-opacity=".65"/>
  <stop offset="1" stop-color="#e8d7e6" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#fff" stop-opacity=".23"/>
  <stop offset="1" stop-color="#fff" stop-opacity=".09"/>
 </linearGradient>
 <filter id="soft">
  <feGaussianBlur stdDeviation="23"/>
 </filter>
 <clipPath id="clip">
  <rect width="390" height="616" rx="14"/>
 </clipPath>
</defs>

<g clip-path="url(#clip)">
 <!-- Wallpaper -->
 <rect width="390" height="616" fill="url(#bg)"/>
 <ellipse cx="320" cy="375" rx="220" ry="270"
  fill="url(#glow)"/>
 <path d="M-100 485 C70 280 220 510 480 170"
  fill="none" stroke="#d6d4ec" stroke-opacity=".17"
  stroke-width="100" filter="url(#soft)"/>
 <circle cx="320" cy="360" r="185" fill="none"
  stroke="#fff" stroke-opacity=".12"/>
 <circle cx="320" cy="360" r="235" fill="none"
  stroke="#fff" stroke-opacity=".08"/>

 <!-- Lock screen -->
 <g id="lockScreen">
  <!-- Clock & date -->
  <text id="date" x="195" y="107"
   text-anchor="middle" fill="white"
   font-size="13" font-weight="400"></text>

<text id="clock" x="195" y="177"
 text-anchor="middle" fill="white"
 font-size="70" font-weight="600"
 letter-spacing="-2.5">20:28</text>

<!-- Lock icon under front camera -->
<g transform="translate(188 46)" fill="none"
 stroke="white" stroke-width="1.6"
 stroke-linecap="round"
 stroke-linejoin="round">
 <rect x="0" y="7" width="14" height="12" rx="3"/>
 <path d="M3 7V4a4 4 0 0 1 8 0v3"/>
 <circle cx="7" cy="12.5" r="1.2"
  fill="white" stroke="none"/>
</g>

  <!-- Notification -->
  <g id="notification" class="tap">
   <rect x="20" y="291" width="350" height="71"
    rx="20" fill="url(#glass)" stroke="#ffffff"
    stroke-opacity=".14"/>
   <rect x="34" y="305" width="36" height="36"
    rx="12" fill="#ffffff" fill-opacity=".91"/>
   <g transform="translate(42 315)" fill="none"
    stroke="#5b789d" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 1h18v14H8l-7 5z"/>
    <path d="M5 6h10M5 10h7"/>
   </g>
   <text x="82" y="316" fill="white"
    font-size="12" font-weight="600">ข้อความ</text>
   <text x="82" y="334" fill="white"
    font-size="12">อชิ</text>
   <text x="82" y="349" fill="white"
    font-size="11" opacity=".83">คุณการันต์ครับ ว่างคุยไหมครับ</text>
   <rect x="20" y="291" width="350" height="71"
    rx="20" fill="transparent"/>
  </g>

  <!-- Bottom shortcuts -->
  <g id="phoneShortcut" class="tap">
   <circle cx="46" cy="560" r="23"
    fill="#ffffff" fill-opacity=".16"
    stroke="#ffffff" stroke-opacity=".17"/>
   <g fill="none" stroke="white" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M39 551l5 0 2 5-3 3
     c2 4 4 6 8 8l3-3 5 2v5
     c-9 3-23-11-20-20z"/>
   </g>
  </g>

  <g id="cameraShortcut" class="tap">
   <circle cx="344" cy="560" r="23"
    fill="#ffffff" fill-opacity=".16"
    stroke="#ffffff" stroke-opacity=".17"/>
   <g fill="none" stroke="white" stroke-width="1.8"
    stroke-linejoin="round">
    <rect x="331" y="552" width="26" height="18" rx="4"/>
    <path d="M338 552l2-4h8l2 4"/>
    <circle cx="344" cy="561" r="5"/>
   </g>
  </g>

  <text x="195" y="552" text-anchor="middle"
   fill="#fff" opacity=".83" font-size="10">
   ปัดขึ้นเพื่อปลดล็อก
  </text>
 </g>

 <!-- PIN screen -->
 <g id="pinScreen" display="none">
  <rect width="390" height="616"
   fill="#172235" fill-opacity=".28"/>

  <text x="195" y="124" text-anchor="middle"
   fill="white" font-size="19" font-weight="400">
   กรอกรหัส PIN
  </text>

  <g id="pinDots" fill="none" stroke="white"
   stroke-width="1.6">
   <circle cx="147" cy="156" r="5"/>
   <circle cx="179" cy="156" r="5"/>
   <circle cx="211" cy="156" r="5"/>
   <circle cx="243" cy="156" r="5"/>
  </g>

  <text id="pinError" x="195" y="185"
   text-anchor="middle" fill="#fff"
   font-size="11"></text>

  <g id="keypad"></g>

  <g id="cancelPin" class="tap">
   <rect x="12" y="560" width="100" height="35"
    fill="transparent"/>
   <text x="62" y="582" text-anchor="middle"
    fill="white" font-size="13">ยกเลิก</text>
  </g>
  <g id="deletePin" class="tap">
   <rect x="280" y="560" width="100" height="35"
    fill="transparent"/>
   <text x="330" y="582" text-anchor="middle"
    fill="white" font-size="13">ลบ</text>
  </g>
 </g>

 <!-- Placeholder only -->
 <g id="unlocked" display="none">
  <rect width="390" height="616" fill="#e9eef5"/>
  <text x="195" y="285" text-anchor="middle"
   fill="#526c8b" font-size="22">ปลดล็อกสำเร็จ</text>
  <text x="195" y="313" text-anchor="middle"
   fill="#788ba2" font-size="12">
   หน้าหลักจะสร้างในขั้นต่อไป
  </text>
 </g>

 <!-- System status -->
 <g id="statusBar">
  <text x="18" y="24" fill="white"
   font-size="11.5" font-weight="600">karan</text>

  <!-- Signal -->
  <g stroke="white" stroke-width="2"
   stroke-linecap="round">
   <path d="M291 24v-4M296 24v-7M301 24v-10M306 24v-13"/>
  </g>

  <!-- Wi-Fi -->
  <g fill="none" stroke="white"
   stroke-width="1.8" stroke-linecap="round">
   <path d="M315 16q9-8 18 0"/>
   <path d="M319 20q5-4 10 0"/>
   <circle cx="324" cy="24" r="1" fill="white"
    stroke="none"/>
  </g>

  <!-- Battery capsule -->
<rect x="343" y="11" width="30" height="17"
 rx="7" fill="white" fill-opacity=".22"
 stroke="white" stroke-opacity=".85"
 stroke-width="1"/>

<!-- Battery terminal -->
<rect x="374" y="16" width="3" height="7"
 rx="1.2" fill="white" fill-opacity=".85"/>

<text x="358" y="23" fill="white"
 text-anchor="middle" font-size="9"
 font-weight="600">85</text>

 <!-- Front camera punch hole -->
 <circle cx="195" cy="16" r="7.8" fill="#10141c"/>
 <circle cx="195" cy="16" r="5.1" fill="#05090e"/>
 <circle cx="193.5" cy="14.5" r="1.4"
  fill="#52627c" opacity=".65"/>

 <!-- Navigation gesture bar -->
 <rect id="gestureBar" x="145" y="603"
  width="100" height="4" rx="2"
  fill="white" class="tap"/>
</g>
</svg>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("display");
const lock=document.getElementById("lockScreen");
const pinView=document.getElementById("pinScreen");
const unlocked=document.getElementById("unlocked");
const statusBar=document.getElementById("statusBar");
const pinDots=[...document.querySelectorAll("#pinDots circle")];

const PIN="1906";
let typed="";
let page="lock";
let touchStart=null;
let busy=false;

function updateClock(){
 const now=new Date();
 const time=now.toLocaleTimeString("th-TH",{
  hour:"2-digit",minute:"2-digit",hour12:false
 });
 const date=now.toLocaleDateString("th-TH",{
  weekday:"long",day:"numeric",month:"long"
 });
 document.getElementById("clock").textContent=time;
 document.getElementById("date").textContent=date;
}
updateClock();
setInterval(updateClock,1000);

function show(pageName){
 page=pageName;
 lock.setAttribute("display",page==="lock"?"inline":"none");
 pinView.setAttribute("display",page==="pin"?"inline":"none");
 unlocked.setAttribute("display",page==="unlocked"?"inline":"none");
 statusBar.setAttribute("display",page==="unlocked"?"none":"inline");
 document.getElementById("gestureBar")
 .setAttribute("fill",page==="unlocked"?"#526c8b":"white");
}

function openPin(){
 if(page!=="lock")return;
 typed="";
 busy=false;
 document.getElementById("pinError").textContent="";
 updateDots();
 show("pin");
}

function updateDots(){
 pinDots.forEach((dot,i)=>{
  dot.setAttribute("fill",i<typed.length?"white":"none");
 });
}

function press(value){
 if(page!=="pin"||busy)return;
 if(value==="delete"){
  typed=typed.slice(0,-1);
  updateDots();
  return;
 }
 if(value==="cancel"){
  show("lock");
  return;
 }
 if(typed.length>=4)return;
 typed+=value;
 updateDots();

 if(typed.length===4){
  busy=true;
  if(typed===PIN){
   setTimeout(()=>{
    busy=false;
    show("unlocked");
   },180);
  }else{
   document.getElementById("pinError")
    .textContent="รหัส PIN ไม่ถูกต้อง";
   setTimeout(()=>{
    typed="";
    busy=false;
    updateDots();
   },500);
  }
 }
}

const positions=[
 ["1",85,265],["2",195,265],["3",305,265],
 ["4",85,353],["5",195,353],["6",305,353],
 ["7",85,441],["8",195,441],["9",305,441],
 ["0",195,529]
];

const keypad=document.getElementById("keypad");

positions.forEach(([value,x,y])=>{
 const g=document.createElementNS(NS,"g");
 g.setAttribute("class","tap");

 const circle=document.createElementNS(NS,"circle");
 circle.setAttribute("cx",x);
 circle.setAttribute("cy",y);
 circle.setAttribute("r",38);
 circle.setAttribute("fill","#ffffff");
 circle.setAttribute("fill-opacity",".13");

 const text=document.createElementNS(NS,"text");
 text.setAttribute("x",x);
 text.setAttribute("y",y+9);
 text.setAttribute("text-anchor","middle");
 text.setAttribute("fill","white");
 text.setAttribute("font-size","28");
 text.setAttribute("font-weight","400");
 text.textContent=value;

 g.append(circle,text);
 g.addEventListener("click",()=>press(value));
 keypad.appendChild(g);
});

document.getElementById("cancelPin")
 .addEventListener("click",()=>press("cancel"));
document.getElementById("deletePin")
 .addEventListener("click",()=>press("delete"));

document.getElementById("notification")
 .addEventListener("click",openPin);

document.getElementById("phoneShortcut")
 .addEventListener("click",openPin);

document.getElementById("cameraShortcut")
 .addEventListener("click",openPin);

document.getElementById("gestureBar")
 .addEventListener("click",()=>{
  if(page==="lock")openPin();
 });

function getY(e){
 const rect=svg.getBoundingClientRect();
 return (e.clientY-rect.top)*616/rect.height;
}
svg.addEventListener("pointerdown",e=>{
 if(page!=="lock")return;
 touchStart=getY(e);
});
svg.addEventListener("pointerup",e=>{
 if(page!=="lock"||touchStart===null)return;
 const diff=touchStart-getY(e);
 touchStart=null;
 if(diff>35)openPin();
});
svg.addEventListener("pointercancel",()=>{
 touchStart=null;
});

document.addEventListener("keydown",e=>{
 if(page==="pin"){
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==="Backspace")press("delete");
  else if(e.key==="Escape")press("cancel");
 }
 if(page==="lock"&&(e.key==="Enter"||e.key==="ArrowUp")){
  openPin();
 }
});

show("lock");
</script>
</body>
</html>
