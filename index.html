function node(tag,attrs={},text){let e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}
function add(parent,tag,attrs={},text){let e=node(tag,attrs,text);parent.appendChild(e);return e}
function clear(id){$(id).replaceChildren()}
function textLines(parent,text,x,y,width=335,size=14,color='#303647',line=23){const chars=Math.max(10,Math.floor(width/(size*.92)));let rows=[];for(const para of String(text).split('\n')){let s='';for(const ch of [...para]){if([...s].length>=chars){rows.push(s);s=''}s+=ch}rows.push(s)}rows.forEach((row,i)=>add(parent,'text',{x,y:y+i*line,'font-size':size,fill:color},row));return y+rows.length*line}

function wedding(){const c=appFrame('Wedding Invitation Studio',home);const [bg,ink,edge]=palettes[card.theme];rect(c,20,112,350,319,bg,8);add(c,'rect',{x:34,y:126,width:322,height:291,rx:4,fill:'none',stroke:edge,'stroke-width':1.5});if(card.style==='floral'){for(let i=0;i<5;i++){let x=70+i*62;add(c,'path',{d:`M${x} 166q-13-20 0-29q13 9 0 29`,fill:edge})}}else if(card.style==='classic'){add(c,'rect',{x:46,y:138,width:298,height:267,fill:'none',stroke:ink})}add(c,'text',{x:195,y:215,'text-anchor':'middle','font-size':12,'letter-spacing':2,fill:ink},'THE WEDDING OF');add(c,'text',{x:195,y:270,'text-anchor':'middle','font-size':23,'font-family':'Georgia,serif',fill:ink},card.names.slice(0,23));textLines(c,card.message,68,326,260,13,ink,21);const options=[['สีครีม',()=>{card.theme='cream';wedding()}],['ชมพู',()=>{card.theme='pink';wedding()}],['ฟ้า',()=>{card.theme='blue';wedding()}],['เขียว',()=>{card.theme='green';wedding()}]];options.forEach(([label,fn],i)=>{let g=add(c,'g',{class:'tap'}),x=20+i*92;rect(g,x,449,84,39,'#e5e9f2');add(g,'text',{x:x+42,y:473,'font-size':12,'text-anchor':'middle',fill:'#394860'},label);g.addEventListener('click',fn)});action(c,'เปลี่ยนลาย / ชื่อ / ข้อความ',504,editCard,'#dce5f2','#28364e',42)}

function pointerY(e){let r=screen.getBoundingClientRect();return(e.clientY-r.top)*616/r.height}screen.addEventListener('pointerdown',e=>{if(page==='lock')startY=pointerY(e)});screen.addEventListener('pointerup',e=>{if(page!=='lock'||startY===null)return;let distance=startY-pointerY(e);startY=null;if(distance>35)openPin()});screen.addEventListener('pointercancel',()=>startY=null);$('phoneShortcut').addEventListener('click',openPin);$('cameraShortcut').addEventListener('click',openPin);$('play').addEventListener('click',e=>{e.stopPropagation();playing=!playing;$('playShape').setAttribute('d',playing?'M-5-7H-1V7H-5ZM2-7H6V7H2Z':'M-4-7L7 0-4 7Z')});$('prev').addEventListener('click',e=>e.stopPropagation());$('next').addEventListener('click',e=>e.stopPropagation());document.addEventListener('keydown',e=>{if(page==='pin'){if(/^\d$/.test(e.key))key(e.key);if(e.key==='Backspace')key('delete');if(e.key==='Escape')key('cancel')}else if(page==='lock'&&e.key==='ArrowUp')openPin()});
