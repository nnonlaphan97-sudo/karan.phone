{title:'ตลอดไป',date:'วันที่เลือกอนาคต',who:'อชิ',incoming:'ไม่ว่าจะเกิดอะไรขึ้น เราค่อย ๆ ไปด้วยกันนะครับ',mine:'ครับอชิ',incoming2:'ผมดีใจที่มีคุณอยู่ข้าง ๆ',app:'calendar',item:'วันที่สำคัญที่สุด',detail:'การันต์เก็บวันสำคัญของทั้งคู่ไว้ในปฏิทิน และมีบันทึกแผนอนาคตที่อยากคุยกับอชิ',secret:'ร่างข้อความสุดท้าย: อยากมีทุกวันธรรมดากับอชิ',question:'การันต์อยากชวนอชิวางแผนอนาคตร่วมกัน',choices:[['ถามถึงความฝันของอชิก่อน แล้วค่อยพูดถึงอนาคตด้วยกัน',10,10,-8,'ทั้งคู่คุยกันถึงอนาคตอย่างเท่าเทียม'],['ตัดสินใจทุกอย่างไว้แล้วให้อชิตอบตกลง',-15,-12,18,'อชิรู้สึกว่าตัวเองไม่มีส่วนร่วม'],['ไม่พูดเรื่องอนาคตเลย',-5,-5,8,'อชิยังไม่แน่ใจว่าการันต์มองอนาคตของทั้งคู่อย่างไร']]}
];
const extraApps=['notes','gallery','phone','clock','files','browser'];
const initial=()=>({screen:'lock',ep:0,opened:false,unlocked:['line','memories'],read:[],thread:'',decision:false,choice:-1,comfort:55,trust:55,distance:12,completed:[],secrets:[],ending:false});
let s;try{s={...initial(),...JSON.parse(localStorage.getItem('karan12memories_v1'))}}catch(e){s=initial()}
const save=()=>localStorage.setItem('karan12memories_v1',JSON.stringify(s));const mark=k=>{if(!s.read.includes(k))s.read.push(k);save()};const has=k=>s.read.includes(k);const ep=()=>episodes[s.ep];
function ico(id){return `<svg viewBox="0 0 24 24">${icons[id]||icons.lock}</svg>`}function esc(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function go(a){if(a!=='home'&&a!=='lock'&&a!=='pin'&&a!=='result'&&!s.unlocked.includes(a))return;s.screen=a;save();render()}
function head(title){return `<div class="heading"><button onclick="go('home')">‹</button><strong>${esc(title)}</strong></div>`}
function tile(id){let [label,bg]=appNames[id],open=s.unlocked.includes(id);return `<button class="app ${open?'':'lock'}" onclick="go('${id}')"><span class="tile" style="background:${open?bg:'#526077'}">${ico(open?id:'lock')}</span>${label}</button>`}
function home(){return `<div class="clock">${s.decision?'22:06':'20:48'}</div><div class="date">${esc(ep().date)}</div><div class="panel"><div class="row"><b>LINE</b><span class="muted">${esc(ep().who)}</span></div><div class="notice">${esc(s.decision?'มีข้อความที่ยังไม่ได้อ่าน':'มีข้อความใหม่')}</div></div><div class="appgrid">${Object.keys(appNames).map(tile).join('')}</div><div class="panel"><div class="row"><b>การันต์ · อชิ</b><span class="muted">ความทรงจำ ${s.ep+1}/12</span></div><p class="notice">${esc(ep().title)}</p></div>`}
function lock(){return `<div class="cover"><div style="font-size:58px;font-weight:200">21:18</div><p>โทรศัพท์ของการันต์</p><div class="panel">LINE · ${esc(ep().who)}<p class="notice">${esc(ep().incoming)}</p></div><button class="darkbtn" onclick="go('pin')">ปัดขึ้นเพื่อปลดล็อก</button></div>`}
function pin(){return `<div class="cover"><h2>กรอกรหัส PIN</h2><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" oninput="if(this.value.length===4)unlockPhone(this.value)"><p class="muted">รหัสสำหรับทดลองเล่น: 1906</p></div>`}
function unlockPhone(v){if(v==='1906'){s.opened=true;go('home')}else{document.getElementById('pin').value='';alert('รหัสไม่ถูกต้อง')}}
function openThread(name){s.thread=name;mark('thread:'+s.ep);if(!s.unlocked.includes(ep().app))s.unlocked.push(ep().app);save();render()}
function line(){const e=ep();let thread=s.thread;return head('LINE')+`<div class="paper">${!thread?`<h3>แชต</h3><div class="line" onclick="openThread('main')"><b>${esc(e.who)}</b><p>${esc(e.incoming)}</p></div><div class="line" onclick="openThread('achi')"><b>อชิ</b><p>${esc(s.decision?'ขอบคุณนะครับคุณการันต์':'ข้อความล่าสุด')}</p></div>`:`<div class="row"><button class="tab" onclick="s.thread='';render()">‹ แชต</button><b>${thread==='achi'?'อชิ':esc(e.who)}</b></div>${thread==='main'?`<div class="bubble">${esc(e.incoming)}</div><div class="bubble mine">${esc(e.mine)}</div><div class="bubble">${esc(e.incoming2)}</div>`:`<div class="bubble mine">${esc(s.decision?'วันนี้ผมดีใจที่ได้คุยกับอชิครับ':'สวัสดีครับอชิ')}</div><div class="bubble">${esc(s.decision?responseLine():'สวัสดีครับคุณการันต์')}</div>`}${thread==='main'&&has('item:'+s.ep)&&!s.decision?`<div class="card"><b>${esc(e.question)}</b>${e.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})">${esc(c[0])}</button>`).join('')}</div>`:''}${s.decision&&thread==='achi'?`<div class="card">${esc(e.choices[s.choice][4])}</div>`:''}`}</div>`}
function responseLine(){return s.distance>45?'ขอโทษนะครับ ช่วงนี้ผมอยากมีเวลาคิดอะไรสักหน่อย':s.trust>72?'ผมดีใจที่ได้คุยกับคุณการันต์นะครับ':'ขอบคุณนะครับคุณการันต์'}
function choose(i){let c=ep().choices[i];s.choice=i;s.decision=true;s.comfort=Math.max(0,Math.min(100,s.comfort+c[1]));s.trust=Math.max(0,Math.min(100,s.trust+c[2]));s.distance=Math.max(0,Math.min(100,s.distance+c[3]));if(!s.completed.includes(s.ep))s.completed.push(s.ep);save();render()}
function appContent(id){const e=ep();const relevant=id===e.app;let entries=[];if(relevant)entries.push({key:'item:'+s.ep,title:e.item,desc:e.detail});if(id==='notes')entries.push({key:'secret:'+s.ep,title:'ร่างบันทึกส่วนตัว',desc:e.secret});if(id==='gallery')entries.push({key:'photo:'+s.ep,title:'อัลบั้มช่วงเวลานี้',desc:'ภาพและช่วงเวลาที่การันต์อยากเก็บไว้ แม้จะเป็นเรื่องธรรมดา'});if(id==='calendar')entries.push({key:'cal:'+s.ep,title:e.date,desc:'วันสำคัญที่บันทึกไว้ในปฏิทิน'});if(id==='phone')entries.push({key:'call:'+s.ep,title:'ประวัติการโทร',desc:'มีสายที่โทรออกและสายที่ไม่ได้รับจากช่วงเวลานี้'});if(id==='clock')entries.push({key:'alarm:'+s.ep,title:'การแจ้งเตือนส่วนตัว',desc:'การันต์ตั้งเตือนให้ไม่ลืมเรื่องเล็ก ๆ ระหว่างวันที่ยุ่ง'});if(id==='browser')entries.push({key:'search:'+s.ep,title:'ประวัติการค้นหา',desc:'หัวข้อที่เกี่ยวข้องกับสิ่งที่อชิสนใจ'});if(id==='files')entries.push({key:'file:'+s.ep,title:'เอกสารที่บันทึกไว้',desc:'ไฟล์ที่การันต์กลับมาเปิดดูในช่วงเวลานี้'});if(id==='shop')entries.push({key:'order:'+s.ep,title:'รายการสั่งซื้อย้อนหลัง',desc:'ประวัติการเลือกของที่ใช้เวลาตัดสินใจมากกว่าปกติ'});return head(appNames[id][0])+`<div class="paper"><h3>${esc(appNames[id][0])}</h3>${entries.map((x,i)=>`<div class="line" onclick="openItem('${x.key}')"><b>${esc(x.title)}</b><p>${has(x.key)?esc(x.desc):'แตะเพื่อเปิดดู'}</p></div>`).join('')}${!entries.length?'<p class="muted">ยังไม่มีข้อมูลในช่วงเวลานี้</p>':''}</div>`}
function openItem(key){mark(key);if(key==='item:'+s.ep){if(!s.unlocked.includes('notes'))s.unlocked.push('notes');if(!s.unlocked.includes('memories'))s.unlocked.push('memories')}if(key==='secret:'+s.ep&&!s.secrets.includes(s.ep))s.secrets.push(s.ep);save();render()}
function memories(){let finished=s.completed.length;return head('12 MEMORIES')+`<div class="paper"><h3>สมุดความทรงจำ</h3><p class="muted">เรื่องราวที่การันต์เก็บไว้</p>${episodes.map((e,i)=>`<div class="archive ${i>s.ep?'locked':''}"><div class="row"><b>${String(i+1).padStart(2,'0')} · ${i<=s.ep?esc(e.title):'ยังไม่มีความทรงจำ'}</b><span class="pill">${s.completed.includes(i)?'บันทึกแล้ว':i===s.ep?'ปัจจุบัน':'—'}</span></div>${i<=s.ep?`<small>${esc(e.date)}</small>${has('item:'+i)?`<p class="mini">${esc(e.detail)}</p>`:''}${s.secrets.includes(i)?`<p class="mini">✦ ${esc(e.secret)}</p>`:''}`:''}</div>`).join('')}${s.ep===11&&s.decision?`<button class="btn" onclick="go('result')">เปิดหน้าสุดท้าย</button>`:''}</div>`}
function result(){let good=s.trust>=70&&s.distance<35,mid=s.trust>=42&&s.distance<65;let ending=good?'อนาคตที่เลือกไปด้วยกัน':mid?'ยังมีเรื่องให้เรียนรู้กันอีก':'ระยะห่างที่ต้องค่อย ๆ ซ่อมแซม';return head('หน้าสุดท้าย')+`<div class="paper"><h2>${ending}</h2><p class="end">${good?'การันต์กับอชิได้คุยกันอย่างเปิดใจ ความใส่ใจเล็ก ๆ ที่สะสมมาค่อย ๆ กลายเป็นความมั่นคง':mid?'ทั้งสองยังรักและห่วงใยกัน แต่ต้องเรียนรู้วิธีสื่อสารและเคารพพื้นที่ของกันและกัน':'อชิเลือกถอยออกมาเพื่อทบทวนความรู้สึก การันต์ต้องเริ่มจากการรับฟังมากกว่าพยายามทำทุกอย่างแทน'}</p>${[['ความสบายใจ',s.comfort],['ความไว้วางใจ',s.trust],['ระยะห่าง',s.distance]].map(([t,v])=>`<p class="mini">${t} ${v}%</p><div class="bar"><div style="width:${v}%"></div></div>`).join('')}<p class="muted">ความทรงจำพิเศษที่พบ: ${s.secrets.length}/12</p><button class="btn" onclick="go('memories')">กลับไปอ่านความทรงจำ</button><button class="btn ghost" onclick="restart()">เริ่มเรื่องใหม่</button></div>`}
function next(){if(s.ep>=11){go('result');return} s.ep++;s.screen='home';s.thread='';s.decision=false;s.choice=-1;s.unlocked=['line','memories'];s.read=[];save();render()}
function restart(){if(confirm('เริ่มใหม่และลบความคืบหน้าทั้งหมด?')){s=initial();save();render()}}
function render(){let html=s.screen==='lock'?lock():s.screen==='pin'?pin():s.screen==='home'?home():s.screen==='line'?line():s.screen==='memories'?memories():s.screen==='result'?result():appContent(s.screen);if(s.screen==='home'&&s.decision){html+=`<div class="panel"><p class="notice">${esc(ep().choices[s.choice][4])}</p><button class="btn" onclick="next()">${s.ep===11?'เปิดหน้าสุดท้าย':'ย้อนสู่ความทรงจำถัดไป'}</button></div>`}document.getElementById('view').innerHTML=html}
render();
</script></body></html>
