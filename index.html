<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>KARAN'S PHONE</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  touch-action:pan-y;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,'Noto Sans Thai',sans-serif;
  background:#101018;
  color:#fff;
}

button,input,select,textarea{
  font:inherit;
  touch-action:manipulation;
}

input,select,textarea{
  font-size:16px;
}

button{
  cursor:pointer;
}

#phone{
  position:relative;
  width:100%;
  max-width:440px;
  height:100dvh;
  min-height:0;
  margin:0 auto;
  overflow:hidden;
  background:#10182a;

  border:4px solid #343640;
  border-radius:20px;

  box-shadow:
    0 0 0 2px #171920,
    0 5px 18px rgba(0,0,0,.25);
}

#phone::before{
  content:"";
  position:absolute;
  inset:-12px;
  background:url("https://i.ibb.co/5WfPWvbp/IMG-4436.jpg") center/cover no-repeat;
  filter:blur(6px);
  pointer-events:none;
}
#phone:has(.lock){background:#e9ebf9}
#phone:has(.lock) .status{color:#4b3652}
#phone:has(.lock) .nav span{background:rgba(255,255,255,.2)}
.status{height:36px;padding:9px 10px 0 22px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:20;font-size:13px;font-weight:600;color:#4b3652;background:transparent}

.camera{
  position:absolute;
  z-index:30;
  top:12px;
  left:calc(50% - 6px);
  width:12px;
  height:12px;
  background:#081322;
  border:2px solid #23374e;
  border-radius:50%;
  pointer-events:none;
}

.status .right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:0;
  height:22px;
}

.status-icons{
  width:108px;
  height:22px;
  display:block;
  color:inherit;
  flex-shrink:0;
}

.ico{width:22px;height:22px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.small{width:17px;height:17px}

.screen{
  position:absolute;
  inset:0;
  overflow-y:auto;
  scrollbar-width:none;
}

.screen::-webkit-scrollbar{display:none}
.nav{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:22px;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
}

#phone:has(.line-chatpage) .nav{
  display:none;
}
.nav span{width:105px;height:4px;background:rgba(246,248,253,.35);border-radius:5px}
.lock{
  position:relative;
  height:100%;
  width:100%;
  overflow:hidden;
  text-align:center;
  color:#4c304d;
  touch-action:pan-y;
}

.lock-wallpaper{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:0;
  pointer-events:none;
}


.lock .date{
  position:absolute;
  top:11%;
  left:0;
  width:100%;
  font-size:16px;
  font-weight:500;
  color:#563c58;
  z-index:2;
}

.lock .clock{
  position:absolute;
  top:15%;
  left:0;
  width:100%;
  margin:0;
  font-size:clamp(72px,20vw,102px);
  line-height:1;
  letter-spacing:-5px;
  font-weight:600;
  color:#482b49;
  z-index:2;
}

.lock .hint{
  position:absolute;
  bottom:13%;
  left:0;
  width:100%;
  font-size:12px;
  color:#fff;
  text-shadow:0 1px 5px #64739b;
  z-index:2;
}


.pill{
  border:1px solid #ffffff80;
  background:#ffffff18;
  color:white;
  padding:12px 25px;
  border-radius:28px;
}

/* หน้าใส่รหัส PIN */
.pin-screen{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#fff;
  background:transparent;
  padding-top:clamp(115px,17vh,160px);
}

#phone:has(.lock)::before{
  display:none;
}

.pin-title{
  font-size:18px;
  font-weight:500;
  margin-bottom:23px;
}

.pin-dots{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:35px;
}

.pin-dot{
  width:12px;
  height:12px;
  border:1.5px solid #fff;
  border-radius:50%;
  background:transparent;
}

.pin-dot.filled{
  background:#fff;
}

.pin-keypad{
  display:grid;
  grid-template-columns:repeat(3,72px);
  justify-content:center;
  gap:13px 20px;
}

.pin-key{
  width:72px;
  height:72px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  color:#fff;
  font-size:29px;
  font-weight:400;
  display:flex;
  align-items:center;
  justify-content:center;
}

.pin-key:active{
  background:rgba(255,255,255,.35);
}

.pin-action{
  border:0;
  background:transparent;
  color:#fff;
  font-size:14px;
  padding:12px 0;
}

.pin-bottom{
  width:256px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:17px;
}


.lock-notification{
  position:absolute;
  bottom:4%;
  left:8%;
  width:84%;
  min-height:65px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  border-radius:23px;
  background:rgba(48,58,98,.68);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  color:#fff;
  text-align:left;
  z-index:3;
  border:0;
}

.lock-notification .notification-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#06c755;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.lock-notification .notification-icon .ico{
  width:25px;
  height:25px;
}

.lock-notification strong{
  display:block;
  font-size:13px;
}

.lock-notification small{
  display:block;
  margin-top:4px;
  font-size:12px;
  opacity:.85;
}

.home{
  position:relative;
  height:100%;
  min-height:0;
  padding:62px 22px 145px;
  color:#fff;
  overflow-y:auto;
  scrollbar-width:none;
}

.home::-webkit-scrollbar{
  display:none;
}

.home-dock{
  position:absolute;
  left:0;
  right:0;
  bottom:35px;
  z-index:20;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;

  width:100%;
  margin:0;
  padding:0;

  background:transparent;
  border:0;
  box-shadow:none;
}

.dock-camera{
  width:64px;
  height:64px;
  padding:0;
  border:0;
  background:transparent;
  display:grid;
  place-items:center;
}

.dock-camera-icon{
  width:60px;
  height:60px;
  border-radius:18px;
  background:transparent;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.dock-camera-icon .ico{
  width:60px;
  height:60px;
  display:block;
  stroke:none;
}

/* Dock: แอปที่ยังไม่ปลดล็อก */

.dock-camera-icon:has(.dock-lock-icon){
  background:#5a6780;
  color:#d2dbe8;
}

.dock-lock-icon{
  width:32px !important;
  height:32px !important;
  stroke:currentColor !important;
  fill:none !important;
}
.home-weather{
  display:flex;
  align-items:center;
  gap:18px;
  width:100%;
  color:#fff;
  background:transparent;
  border:0;
  box-shadow:none;
  padding:0;
  text-align:left;
}

.home-weather-icon{
  width:100px;
  height:100px;
  flex-shrink:0;
}

.home-weather-icon svg{
  width:100%;
  height:100%;
}

.home-weather-info{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  min-width:0;
  gap:4px;
}

.home-weather-temp{
  font-size:54px;
  font-weight:400;
  line-height:1;
  letter-spacing:-2px;
}

.home-weather-desc{
  font-size:14px;
  margin:0;
}

.home-weather-location{
  font-size:12px;
  opacity:.85;
  margin:0;
}

.home .appgrid{
  margin-top:20px;
}

.appgrid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-gap:8px;
  row-gap:20px;
}
.appitem{border:0;background:transparent;color:white;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px}
.appicon{
  width:60px;
  height:60px;
  border-radius:22px;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:transparent;
  box-shadow:0 7px 18px #0002;
}

.appicon .ico{
  width:60px;
  height:60px;
  display:block;
  flex-shrink:0;
  stroke:none;
}

.appicon.locked{
  background:#5a6780;
}

.appicon.locked .ico{
  width:32px;
  height:32px;
  stroke:currentColor;
}
.locked{background:#5a6780!important;color:#d2dbe8}
.app{background:#f6f7fb;color:#172033;min-height:100%;padding-bottom:22px}
.apphead{height:56px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 15px;border-bottom:1px solid #e9edf2;position:sticky;top:0;z-index:5}
.back{border:0;background:none;color:#24324a;padding:5px}
.apphead b{font-size:18px}
.content{padding:14px}
.chatlist{background:white}
.chatrow{display:flex;gap:12px;padding:15px 16px;border-bottom:1px solid #eef0f3;align-items:center;cursor:pointer}
.avatar{width:43px;height:43px;background:#d7e4f1;color:#425773;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.chatrow .body{min-width:0;flex:1}
.chatrow .name{font-weight:600;font-size:15px}
.chatrow .preview{font-size:12px;color:#7c8595;margin-top:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chatrow .time{font-size:11px;color:#99a2af}
.conversation{background:#d8e1ee;min-height:calc(100dvh - 116px);padding:16px 12px 85px}
.day{text-align:center;font-size:11px;color:#60738c;margin:12px}
.bubble{max-width:82%;padding:11px 13px;border-radius:15px;font-size:14px;line-height:1.65;margin:8px 0;white-space:pre-wrap}
.incoming{background:#fff;color:#253043;border-top-left-radius:4px;margin-right:auto}
.outgoing{background:#b6ec98;color:#213c2b;border-top-right-radius:4px;margin-left:auto}
.choices{position:sticky;bottom:0;background:#f8fafc;padding:10px;border-top:1px solid #e1e7ef}
.choice{width:100%;padding:10px 12px;background:white;border:1px solid #d5dfeb;border-radius:12px;margin:4px 0;text-align:left;font-size:13px;color:#27364a}
.choice:active{background:#dff5df}
.entry{background:#fff;padding:15px;border-radius:14px;margin:10px 0;border:1px solid #e7ebf1;color:#263347}
.entry small{color:#788597;display:block;margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:#7b879a;font-size:12px}
.action{border:0;border-radius:12px;background:#273d60;color:white;padding:12px 15px}
.action:disabled{opacity:.4}
.notice{padding:11px 14px;background:#eaf4ec;color:#246139;border-radius:12px;font-size:13px;margin:12px 0}
.footerbtn{width:100%;margin-top:15px}
.cardeditor{background:#f7f8fb;min-height:100%;padding:15px}
.invite{max-width:310px;min-height:420px;margin:14px auto;padding:24px 20px;text-align:center;border:1px solid #bca98c;box-shadow:0 8px 26px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:19px;color:#6e5948;background:#f7efe3}
.invite .tiny{letter-spacing:3px;font-size:11px}
.invite .names{font-family:Georgia,serif;font-size:34px;line-height:1.45}
.invite .line{width:50px;height:1px;background:currentColor}
.invite .phrase{font-size:13px}
.controls{display:grid;gap:10px;background:#fff;border-radius:14px;padding:15px}
.controls label{font-size:13px;font-weight:600}
.controls select,.controls input{padding:11px;border:1px solid #cbd4df;border-radius:10px;width:100%;color:#263347;background:white}
.overlay{
  position:absolute;
  inset:36px 0 22px;
  background:#101a2bbd;
  display:grid;
  place-items:center;
  z-index:45;
  padding:25px;
}

.game-banner{
  position:absolute;
  top:43px;
  left:12px;
  right:12px;
  z-index:60;
  border:1px solid rgba(255,255,255,.7);
  border-radius:18px;
  background:rgba(249,250,252,.97);
  color:#191919;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  width:calc(100% - 24px);
}

.game-banner-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#06c755;
  color:#fff;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.game-banner-text{
  flex:1;
  min-width:0;
}

.game-banner-text small{
  display:block;
  color:#73777e;
  font-size:11px;
  margin-bottom:3px;
}

.game-banner-text strong{
  display:block;
  font-size:14px;
}

.game-banner-text span{
  display:block;
  margin-top:4px;
  font-size:13px;
}

.dialog{background:white;color:#20314c;padding:25px;border-radius:20px;width:100%;max-width:320px;text-align:center}
.dialog p{font-size:14px;line-height:1.6}
.toolbar{padding:10px 14px;background:#fff;border-top:1px solid #e7eaf0}
.tinylabel{font-size:11px;color:#8b96a5}
.homecard{background:#ffffff19;border:1px solid #ffffff25;border-radius:16px;padding:16px;margin-top:35px;font-size:13px;color:#eaf1fa}
.spacer{height:12px}


/* ===== LINE 2026 ===== */
.line-app{
  position:relative;
  height:100%;
  min-height:0;
  background:#fff;
  color:#191919;
  padding-top:36px;
  overflow:hidden;
}

.line-scroll{
  height:100%;
  overflow-y:auto;
  padding-bottom:105px;
  scrollbar-width:none;
}

.line-scroll::-webkit-scrollbar{
  display:none;
}

.line-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
  min-height:58px;
}
.line-title{font-size:23px;font-weight:700}
.line-actions{
  display:flex;
  align-items:center;
  gap:2px;
  padding:4px;
  background:#f1f1f1;
  border-radius:30px;
}
.line-iconbtn{
  border:0;background:none;color:#191919;
  padding:3px;display:grid;place-items:center;
}
.line-iconbtn .ico{width:23px;height:23px}
.line-searchbox{
  display:flex;align-items:center;gap:10px;
  margin:6px 16px 14px;padding:11px 13px;
  background:#f3f4f5;border-radius:12px;
}
.line-searchbox input{
  width:100%;border:0;outline:0;
  background:transparent;color:#222;font-size:14px;
}
.line-profile{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:17px 19px;
  background:#fff;
  border:0;
  color:#191919;
  text-align:left;
  cursor:pointer;
}

.line-profile > .ico:last-child{
  transform:rotate(180deg);
  color:#999;
  width:19px;
  height:19px;
}

.line-avatar{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  background:#e5eaf1;color:#58677b;
  flex-shrink:0;
}
.line-avatar .ico{width:26px;height:26px}
.line-avatar.large{width:76px;height:76px}
.line-avatar.large .ico{width:35px;height:35px}
.line-name{font-size:15px;font-weight:600}
.line-sub{font-size:12px;color:#96999f;margin-top:5px}
.line-section{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 19px 9px;font-size:14px;font-weight:700;
}
.line-row{
  display:flex;align-items:center;gap:13px;
  width:100%;padding:12px 18px;
  background:#fff;border:0;color:#191919;
  text-align:left;cursor:pointer;
}
.line-row:active{background:#f4f5f6}
.line-row-body{flex:1;min-width:0}
.line-preview{
  font-size:12px;color:#989ca2;margin-top:6px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.line-time{font-size:11px;color:#a4a7ad;align-self:flex-start}
.line-divider{
  height:8px;
  background:#f5f6f7;
}


.line-home-profile{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:23px 19px 20px;
  background:#fff;
  border:0;
  color:#191919;
  text-align:left;
}

.line-home-profile-name{
  font-size:26px;
  font-weight:700;
}

.line-home-profile-status{
  margin-top:7px;
  color:#999;
  font-size:13px;
}

.line-home-profile-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.line-home-profile-right .line-avatar{
  width:66px;
  height:66px;
}

.line-home-story{
  width:46px;
  height:46px;
  border:2px dashed #ddd;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#999;
}

.line-home-directory{
  padding:12px 19px 18px;
}

.line-home-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0 12px;
  font-size:15px;
}

.line-home-heading button{
  border:0;
  background:none;
  color:#999;
  font-size:12px;
}

.line-directory-row{
  display:flex;
  align-items:center;
  width:100%;
  gap:13px;
  padding:10px 0;
  border:0;
  background:#fff;
  color:#191919;
  text-align:left;
}

.line-directory-mosaic{
  width:58px;
  height:58px;
  flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:2px;
  overflow:hidden;
  border-radius:50%;
  background:#e8ebee;
}

.line-directory-mosaic > span{
  display:grid;
  place-items:center;
}

.line-directory-mosaic .ico{
  width:16px;
  height:16px;
  color:#5c697c;
}

.line-directory-info{
  flex:1;
  min-width:0;
}

.line-directory-info strong{
  display:block;
  font-size:15px;
  font-weight:600;
}

.line-directory-info small{
  display:block;
  margin-top:5px;
  font-size:12px;
  color:#999;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.line-directory-count{
  font-size:13px;
  color:#999;
}

.line-directory-arrow{
  font-size:24px;
  color:#aaa;
}

.line-home-services{
  padding:12px 19px 22px;
}

.line-home-service-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px 8px;
  padding-top:12px;
}

.line-home-service{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  padding:5px 0;
  border:0;
  background:transparent;
  color:#333;
  font-size:11px;
  text-align:center;
}

.line-home-service .ico{
  width:27px;
  height:27px;
}

.line-home-themes{
  padding:12px 19px 28px;
}

.line-home-theme-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-top:10px;
}

.line-home-theme{
  flex:0 0 125px;
  height:150px;
  border-radius:12px;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:12px;
  color:#776d87;
  background:#eee8f4;
}

.line-home-theme:nth-child(2){
  background:#f7e7ed;
  color:#ad788d;
}

.line-home-theme:nth-child(3){
  background:#e4eef7;
  color:#668ca7;
}

.line-section .line-iconbtn{
  transform:rotate(180deg);
}

.line-chat-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 16px 8px;
}

.line-chat-switch{
  display:flex;
  align-items:center;
  gap:3px;
  padding:4px;
  background:#f1f1f1;
  border-radius:30px;
  flex-shrink:0;
}

.line-chat-switch button{
  border:0;

/* ===== EP.07 LOVE EFFECTS ===== */

.ep7-love-choices{
  display:flex;
  flex-direction:column;

.ep7-love-label{
  text-align:center;

  margin-bottom:5px;
}

.ep7-love-effect{
  position:absolute;
  inset:0;
  z-index:900;
  overflow:hidden;
  pointer-events:none;
}

.ep7-love-effect svg{
  display:block;
  width:100%;
  height:100%;
}

.ep7-falling-piece{
  animation:ep7Fall var(--duration) linear
    var(--delay) both;
  transform-box:fill-box;
  transform-origin:center;
}

@keyframes ep7Fall{
  0%{
    transform:translate(0,-100px) rotate(0deg);
    opacity:0;
  }
  8%{opacity:1}
  85%{opacity:1}
  100%{
    transform:
      translate(var(--drift),1050px)
      rotate(var(--spin));
    opacity:0;
  }
}

.ep7-firework-burst{
  transform-box:fill-box;
  transform-origin:center;
  animation:ep7Burst 1.6s ease-out
    var(--delay) both;
}

@keyframes ep7Burst{
  0%{
    opacity:0;
    scale:.05;
  }
  25%{
    opacity:1;
    scale:1;
  }
  70%{
    opacity:1;
    scale:1.2;
  }
  100%{
    opacity:0;
    scale:1.45;
  }
}

@media(prefers-reduced-motion:reduce){
  .ep7-falling-piece,
  .ep7-firework-burst{
    animation-duration:.01ms;
  }
}

/* ===== LINE FULL SCREEN PROFILE ===== */

.line-full-profile{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:#fff;
  background:#111;
  isolation:isolate;
}

.line-full-profile::before{
  content:"";
  position:absolute;
  inset:-25px;
  z-index:-2;
  background-image:var(--line-profile-photo);
  background-position:center;
  background-size:cover;
  filter:blur(22px) brightness(.36);
  transform:scale(1.1);
}

.line-full-profile::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.38) 0%,
    rgba(0,0,0,.08) 35%,
    rgba(0,0,0,.38) 72%,
    rgba(0,0,0,.8) 100%
  );

const WEATHER_URL =
  'https://api.open-meteo.com/v1/forecast' +
  '?latitude=13.71&longitude=100.41' +
  '&current=temperature_2m,weather_code,is_day' +
  '&timezone=Asia%2FBangkok';

let weatherData = null;
let weatherUpdatedAt = 0;
let weatherLoading = false;

function weatherDescription(code){
  if(code===0)return 'ท้องฟ้าแจ่มใส';
  if(code===1)return 'ท้องฟ้าโปร่งเป็นส่วนมาก';
  if(code===2)return 'มีเมฆบางส่วน';
  if(code===3)return 'เมฆมาก';
  if(code===45||code===48)return 'มีหมอก';
  if(code>=51&&code<=57)return 'มีฝนละออง';
  if(code>=61&&code<=67)return 'มีฝนตก';
  if(code>=80&&code<=82)return 'มีฝนเป็นช่วง ๆ';
  if(code>=95)return 'มีพายุฝนฟ้าคะนอง';
  return 'สภาพอากาศแปรปรวน';
}

function weatherSVG(code,isDay){
  const rainy=(code>=51&&code<=82)||code>=95;
  const cloudy=code===3||code===45||code===48;

  const sky=isDay
    ? `<circle cx="25" cy="23" r="11" fill="#FFD76A"/>`
    : `<path d="M34 8A17 17 0 1 0 47 34A19 19 0 0 1 34 8Z" fill="#F4E5B5"/>`;

  const cloud=`<path d="M17 47H47C54 47 58 43 58 37C58 31 53 27 47 27C44 19 38 16 31 18C24 19 20 24 19 29C12 29 7 34 7 40C7 44 11 47 17 47Z" fill="#F4F6FF" stroke="#DCE5F4" stroke-width="1.5"/>`;

  const rain=`<g stroke="#91C8FF" stroke-width="3" stroke-linecap="round">
    <path d="M20 51l-3 7M34 51l-3 7M48 51l-3 7"/>
  </g>`;

  return `<svg viewBox="0 0 64 64" width="65" height="65" xmlns="http://www.w3.org/2000/svg">
    ${cloudy?'':sky}
    ${code===0?'':cloud}
    ${rainy?rain:''}
  </svg>`;
}

function showWeather(){
  const temp=document.getElementById('weatherTemp');
  const desc=document.getElementById('weatherDesc');
  const iconBox=document.getElementById('weatherIcon');

  if(!temp||!desc||!iconBox)return;

  if(!weatherData){
    temp.textContent='--°';
    desc.textContent=weatherLoading
      ? 'กำลังโหลดสภาพอากาศ...'
      : 'ไม่สามารถโหลดสภาพอากาศได้';
    return;
  }

  temp.textContent=Math.round(weatherData.temperature_2m)+'°';
  desc.textContent=weatherDescription(weatherData.weather_code);
  iconBox.innerHTML=weatherSVG(
    weatherData.weather_code,
    weatherData.is_day===1
  );
}

async function updateWeather(){
  if(weatherLoading)return;

  if(weatherData && Date.now()-weatherUpdatedAt<600000){
    showWeather();
    return;
  }

  weatherLoading=true;
  showWeather();

  try{
    const response=await fetch(WEATHER_URL,{cache:'no-store'});
    if(!response.ok)throw new Error('Weather API error');

    const data=await response.json();
    if(!data.current ||
       !Number.isFinite(data.current.temperature_2m)){
      throw new Error('Invalid weather data');
    }

    weatherData=data.current;
    weatherUpdatedAt=Date.now();
  }catch(error){
    console.error('Weather:',error);
    if(!weatherData)weatherData=null;
  }finally{
    weatherLoading=false;
    showWeather();
  }
}

function grabIcon(type){
  const paths={
    home:'<path d="m3 10 9-7 9 7v11H3Z"/><path d="M9 21v-7h6v7"/>',
    moments:'<circle cx="12" cy="12" r="9"/><path d="m8 13 3 3 5-7"/>',
    wallet:'<circle cx="12" cy="12" r="9"/><path d="M15 8H11a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4H9M12 6v12"/>',
    orders:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h5M8 16h5"/>',
    messages:'<path d="M4 4h16v13H9l-5 4Z"/><path d="M8 9h8M8 13h5"/>',
    search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',
    back:'<path d="m15 5-7 7 7 7"/>',
    cake:'<path d="M4 11h16v10H4Z"/><path d="M4 15h16M8 11V6M12 11V6M16 11V6"/>',
    cart:'<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 13h11l3-9H6"/>',
    pin:'<path d="M12 22s8-8 8-13a8 8 0 1 0-16 0c0 5 8 13 8 13Z"/><circle cx="12" cy="9" r="2.5"/>'
  };
  return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
    (paths[type]||paths.home)+'</svg>';
}

let grabPrepareTimer=null;
let grabFirstCallTimer=null;
let grabSecondCallTimer=null;
let grabCallRound=0;

function clearGrabTimers(){
  clearTimeout(grabPrepareTimer);
  clearTimeout(grabFirstCallTimer);
  clearTimeout(grabSecondCallTimer);

  grabPrepareTimer=null;
  grabFirstCallTimer=null;
  grabSecondCallTimer=null;
}

function grabStartDelivery(){
  clearGrabTimers();
  grabCallRound=0;

  save.flags.deliveryStatus='preparing';
  persist();
  render();

  // หลัง 2 วินาที เปลี่ยนเป็นกำลังจัดส่ง
  grabPrepareTimer=setTimeout(()=>{
    if(save.flags.deliveryStatus!=='preparing') return;

    save.flags.deliveryStatus='shipping';
    persist();
    render();
  },2000);

  // หลังสั่งซื้อครบ 5 วินาที โทรเข้าครั้งแรก
  grabFirstCallTimer=setTimeout(()=>{
    if(save.flags.deliveryStatus!=='shipping') return;

    grabIncomingCall(1);
  },5000);
}

function grabIncomingCall(round){
  if(save.flags.deliveryStatus==='delivered') return;

  grabCallRound=round;

  const modal=document.getElementById('modal');
  if(!modal) return;

  modal.innerHTML=`
    <div class="grab-call-overlay">
      <div class="grab-call-screen">

        <div class="grab-call-top">
          <span>GrabFood</span>
          <small>สายเรียกเข้า</small>

          <small>กำลังโทรหาคุณ...</small>

        <div class="grab-call-actions">
          <button class="grab-reject"
                  data-delivery-call="miss">
            ${grabPhoneIcon(false)}

function renderCalendar(){
  const firstDay=new Date(calendarYear,calendarMonth,1).getDay();
  const daysInMonth=new Date(calendarYear,calendarMonth+1,0).getDate();

  let days='';

  for(let i=0;i<42;i++){
    const day=i-firstDay+1;

    if(day<1 || day>daysInMonth){
      days+='<div></div>';
      continue;
    }

    const date=calendarDateKey(calendarYear,calendarMonth,day);
    const events=calendarEvents.filter(x=>x.date===date);

    days+=
      '<button class="calendar-day '+
      (date===calendarSelected?'selected ':'')+
      (i%7===0?'sunday':'')+
      '" data-calendar-date="'+date+'">'+
        '<span class="calendar-number">'+day+'</span>'+
        '<span class="calendar-dots">'+
          events.map(event=>
            '<span class="calendar-dot '+
            (event.type==='personal'?'personal':'')+
            '"></span>'
          ).join('')+
        '</span>'+
      '</button>';
  }

  const selectedEvents=calendarEvents.filter(
    event=>event.date===calendarSelected
  );

  const selectedDate=new Date(calendarSelected+'T12:00:00');

  const dateLabel=
    selectedDate.getDate()+' '+
    thaiMonths[selectedDate.getMonth()]+' '+
    (selectedDate.getFullYear()+543);

  return '<div class="calendar-app">'+
    '<div class="calendar-top">'+
      '<div class="calendar-toolbar">'+
        '<div class="calendar-top-title">'+
          thaiMonths[calendarMonth]+' '+(calendarYear+543)+
        '</div>'+
        '<div class="calendar-top-actions">'+
          '<button class="calendar-iconbtn" data-calendar-search-toggle="1" aria-label="ค้นหานัดหมาย">'+
            calendarIcon('search')+
          '</button>'+
          '<button class="calendar-iconbtn" data-calendar-today="1" aria-label="กลับไปวันที่ 6 มีนาคม">'+
            calendarIcon('today')+
          '</button>'+
        '</div>'+
      '</div>'+
      '<div class="calendar-month-nav">'+
        '<button data-calendar-nav="-1">‹ เดือนก่อน</button>'+
        '<button data-calendar-nav="1">เดือนถัดไป ›</button>'+
        '<span class="calendar-spacer"></span>'+
      '</div>'+
      '<div class="calendar-search" id="calendarSearch">'+
        '<input id="calendarSearchInput" type="search" placeholder="ค้นหานัดหมาย" aria-label="ค้นหานัดหมาย">'+
      '</div>'+
    '</div>'+
    '<div class="calendar-weekdays">'+
      ['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>
        '<span>'+d+'</span>'
      ).join('')+
    '</div>'+
    '<div class="calendar-grid">'+days+'</div>'+
    '<div class="calendar-agenda">'+
      '<div class="calendar-agenda-title">'+
        '<span>'+dateLabel+'</span>'+
        '<small>'+selectedEvents.length+' กิจกรรม</small>'+
      '</div>'+
      '<div id="calendarEventList">'+
        (selectedEvents.length
          ? selectedEvents.map(event=>
              '<div class="calendar-event">'+
                '<div class="calendar-event-bar '+
                  (event.type==='personal'?'personal':'')+
                '"></div>'+
                '<div>'+
                  '<strong>'+event.title+'</strong>'+
                  '<small>'+event.time+'</small>'+
                  '<small>'+event.detail+'</small>'+
                '</div>'+
              '</div>'
            ).join('')
          : '<div class="calendar-empty">ไม่มีกิจกรรมในวันนี้</div>'
        )+

}

let samsungClockTab='alarm';

let samsungStopwatchElapsed=0;
let samsungTimerStartedAt=null;
let samsungTimerRemaining=300000;

function samsungClockIcon(type){
  const paths={
    alarm:`
      <circle cx="12" cy="13" r="7"/>
      <path d="M12 9v4l3 2M5 3 2 6M19 3l3 3M7 21l-2 2M17 21l2 2"/>`,
    world:`
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>`,
    stopwatch:`
      <circle cx="12" cy="14" r="8"/>
      <path d="M12 6V3M9 3h6M12 10v5l3 2M19 6l2-2"/>`,
    timer:`
      <circle cx="12" cy="13" r="9"/>
      <path d="M12 7v6l4 3M9 2h6"/>`,
    back:`
      <path d="M15 5 8 12l7 7"/>`
  };

  return `
    <svg viewBox="0 0 24 24"
      width="24" height="24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">
      ${paths[type]||''}
    </svg>`;
}

function samsungClockFormat(ms){
  const s=Math.floor(Math.max(0,ms)/1000);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;

  return [h,m,sec]
    .map(v=>String(v).padStart(2,'0'))
    .join(':');
}

      width="75" height="75"

               C52 14 61 29 40 43Z"
        fill="${petal}"/>

               C31 20 39 30 38 42Z"

               C49 20 41 30 42 42Z"

function ep8PhoneSVG(name){
  const shapes={
    back:'<path d="M15 18 9 12l6-6M9 12h12"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',
    more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/>',

    call:'<path d="M6 3c-2 0-3 2-3 4 0 7 7 14 14 14 2 0 4-1 4-3v-3l-5-2-3 3c-3-1-5-3-6-6l3-3-2-4Z"/>',
    hangup:'<path d="M3 13c5-5 13-5 18 0l-3 5-4-2v-3a13 13 0 0 0-4 0v3l-4 2-3-5Z"/>',
    delete:'<path d="M9 4H21v16H9L2 12Z"/><path d="m12 9 5 6m0-6-5 6"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
    mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    speaker:'<path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="M17 8q5 4 0 8"/>',
    keypad:'<circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/>'
  };

  return `<svg class="ico"
    viewBox="0 0 24 24"

function renderEp8Phone(){

  const f=save.flags;

   if(ep8Calling){
    const c=ep8Customers.find(
      x=>x.id===ep8Calling
    );

    if(!c){
      ep8Calling=null;
      return renderEp8Phone();
    }

    return `
      <div class="ep8-call-screen">

        <div class="ep8-call-top">
          <div class="ep8-phone-avatar">
            ${ep8PhoneSVG('user')}
          </div>

          <h2>${c.name}</h2>
          <small>${c.phone}</small>
          <div class="ep8-call-timer">กำลังสนทนา</div>
        </div>

        <div class="ep8-call-bottom">
          <div class="ep8-call-controls">
            <span>${ep8PhoneSVG('mic')}</span>
            <span>${ep8PhoneSVG('keypad')}</span>
            <span>${ep8PhoneSVG('speaker')}</span>
          </div>

          <button class="ep8-hangup"
            data-ep8-hangup="1"
            aria-label="วางสาย">
            ${ep8PhoneSVG('hangup')}
          </button>
        </div>

      </div>
    `;
  }
  const tabs=`
    <div class="ep8-phone-tabs">
      <button data-ep8-tab="keypad"
        class="${ep8PhoneTab==='keypad'?'active':''}">
        แป้นโทรศัพท์
      </button>
      <button data-ep8-tab="recents"
        class="${ep8PhoneTab==='recents'?'active':''}">
        ล่าสุด
      </button>
      <button data-ep8-tab="contacts"
        class="${ep8PhoneTab==='contacts'?'active':''}">
        รายชื่อ
      </button>
    </div>
  `;

  let content='';

  if(ep8PhoneTab==='keypad'){

    const keys=[
      ['1',''],['2','ABC'],['3','DEF'],
      ['4','GHI'],['5','JKL'],['6','MNO'],
      ['7','PQRS'],['8','TUV'],['9','WXYZ'],
      ['*',''],['0','+'],['#','']
    ];

    content=`
      <div class="ep8-keypad">
        <div class="ep8-dial-display">
          ${ep8DialNumber||'&nbsp;'}
        </div>

        <div class="ep8-dial-grid">
          ${keys.map(k=>`
            <button class="ep8-dial-key"
              data-ep8-digit="${k[0]}">
              ${k[0]}
              <small>${k[1]}</small>
            </button>
          `).join('')}
        </div>

        <div class="ep8-dial-bottom">
          <button class="ep8-call-green"
            data-ep8-dial-call="1"
            aria-label="โทรออก">
            ${ep8PhoneSVG('call')}
          </button>

          <button class="ep8-delete"
            data-ep8-delete="1"
            aria-label="ลบตัวเลข">
            ${ep8PhoneSVG('delete')}
          </button>
        </div>
      </div>
    `;
  }

if(ep8PhoneTab==='contacts'){

  const available=ep8Customers.filter(c=>
    c.source==='เดิม' ||
    f.ep8ContactsReceived
  );

  const filtered=available.filter(c=>
    c.name.toLowerCase().includes(
      ep8PhoneSearch.toLowerCase()
    ) ||
    c.phone.includes(ep8PhoneSearch)
  );

  content=`
    <div class="ep8-phone-search">
      ${ep8PhoneSVG('search')}
      <input id="ep8PhoneSearch"
        value="${ep8PhoneSearch}"
        placeholder="ค้นหาชื่อหรือหมายเลข"
        autocomplete="off">
    </div>

    <div class="ep8-contact-count">
      รายชื่อทั้งหมด ${available.length} ราย
    </div>

    ${filtered.map(c=>`
      <div class="ep8-phone-contact">
        <div class="ep8-phone-avatar">
          ${ep8PhoneSVG('user')}
        </div>

        <div class="ep8-phone-contact-info">
          <strong>${c.name}</strong>
          <small>${c.phone}</small>
        </div>

        <button class="ep8-phone-callbtn"
          data-ep8-call="${c.id}"
          aria-label="โทรหา ${c.name}">
          ${ep8PhoneSVG('call')}
        </button>
      </div>
    `).join('')}

    ${filtered.length===0
      ? `<div class="ep8-empty">
           ไม่พบรายชื่อที่ค้นหา
         </div>`
      : ''}
  `;
}

  if(ep8PhoneTab==='recents'){

    content=ep8CallHistory.length
      ? ep8CallHistory.slice().reverse().map(id=>{
          const c=ep8Customers.find(x=>x.id===id);
          if(!c)return '';

          return `
            <div class="ep8-phone-contact">
              <div class="ep8-phone-avatar">
                ${ep8PhoneSVG('clock')}
              </div>

              <div class="ep8-phone-contact-info">
                <strong>${c.name}</strong>
                <small>โทรออก · วันนี้</small>
              </div>

              <button class="ep8-phone-callbtn"
                data-ep8-call="${c.id}">
                ${ep8PhoneSVG('call')}
              </button>
            </div>
          `;
        }).join('')
      : `<div class="ep8-empty">
           ยังไม่มีประวัติการโทรใหม่
         </div>`;
  }

  return `
    <div class="ep8-phone">

      <div class="ep8-phone-header">
        <button data-go="home"
          aria-label="กลับหน้าหลัก">
          ${ep8PhoneSVG('back')}
        </button>

        <div class="ep8-phone-actions">
          <button data-ep8-tab="contacts"
            aria-label="ค้นหารายชื่อ">
            ${ep8PhoneSVG('search')}
          </button>
        </div>
      </div>

      <div class="ep8-phone-title">
        ${ep8PhoneTab==='keypad'
          ? 'แป้นโทรศัพท์'
          : ep8PhoneTab==='recents'
          ? 'ล่าสุด'
          : 'รายชื่อ'}
      </div>

      <div class="ep8-phone-content">
        ${content}
      </div>
      ${tabs}
    </div>
  `;
}

function ep12Escape(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

  save.flags.ep12Card={...ep12Card};

}

function ep12CardSVG(){
  const c=ep12Card;
  const safe=ep12Escape;
  const font=ep12Fonts[c.font]||ep12Fonts.Georgia;

  const backgrounds={
    classic:'#fff9f2',
    blush:'#fce9ed',
    sage:'#e9f2e9',
    blue:'#e9efff',
    lavender:'#f0e8ff',
    peach:'#ffeadb'
  };

  const bg=c.background==='gradient'
    ? 'url(#ep12Gradient)'
    : (backgrounds[c.background]||c.color1);

  const border=c.template==='minimal'
    ? ''
    : `<rect x="18" y="18" width="324" height="484"
       rx="${c.template==='modern'?0:12}"
       fill="none" stroke="${c.textColor}"
       stroke-opacity=".4" stroke-width="1.5"/>`;

  const extra=c.template==='royal'
    ? `<path d="M145 98 H215 M145 420 H215"
       stroke="${c.textColor}" stroke-width="2"/>`
    : '';

  return `<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 360 520" width="360" height="520">
    <defs>
      <linearGradient id="ep12Gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c.color1}"/>
        <stop offset="100%" stop-color="${c.color2}"/>

    </defs>

    <rect width="360" height="520" fill="${bg}"/>
    ${border}
    ${ep12Decorations()}
    ${extra}

    <g text-anchor="middle"
       fill="${c.textColor}"
       font-family="${font}">

function ep12DownloadFile(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

function ep12ExportSVG(){
  const blob=new Blob([ep12CardSVG()],{
    type:'image/svg+xml;charset=utf-8'
  });
  ep12DownloadFile(blob,'Karan-Achi-Wedding.svg');
}

function ep12ExportPNG(){
  const svg=ep12CardSVG();
  const blob=new Blob([svg],{
    type:'image/svg+xml;charset=utf-8'
  });
  const url=URL.createObjectURL(blob);
  const img=new Image();

  img.onload=()=>{
    const canvas=document.createElement('canvas');
    canvas.width=1080;
    canvas.height=1560;

    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,1080,1560);
    URL.revokeObjectURL(url);

    canvas.toBlob(file=>{
      if(file){
        ep12DownloadFile(file,'Karan-Achi-Wedding.png');
      }
    },'image/png');
  };

  img.onerror=()=>{
    URL.revokeObjectURL(url);
    alert('ไม่สามารถสร้าง PNG ได้');
  };

  img.src=url;
}

function ep2ChooseRoute(route){
  if(!ep2InviteRoutes[route])return;

  const data = ep2InviteRoutes[route];

  save.flags.ep2InviteRoute = route;
  save.flags.ep2InviteStep = 0;
  save.flags.ep2InviteHistory = [
    {out:true,text:data.first},
    {out:false,text:data.replies[0]}
  ];

  if(route === 'work'){
    ep2Finish();
  }

  persist();
}

function ep2ContinueInvite(choiceIndex){
  const route = save.flags.ep2InviteRoute;
  const data = ep2InviteRoutes[route];

  if(!data || route === 'work')return;

  const step = save.flags.ep2InviteStep;
  const options = data.choices[step];

  if(!options || !options[choiceIndex])return;

  save.flags.ep2InviteHistory.push({
    out:true,
    text:options[choiceIndex]
  });

  const nextStep = step + 1;

  save.flags.ep2InviteStep = nextStep;

  save.flags.ep2InviteHistory.push({
    out:false,
    text:data.replies[nextStep]
  });

  if(nextStep === data.replies.length - 1){
    ep2Finish();
  }

  persist();
}

  save.flags.ep2Completed = true;
  unlock('ปฏิทิน');
  persist();

/* ===== EP.07 LOVE CELEBRATION ===== */

function ep7CreateLoveEffect(type){
  const NS='http://www.w3.org/2000/svg';

  const layer=document.createElement('div');
  layer.className='ep7-love-effect';

  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 360 780');
  svg.setAttribute('preserveAspectRatio','none');

  layer.appendChild(svg);

  const make=(tag,attrs)=>{
    const el=document.createElementNS(NS,tag);

    Object.entries(attrs).forEach(([key,value])=>{
      el.setAttribute(key,String(value));
    });

    return el;
  };

  if(type==='rainbow' || type==='flowers'){

    const colors=type==='rainbow'
      ? [
          '#ff648c','#ffb04c','#ffe36b',
          '#7dd9a4','#75baff','#bd91ed'
        ]
      : [
          '#f6a4bf','#f9c3d5','#e98db3',
          '#fff0f4','#dca2c8'
        ];

    for(let i=0;i<85;i++){
      const x=Math.random()*360;
      const y=-Math.random()*780-30;

      const group=make('g',{
        class:'ep7-falling-piece'
      });

      group.style.setProperty(
        '--duration',
        `${3+Math.random()*2}s`
      );

      group.style.setProperty(
        '--delay',
        `${Math.random()*1.2}s`
      );

      group.style.setProperty(
        '--drift',
        `${Math.random()*130-65}px`
      );

      group.style.setProperty(
        '--spin',
        `${Math.random()*900-450}deg`
      );

      const color=colors[
        Math.floor(Math.random()*colors.length)
      ];

      let piece;

      if(type==='rainbow'){
        piece=make('rect',{
          x:x,
          y:y,
          width:5+Math.random()*7,
          height:9+Math.random()*10,
          rx:1.5,
          fill:color
        });
      }else{
        piece=make('path',{
          d:`M ${x} ${y}
             C ${x-13} ${y-12},
               ${x-19} ${y+8},
               ${x} ${y+20}
             C ${x+19} ${y+8},
               ${x+13} ${y-12},
               ${x} ${y} Z`,
          fill:color
        });
      }

      group.appendChild(piece);
      svg.appendChild(group);
    }
  }

  if(type==='fireworks'){

    const colors=[
      '#ff87b4',
      '#ffd36f',
      '#8ac8ff',
      '#d7a0ff',
      '#a5e6cf'
    ];

    const positions=[
      [75,170],[270,130],[170,280],
      [85,400],[280,450],[180,570],
      [60,650],[295,680]
    ];

    positions.forEach(([x,y],i)=>{
      const group=make('g',{
        class:'ep7-firework-burst',
        transform:`translate(${x} ${y})`
      });

      group.style.setProperty(
        '--delay',
        `${i*.38}s`
      );

      for(let j=0;j<14;j++){
        const a=j*Math.PI*2/14;

        group.appendChild(make('line',{
          x1:Math.cos(a)*9,
          y1:Math.sin(a)*9,
          x2:Math.cos(a)*38,
          y2:Math.sin(a)*38,
          stroke:colors[i%colors.length],
          'stroke-width':3.5,
          'stroke-linecap':'round'
        }));
      }

      svg.appendChild(group);
    });
  }

  return layer;
}

function ep7PlayLoveEffect(type){
  if(page!=='chat' || chat!=='achi')return;

  const chatBody=document.getElementById(
    'lineChatBody'
  );

  if(!chatBody)return;

  const host=chatBody.closest('.line-chat') ||
    chatBody.parentElement;

  if(!host)return;

  const existing=host.querySelector(
    '.ep7-love-effect'
  );

  if(existing)existing.remove();

  if(getComputedStyle(host).position==='static'){
    host.style.position='relative';
  }

  const layer=ep7CreateLoveEffect(type);

  host.appendChild(layer);

  setTimeout(()=>{
    layer.remove();
  },6000);
}

document.addEventListener('input',function(e){
  if(e.target.id!=='calendarSearchInput' || page!=='ปฏิทิน') return;

  const q=e.target.value.trim().toLocaleLowerCase('th');
  const list=document.getElementById('calendarEventList');
  if(!list) return;

  const events=q
    ? calendarEvents.filter(x=>
        (x.title+' '+x.detail+' '+x.date)
          .toLocaleLowerCase('th').includes(q)
      )
    : calendarEvents.filter(x=>x.date===calendarSelected);

  list.innerHTML=events.length
    ? events.map(event=>
        '<div class="calendar-event">'+
          '<div class="calendar-event-bar '+
            (event.type==='personal'?'personal':'')+
          '"></div>'+
          '<div>'+
            '<strong>'+event.title+'</strong>'+
            '<small>'+(q?event.date+' · ':'')+event.time+'</small>'+
            '<small>'+event.detail+'</small>'+
          '</div>'+
        '</div>'
      ).join('')
    : '<div class="calendar-empty">'+
        (q?'ไม่พบนัดหมายที่ค้นหา':'ไม่มีกิจกรรมในวันนี้')+
      '</div>';
});

document.addEventListener('input',function(e){

  if(

    render();

      input.setSelectionRange(position,position);
    }

    return;

  const cursor=e.target.selectionStart;

  render();

  const input=document.getElementById('lineSearchInput');
  if(input){
    input.focus();
    input.setSelectionRange(cursor,cursor);
  }
});

/* ===== SAMSUNG CLOCK LIVE UPDATE ===== */

setInterval(()=>{
  if(page!=='นาฬิกา')return;

  const bangkok=document.getElementById(
    'sclockBangkok'
  );

  const tokyo=document.getElementById(
    'sclockTokyo'
  );

  const time=(zone)=>new Intl.DateTimeFormat(
    'th-TH',{
      timeZone:zone,
      hour:'2-digit',
      minute:'2-digit',
      hourCycle:'h23'
    }
  ).format(new Date());

  if(bangkok){
    bangkok.textContent=time('Asia/Bangkok');
  }

  if(tokyo){
    tokyo.textContent=time('Asia/Tokyo');
  }

  const sw=document.getElementById(
    'sclockStopwatchDisplay'
  );

  if(sw){
    sw.textContent=samsungClockFormat(
      samsungStopwatchElapsed+
      (samsungStopwatchStartedAt===null
        ? 0
        : Date.now()-samsungStopwatchStartedAt)
    );
  }

  const timer=document.getElementById(
    'sclockTimerDisplay'
  );

  if(timer){
    const remaining=samsungTimerStartedAt===null
      ? samsungTimerRemaining
      : Math.max(
          0,
          samsungTimerRemaining-
          (Date.now()-samsungTimerStartedAt)
        );

    timer.textContent=samsungClockFormat(remaining);

    if(
      remaining===0 &&
      samsungTimerStartedAt!==null
    ){
      samsungTimerStartedAt=null;
      samsungTimerRemaining=0;
    }
  }
},250);

/* ===== EP.12 LIVE CARD EDITING ===== */

document.addEventListener('input',function(e){
  const field=e.target.closest('[data-ep12-field]');
  if(!field || page!=='ไฟล์')return;

  const name=field.dataset.ep12Field;

  ep12Card[name]=
    name==='size'||name==='ornamentSize'
      ? Number(field.value)
      : field.value;

  ep12SaveCard();

  const preview=document.querySelector('.ep12-preview');
  if(preview){
    preview.innerHTML=ep12CardSVG();
  }
});

document.addEventListener('change',function(e){
  const field=e.target.closest('[data-ep12-field]');
  if(!field || page!=='ไฟล์')return;

  ep12Card[field.dataset.ep12Field]=field.value;
  ep12SaveCard();

  const preview=document.querySelector('.ep12-preview');
  if(preview){
    preview.innerHTML=ep12CardSVG();
  }
});
