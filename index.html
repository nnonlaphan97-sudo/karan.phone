<!doctype html>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,'Noto Sans Thai',sans-serif;background:#10182a;color:#fff}
button,input,select{font:inherit}
button{cursor:pointer}

#phone{
  position:relative;
  width:100%;
  max-width:440px;
  height:100dvh;
  min-height:550px;
  margin:auto;
  overflow:hidden;
  background:#10182a;
}

#phone::before{
  content:"";

  inset:-12px;
  background:url("https://i.ibb.co/5WfPWvbp/IMG-4436.jpg") center/cover no-repeat;
  filter:blur(6px);
  pointer-events:none;
}
#phone:has(.lock){background:#e9ebf9}
#phone:has(.lock) .status{color:#4b3652}
#phone:has(.lock) .nav span{background:rgba(255,255,255,.4)}
.status{height:36px;padding:9px 10px 0 22px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:20;font-size:13px;font-weight:600;color:#4b3652;background:transparent}

.camera{

  z-index:30;
  top:12px;
  left:calc(50% - 6px);

  height:12px;
  background:#081322;
  border:2px solid #23374e;
  border-radius:50%;
  pointer-events:none;
}

.status .right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:0;
  height:22px;
}

.status-icons{
  width:108px;
  height:22px;
  display:block;
  color:inherit;
  flex-shrink:0;
}

.ico{width:22px;height:22px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.small{width:17px;height:17px}

.screen{

  inset:0;
  overflow-y:auto;
  scrollbar-width:none;
}

.screen::-webkit-scrollbar{display:none}
.nav{position:absolute;bottom:0;left:0;width:100%;height:22px;z-index:40;display:flex;align-items:center;justify-content:center;background:transparent}.nav span{width:105px;height:4px;background:#f6f8fd;border-radius:5px}

.lock{

  height:100%;

}

.lock-wallpaper{

const paths={

mute:'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/>',

signal:'<rect x="3" y="15" width="3.5" height="6" rx="1.75" fill="currentColor" stroke="none"/><rect x="8" y="11" width="3.5" height="10" rx="1.75" fill="currentColor" stroke="none"/><rect x="13" y="7" width="3.5" height="14" rx="1.75" fill="currentColor" stroke="none"/><rect x="18" y="3" width="3.5" height="18" rx="1.75" fill="currentColor" stroke="none"/>',

battery:'<path d="M7 5H17A5 5 0 0 1 22 10V14A5 5 0 0 1 17 19H7A5 5 0 0 1 2 14V10A5 5 0 0 1 7 5Z" fill="currentColor" stroke="none"/><path d="M22 9.5h1v5h-1" fill="currentColor" stroke="none"/>',

batteryLevel:'<path d="M7 5H12V19H7A5 5 0 0 1 2 14V10A5 5 0 0 1 7 5Z" fill="currentColor" stroke="none"/>',
cake:'<path d="M3 12h18v9H3zM3 16h18M7 12V8M12 12V8M17 12V8M7 5v1M12 5v1M17 5v1"/>',
check:'<path d="m4 12 5 5L20 6"/>',
send:'<path d="m3 3 18 9-18 9 4-9-4-9ZM7 12h14"/>'

const appdefs=[
['LINE','line','#06c755'],
['โทรศัพท์','phone','#56a97f'],

];

const key='karan_phone_v2';

let save={
unlock:['LINE'],
flags:{},
replies:{}
};

try{
  const old=JSON.parse(localStorage.getItem(key));
  if(old){
    save={
      ...save,
      ...old,
      flags:old.flags||{},
      replies:old.replies||{}
    };
    delete save.card;
  }
}catch(e){}

let page='lock',chat='';

function persist(){
try{localStorage.setItem(key,JSON.stringify(save))}catch(e){}
}

function unlock(name){
if(!save.unlock.includes(name)){
save.unlock.push(name);
persist();
}
}

}


const WEATHER_URL =
  'https://api.open-meteo.com/v1/forecast' +
  '?latitude=13.71&longitude=100.41' +
  '&current=temperature_2m,weather_code,is_day' +
  '&timezone=Asia%2FBangkok';

let weatherData = null;
let weatherUpdatedAt = 0;
let weatherLoading = false;

function weatherDescription(code){
  if(code===0)return 'ท้องฟ้าแจ่มใส';
  if(code===1)return 'ท้องฟ้าโปร่งเป็นส่วนมาก';
  if(code===2)return 'มีเมฆบางส่วน';
  if(code===3)return 'เมฆมาก';
  if(code===45||code===48)return 'มีหมอก';
  if(code>=51&&code<=57)return 'มีฝนละออง';
  if(code>=61&&code<=67)return 'มีฝนตก';
  if(code>=80&&code<=82)return 'มีฝนเป็นช่วง ๆ';
  if(code>=95)return 'มีพายุฝนฟ้าคะนอง';
  return 'สภาพอากาศแปรปรวน';
}

function weatherSVG(code,isDay){
  const rainy=(code>=51&&code<=82)||code>=95;
  const cloudy=code===3||code===45||code===48;

  const sky=isDay
    ? `<circle cx="25" cy="23" r="11" fill="#FFD76A"/>`
    : `<path d="M34 8A17 17 0 1 0 47 34A19 19 0 0 1 34 8Z" fill="#F4E5B5"/>`;

  const cloud=`<path d="M17 47H47C54 47 58 43 58 37C58 31 53 27 47 27C44 19 38 16 31 18C24 19 20 24 19 29C12 29 7 34 7 40C7 44 11 47 17 47Z" fill="#F4F6FF" stroke="#DCE5F4" stroke-width="1.5"/>`;

  const rain=`<g stroke="#91C8FF" stroke-width="3" stroke-linecap="round">
    <path d="M20 51l-3 7M34 51l-3 7M48 51l-3 7"/>
  </g>`;

  return `<svg viewBox="0 0 64 64" width="65" height="65" xmlns="http://www.w3.org/2000/svg">
    ${cloudy?'':sky}
    ${code===0?'':cloud}
    ${rainy?rain:''}
  </svg>`;
}

function showWeather(){
  const temp=document.getElementById('weatherTemp');
  const desc=document.getElementById('weatherDesc');
  const iconBox=document.getElementById('weatherIcon');

  if(!temp||!desc||!iconBox)return;

  if(!weatherData){
    temp.textContent='--°';
    desc.textContent=weatherLoading
      ? 'กำลังโหลดสภาพอากาศ...'
      : 'ไม่สามารถโหลดสภาพอากาศได้';
    return;
  }

  temp.textContent=Math.round(weatherData.temperature_2m)+'°';
  desc.textContent=weatherDescription(weatherData.weather_code);
  iconBox.innerHTML=weatherSVG(
    weatherData.weather_code,
    weatherData.is_day===1
  );
}

async function updateWeather(){
  if(weatherLoading)return;

  if(weatherData && Date.now()-weatherUpdatedAt<600000){
    showWeather();
    return;
  }

  weatherLoading=true;
  showWeather();

  try{
    const response=await fetch(WEATHER_URL,{cache:'no-store'});
    if(!response.ok)throw new Error('Weather API error');

    const data=await response.json();
    if(!data.current ||
       !Number.isFinite(data.current.temperature_2m)){
      throw new Error('Invalid weather data');
    }

    weatherData=data.current;
    weatherUpdatedAt=Date.now();
  }catch(error){
    console.error('Weather:',error);
    if(!weatherData)weatherData=null;
  }finally{
    weatherLoading=false;
    showWeather();
  }
}

else if(page==='LINE'){

['พี่ดุจ','เรื่องเค้กวันเกิดอชิ','duj'],

else if(page==='chat'){

else if(page==='ปฏิทิน'){

function bubble(text,out){
return '<div class="bubble '+(out?'outgoing':'incoming')+'">'+text+'</div>';
}

function renderChat(){
const names={duj:'พี่ดุจ',achi:'อชิ',office:'ประสานงานออฟฟิศ',sales:'ทีมฝ่ายขาย'};
let b='<div class="day">28–30 มกราคม · EP.01</div>';
let choices='';

if(chat==='duj'){
b+=bubble('การันต์ เรื่องเค้กวันเกิดอชิ พี่จัดการให้แล้วนะ');
b+=bubble('ขอบคุณครับ ถ้ามีอะไรให้ผมช่วยเพิ่มเติม บอกได้เลยนะครับ',true);
b+=bubble('พรุ่งนี้พี่จะดูจังหวะเอาเค้กเข้าไปให้นะ');
b+=bubble('ว่าแต่การันต์อยากให้พี่บอกอชิไหมว่าใครเตรียมเค้ก?');

const opts=[
'ไม่ต้องบอกก็ได้ครับ ผมแค่อยากให้อชิมีความสุขในวันเกิด',
'บอกว่าเป็นเค้กจากทุกคนในออฟฟิศก็ได้ครับ',
'แล้วแต่พี่ดุจสะดวกเลยครับ ผมไม่ติดอะไร'
];

if(save.replies.duj){
b+=bubble(save.replies.duj,true);
b+=bubble('ได้เลยจ้ะ พี่จัดการให้ ไม่ต้องห่วง');
b+=bubble('อ้อ วันเกิดอชิอยู่ในปฏิทินบริษัทด้วยนะ');
}else{
choices=opts.map((o,i)=>'<button class="choice" data-reply="duj" data-index="'+i+'">'+o+'</button>').join('');
}
}

if(chat==='achi'){
b+=bubble('สุขสันต์วันเกิดนะครับอชิ ขอให้มีความสุขมาก ๆ นะครับ',true);
b+=bubble('ขอบคุณมากนะครับคุณการันต์');

if(save.replies.achi){
b+=bubble(save.replies.achi,true);
b+=bubble('ขอบคุณนะครับ',false);
}else{
choices=[
'ยินดีครับ',
'ขอให้วันนี้เป็นวันที่ดีนะครับ',
'พักผ่อนด้วยนะครับ'
].map((o,i)=>'<button class="choice" data-reply="achi" data-index="'+i+'">'+o+'</button>').join('');
}
}

if(chat==='office'){
b+=bubble('ปาย: วันนี้มีน้องใหม่เข้าทีมโปรโมชั่น ชื่อร็อคนะคะ');
b+=bubble('ร็อค: สวัสดีครับ ฝากเนื้อฝากตัวด้วยนะครับ');
b+=bubble('อชิ: ยินดีต้อนรับครับ ถ้าต้องประสานงานเอกสารติดต่อผมได้เลยครับ');
b+=bubble('การันต์: ยินดีต้อนรับครับ',true);
}

if(chat==='sales'){
b+=bubble('ฝ่ายขาย: ส่งรายละเอียดลูกค้าเรียบร้อยแล้วครับ');
b+=bubble('การันต์: ขอบคุณครับ รบกวนตรวจตัวเลขอีกครั้งก่อนส่งฉบับสุดท้าย',true);
}

return appwrap(names[chat],'<div class="conversation">'+b+'</div>'+(choices?'<div class="choices"><div class="tinylabel">เลือกข้อความตอบในฐานะการันต์</div>'+choices+'</div>':''));
}

function popup(title,msg){
  document.getElementById('modal').innerHTML=
    '<div class="overlay"><div class="dialog"><h3>'+
    title+'</h3><p>'+msg+
    '</p><button class="action" data-task="close">ตกลง</button></div></div>';
}

function goApp(name){

if(!save.unlock.includes(name)){
popup('ยังไม่สามารถเปิดได้','สำรวจข้อมูลในแอปที่เปิดอยู่เพื่อเข้าถึงส่วนนี้');
return;
}
page=name;
render();
}

document.addEventListener('click',function(e){

const pinBtn=e.target.closest('[data-pin],[data-pin-action]');

if(pinBtn && page==='pin'){

  if(pinBtn.dataset.pinAction==='cancel'){
    pinInput='';
    page='lock';
    render();
    return;
  }

  if(pinBtn.dataset.pinAction==='delete'){
    pinInput=pinInput.slice(0,-1);
    render();
    return;
  }

  if(pinBtn.dataset.pin!==undefined){

    if(pinInput.length>=4)return;

    pinInput+=pinBtn.dataset.pin;

    if(pinInput.length===4){

      if(pinInput===PHONE_PIN){
        pinInput='';
        page='home';
      }else{
        pinInput='';
        alert('รหัส PIN ไม่ถูกต้อง');
      }

    }

    render();
    return;
  }
}

const btn=e.target.closest('[data-go],[data-app],[data-chat],[data-reply],[data-task]');
if(!btn)return;


if(btn.dataset.go){
page=btn.dataset.go;
render();
}
else if(btn.dataset.app){
goApp(btn.dataset.app);
}
else if(btn.dataset.chat){
chat=btn.dataset.chat;
page='chat';
render();
}
else if(btn.dataset.reply){
const who=btn.dataset.reply;
const opts=who==='duj'
?[
'ไม่ต้องบอกก็ได้ครับ ผมแค่อยากให้อชิมีความสุขในวันเกิด',
'บอกว่าเป็นเค้กจากทุกคนในออฟฟิศก็ได้ครับ',
'แล้วแต่พี่ดุจสะดวกเลยครับ ผมไม่ติดอะไร'
]
:[
'ยินดีครับ',
'ขอให้วันนี้เป็นวันที่ดีนะครับ',
'พักผ่อนด้วยนะครับ'
];

save.replies[who]=opts[Number(btn.dataset.index)];

if(who==='duj')unlock('ปฏิทิน');
persist();
render();
}
else if(btn.dataset.task){
const task=btn.dataset.task;

if(task==='close'){
document.getElementById('modal').innerHTML='';
}
if(task==='calendar'){
save.flags.calendar=true;
unlock('คำสั่งซื้อ');
popup('รายละเอียดวันเกิด','พี่ดุจช่วยดูเรื่องเค้กแล้ว คุณสามารถตรวจสอบรายการที่เกี่ยวข้องได้');
}
if(task==='order'){
save.flags.order=true;
unlock('โทรศัพท์');
popup('รายการเค้ก','คำสั่งซื้อได้รับการยืนยันแล้ว');
}
if(task==='dinner'){
unlock('โน้ต');
popup('รายการอาหาร','จัดส่งเรียบร้อยแล้ว มีข้อมูลเพิ่มเติมในโน้ต');
}
}
});

document.getElementById('nav').addEventListener('click',function(){
  if(page==='lock'){
    pinInput='';
    page='pin';
  }else if(page==='pin'){
    return;
  }else{
    page='home';
  }
  render();
});

let touchY=0;

screen.addEventListener('touchstart',e=>{
  touchY=e.touches[0].clientY;
},{passive:true});

screen.addEventListener('touchend',e=>{
  if(page==='lock' &&
     touchY-e.changedTouches[0].clientY>45){

    pinInput='';
    page='pin';
    render();
  }
},{passive:true});

try {
  render();
} catch(error) {
  console.error('Render error:', error);
  alert('เกิดข้อผิดพลาด: ' + error.message);
}

setInterval(()=>{
  if(page==='home')updateWeather();
},600000);

})();
</script>
