{title:'อนาคตที่อยากมีด้วยกัน',date:'วันสำคัญ',prompt:'การันต์คิดถึงอนาคตกับอชิ จะพูดเรื่องแต่งงานอย่างไร?',apps:['notes','calendar','gallery'],clues:[['notes','future','บันทึก: อยากใช้ชีวิตด้วยกัน แต่คำตอบของอชิต้องเป็นสิ่งที่เขาเลือกเอง'],['calendar','special','ปฏิทิน: วันนัดสำคัญของเราสองคน'],['gallery','album','อัลบั้ม: จากวันแรกที่แอบชอบ จนถึงวันนี้']],choices:[['ask','พูดถึงอนาคตร่วมกันและขอแต่งงานโดยเคารพคำตอบ',12,12,-6],['force','กดดันให้อชิตอบตกลงต่อหน้าคนอื่น',-21,-18,20],['assume','ตัดสินใจทุกอย่างแทนอชิโดยไม่ปรึกษา',-16,-14,16]],response:['อชิ: ผมอยากคุยเรื่องอนาคตกับคุณเหมือนกันครับ','อชิ: ทำไมต้องให้ผมตอบเดี๋ยวนี้ด้วยครับ','อชิ: เรื่องนี้ควรเป็นการตัดสินใจของเราสองคนไม่ใช่เหรอครับ']}
];
const appNames={line:'LINE',calendar:'ปฏิทิน',shop:'คำสั่งซื้อ',notes:'โน้ต',gallery:'รูปภาพ',calls:'โทรศัพท์',files:'ไฟล์',clock:'นาฬิกา'};
const appIcons={line:'☏',calendar:'▦',shop:'▤',notes:'▧',gallery:'▣',calls:'☎',files:'▱',clock:'◷'};
const appColors={line:'#06c755',calendar:'#789de0',shop:'#e0a16e',notes:'#d6b56b',gallery:'#d79ec2',calls:'#74bba4',files:'#96a8c6',clock:'#9f9de0'};
const base=()=>({ep:0,screen:'lock',pin:'',opened:[],seen:[],choice:null,decisions:[],comfort:60,trust:55,distance:10,hint:false,ending:false});
let s;try{s={...base(),...JSON.parse(localStorage.getItem('karan12save'))}}catch(e){s=base()}
const save=()=>localStorage.setItem('karan12save',JSON.stringify(s));
const set=(obj)=>{Object.assign(s,obj);save();render()};
const ep=()=>episodes[Math.min(s.ep,11)];
const allSeen=()=>ep().clues.every(x=>s.seen.includes(x[1]));
const available=()=>[...new Set([...ep().apps,...s.opened])];
const openApp=(id)=>{if(!available().includes(id))return;set({screen:id,hint:false})};
function home(){set({screen:'home'})}
function findClue(id){if(!s.seen.includes(id))s.seen.push(id);save();render()}
function choose(i){s.choice=i;save();render()}
function commit(){if(s.choice===null||!allSeen())return;const c=ep().choices[s.choice];s.comfort=Math.max(0,Math.min(100,s.comfort+c[2]));s.trust=Math.max(0,Math.min(100,s.trust+c[3]));s.distance=Math.max(0,Math.min(100,s.distance+c[4]));s.decisions.push(s.choice);s.ending=true;s.opened=[...new Set([...s.opened,...ep().apps])];save();render()}
function next(){if(s.ep===11){set({screen:'final'});return}s.ep++;s.screen='home';s.seen=[];s.choice=null;s.hint=false;s.ending=false;s.opened=[];save();render()}
function reset(){if(confirm('เริ่มเกมใหม่ทั้งหมดและลบเซฟเดิม?')){s=base();save();render()}}
function lock(){return `<div class="lockscreen"><div style="font-size:25px">♧</div><div class="clock">21:18</div><p class="dim">KARAN'S PHONE · LOVE ARCHIVE</p><div class="tile" style="text-align:left">LINE · พี่ดุจ<br><small>เรื่องวันเกิดอชิที่ฝากไว้เรียบร้อยแล้วค่ะ</small></div><button class="primary" onclick="set({screen:'pin'})">ปลดล็อกโทรศัพท์</button></div>`}
function pin(){return `<div class="lockscreen"><h2>กรอกรหัส PIN</h2><p>${'●'.repeat(s.pin.length)}${'○'.repeat(4-s.pin.length)}</p><div class="pinpad">${['1','2','3','4','5','6','7','8','9','ลบ','0','ตกลง'].map(n=>`<button onclick="digit('${n}')">${n}</button>`).join('')}</div><p class="dim">คำใบ้: 1906</p></div>`}
function digit(d){if(d==='ลบ')s.pin=s.pin.slice(0,-1);else if(d==='ตกลง'){if(s.pin==='1906'){s.screen='home';s.pin=''}else{alert('รหัสไม่ถูกต้อง');s.pin=''}}else if(s.pin.length<4)s.pin+=d;save();render()}
function homeScreen(){return `<div class="hero"><div class="clock">${s.ep===0?'20:48':'20:15'}</div><div class="dim">${ep().date} · EP ${String(s.ep+1).padStart(2,'0')}</div></div><div class="tile"><div class="row"><b>ความทรงจำของการันต์</b><span class="pill">${s.ep+1}/12</span></div><div class="tiny">${ep().title}</div></div><div class="apps">${Object.keys(appNames).map(id=>`<button class="app ${available().includes(id)?'':'lock'}" onclick="openApp('${id}')"><span class="ico" style="background:${available().includes(id)?appColors[id]:'#53637c'}">${available().includes(id)?appIcons[id]:'♧'}</span>${appNames[id]}</button>`).join('')}</div>${mission()}<button class="darkbtn" onclick="set({screen:'timeline'})">ดูไทม์ไลน์ความสัมพันธ์</button><button class="darkbtn" onclick="reset()">เริ่มเกมใหม่</button>`}
function mission(){return `<div class="tile"><b>EP ${s.ep+1} · ${ep().title}</b><p class="tiny">${s.ending?'การตัดสินใจครั้งนี้ถูกบันทึกแล้ว':allSeen()?'อ่านข้อมูลครบแล้ว ถึงเวลาตัดสินใจ':'สำรวจข้อมูลในแอปที่เปิดได้เพื่อทำความเข้าใจสถานการณ์'}</p><div class="row"><span class="hint">ค้นพบ ${s.seen.length}/${ep().clues.length} รายการ</span><button class="secondary ghost" onclick="set({hint:!s.hint})">คำใบ้</button></div>${s.hint?`<p class="hint">ลองเปิด ${ep().apps.map(a=>appNames[a]).join(' / ')} และแตะบันทึกข้อมูลในแต่ละแอป</p>`:''}${allSeen()&&!s.ending?`<button class="primary" onclick="set({screen:'decision'})">เปิดเหตุการณ์สำคัญ</button>`:''}${s.ending?`<button class="primary" onclick="set({screen:'outcome'})">อ่านผลการตัดสินใจ</button>`:''}</div>`}
function appScreen(){let id=s.screen;let items=ep().clues.filter(x=>x[0]===id);return `<button class="back" onclick="home()">‹　${appNames[id]}</button><div class="panel"><h3>${appNames[id]} · ${ep().date}</h3>${items.length?items.map(([a,key,value])=>`<div class="entry"><b>${key==='duj'?'พี่ดุจ':appNames[id]}</b><div style="white-space:pre-wrap">${value}</div><button class="darkbtn" onclick="findClue('${key}')">${s.seen.includes(key)?'✓ อ่านและเก็บข้อมูลแล้ว':'บันทึกข้อมูลนี้'}</button></div>`).join(''):`<div class="entry"><p>ยังไม่มีข้อมูลใหม่ในแอปนี้สำหรับช่วงเวลาปัจจุบัน</p><small>ข้อมูลจากตอนก่อนยังเก็บอยู่ในไทม์ไลน์</small></div>`}<p class="tiny">ข้อมูลที่บันทึกแล้ว: ${s.seen.length}/${ep().clues.length}</p></div>`}
function decision(){return `<button class="back" onclick="home()">‹　สถานการณ์</button><div class="panel"><span class="tiny">EP ${s.ep+1} · ${ep().title}</span><h3 style="margin-top:12px">${ep().prompt}</h3><p class="tiny">ไม่มีเฉลยก่อนเลือก ผลลัพธ์จะสะสมไปจนจบเกม</p>${ep().choices.map((c,i)=>`<div class="entry ${s.choice===i?'chosen':''}" onclick="choose(${i})">${c[1]}</div>`).join('')}<button class="darkbtn" ${s.choice===null?'disabled':''} onclick="commit()">ยืนยันการตัดสินใจ</button></div>`}
function outcome(){let choice=s.decisions[s.ep];return `<button class="back" onclick="home()">‹　ผลลัพธ์</button><div class="panel"><h3>หลังเหตุการณ์นี้</h3><div class="bubble">${ep().response[choice]}</div><div class="end">${choice===0?'อชิรู้สึกว่าการันต์ให้เกียรติพื้นที่ของเขา':choice===1?'อชิเริ่มรู้สึกกดดันและระมัดระวังมากขึ้น':'ความสัมพันธ์ยังมีเรื่องที่ต้องปรับความเข้าใจกัน'}</div>${meters()}<button class="darkbtn" onclick="next()">${s.ep===11?'ดูตอนจบของเรื่อง':'ไป EP '+(s.ep+2)}</button></div>`}
function meters(){return [['ความสบายใจ',s.comfort],['ความไว้วางใจ',s.trust],['ระยะห่าง',s.distance]].map(([label,v])=>`<p class="tiny">${label} <b style="float:right">${v}%</b></p><div class="bar"><div style="width:${v}%"></div></div>`).join('')}
function timeline(){return `<button class="back" onclick="home()">‹　ไทม์ไลน์</button><div class="panel"><h3>บันทึกความสัมพันธ์</h3>${episodes.map((e,i)=>`<div class="entry"><b>EP ${i+1} · ${e.title}</b><small>${i<s.ep?'ผ่านแล้ว':i===s.ep?'กำลังเล่น':'ยังไม่เปิดเผย'}</small>${i<s.decisions.length?`<p class="tiny">การตัดสินใจ: ${e.choices[s.decisions[i]][1]}</p>`:''}</div>`).join('')}</div>`}
function finale(){let score=s.comfort+s.trust-s.distance;let title=score>=145?'ปลายทางที่เลือกกันและกัน':score>=100?'ความรักที่ยังต้องเรียนรู้':'ระยะห่างที่ต้องเยียวยา';let desc=score>=145?'อชิและการันต์พร้อมคุยเรื่องอนาคตร่วมกันอย่างมั่นใจ การขอแต่งงานกลายเป็นคำสัญญาที่ทั้งคู่เลือกด้วยตัวเอง':score>=100?'ทั้งคู่ยังรักกัน แต่ต้องคุยเรื่องความคาดหวังและความสบายใจให้ชัดก่อนก้าวต่อไป':'อชิขอเวลาและพื้นที่ส่วนตัว การันต์ต้องแสดงให้เห็นว่าเขารับฟังและเคารพขอบเขตจริง ๆ ก่อนความสัมพันธ์จะเดินต่อ';return `<div class="panel"><h2>THE END</h2><h3>${title}</h3><p>${desc}</p>${meters()}<div class="entry">จบครบ 12 EP แล้ว · สามารถเริ่มใหม่เพื่อทดลองทางเลือกอื่นได้</div><button class="darkbtn" onclick="reset()">เล่นใหม่ตั้งแต่ EP.01</button><button class="darkbtn" onclick="set({screen:'timeline'})">ย้อนดูทางเลือกทั้งหมด</button></div>`}
function render(){document.getElementById('root').innerHTML=s.screen==='lock'?lock():s.screen==='pin'?pin():s.screen==='home'?homeScreen():s.screen==='decision'?decision():s.screen==='outcome'?outcome():s.screen==='timeline'?timeline():s.screen==='final'?finale():appScreen()}
render();
</script></body></html>
