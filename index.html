
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KARAN'S PHONE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,'Noto Sans Thai',sans-serif;background:#10182a;color:#fff}
button,input,select{font:inherit}
button{cursor:pointer}
#phone{position:relative;width:100%;max-width:440px;height:100dvh;min-height:550px;margin:auto;overflow:hidden;background:linear-gradient(155deg,#1c304e,#354d75 63%,#8798b5)}
#phone:has(.lock){background:#e9ebf9}
#phone:has(.lock) .status{color:#4b3652}
#phone:has(.lock) .nav span{background:#fff}.camera{position:absolute;z-index:30;top:12px;left:calc(50% - 6px);height:12px;width:12px;background:#081322;border:2px solid #23374e;border-radius:50%;pointer-events:none}
.status{height:36px;padding:9px 18px 0;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:20;font-size:13px;font-weight:600;color:#4b3652;background:transparent}


.status .right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:0;
  height:22px;
}

.status-icons{
  width:108px;
  height:22px;
  display:block;
  color:inherit;
  flex-shrink:0;
}

.ico{width:22px;height:22px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.small{width:17px;height:17px}

.screen{
  position:absolute;
  inset:0;
  overflow-y:auto;
  scrollbar-width:none;
}

.screen::-webkit-scrollbar{display:none}
.nav{position:absolute;bottom:0;left:0;width:100%;height:22px;z-index:40;display:flex;align-items:center;justify-content:center;background:transparent}.nav span{width:105px;height:4px;background:#f6f8fd;border-radius:5px}

.lock{
  position:relative;
  height:100%;
  width:100%;
  overflow:hidden;
  text-align:center;
  color:#4c304d;
  touch-action:pan-y;
}

.lock-wallpaper{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:0;
  pointer-events:none;
}


.lock .date{
  position:absolute;
  top:11%;
  left:0;
  width:100%;
  font-size:16px;
  font-weight:500;
  color:#563c58;
  z-index:2;
}

.lock .clock{
  position:absolute;
  top:15%;
  left:0;
  width:100%;
  margin:0;
  font-size:clamp(72px,20vw,102px);
  line-height:1;
  letter-spacing:-5px;
  font-weight:600;
  color:#482b49;
  z-index:2;
}

.lock .hint{
  position:absolute;
  bottom:13%;
  left:0;
  width:100%;
  font-size:12px;
  color:#fff;
  text-shadow:0 1px 5px #64739b;
  z-index:2;
}

.pill{
  border:1px solid #ffffff80;
  background:#ffffff18;
  color:white;
  padding:12px 25px;
  border-radius:28px;
}

.lock-notification{
  position:absolute;
  bottom:4%;
  left:8%;
  width:84%;
  min-height:65px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  border-radius:23px;
  background:rgba(48,58,98,.68);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  color:#fff;
  text-align:left;
  z-index:3;
  border:0;
}

.lock-notification .notification-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#06c755;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.lock-notification .notification-icon .ico{
  width:25px;
  height:25px;
}

.lock-notification strong{
  display:block;
  font-size:13px;
}

.lock-notification small{
  display:block;
  margin-top:4px;
  font-size:12px;
  opacity:.85;
}
.home{padding:28px 18px}
.home .greeting{font-size:28px;font-weight:300;margin:16px 0 8px}
.home .sub{font-size:13px;color:#e3eafa;margin-bottom:35px}
.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px 8px}
.appitem{border:0;background:transparent;color:white;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px}
.appicon{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;box-shadow:0 7px 18px #0002}
.appicon .ico{width:29px;height:29px}
.locked{background:#5a6780!important;color:#d2dbe8}
.app{background:#f6f7fb;color:#172033;min-height:100%;padding-bottom:22px}
.apphead{height:56px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 15px;border-bottom:1px solid #e9edf2;position:sticky;top:0;z-index:5}
.back{border:0;background:none;color:#24324a;padding:5px}
.apphead b{font-size:18px}
.content{padding:14px}
.chatlist{background:white}
.chatrow{display:flex;gap:12px;padding:15px 16px;border-bottom:1px solid #eef0f3;align-items:center;cursor:pointer}
.avatar{width:43px;height:43px;background:#d7e4f1;color:#425773;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.chatrow .body{min-width:0;flex:1}
.chatrow .name{font-weight:600;font-size:15px}
.chatrow .preview{font-size:12px;color:#7c8595;margin-top:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chatrow .time{font-size:11px;color:#99a2af}
.conversation{background:#d8e1ee;min-height:calc(100dvh - 116px);padding:16px 12px 85px}
.day{text-align:center;font-size:11px;color:#60738c;margin:12px}
.bubble{max-width:82%;padding:11px 13px;border-radius:15px;font-size:14px;line-height:1.65;margin:8px 0;white-space:pre-wrap}
.incoming{background:#fff;color:#253043;border-top-left-radius:4px;margin-right:auto}
.outgoing{background:#b6ec98;color:#213c2b;border-top-right-radius:4px;margin-left:auto}
.choices{position:sticky;bottom:0;background:#f8fafc;padding:10px;border-top:1px solid #e1e7ef}
.choice{width:100%;padding:10px 12px;background:white;border:1px solid #d5dfeb;border-radius:12px;margin:4px 0;text-align:left;font-size:13px;color:#27364a}
.choice:active{background:#dff5df}
.entry{background:#fff;padding:15px;border-radius:14px;margin:10px 0;border:1px solid #e7ebf1;color:#263347}
.entry small{color:#788597;display:block;margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:#7b879a;font-size:12px}
.action{border:0;border-radius:12px;background:#273d60;color:white;padding:12px 15px}
.action:disabled{opacity:.4}
.notice{padding:11px 14px;background:#eaf4ec;color:#246139;border-radius:12px;font-size:13px;margin:12px 0}
.footerbtn{width:100%;margin-top:15px}
.cardeditor{background:#f7f8fb;min-height:100%;padding:15px}
.invite{max-width:310px;min-height:420px;margin:14px auto;padding:24px 20px;text-align:center;border:1px solid #bca98c;box-shadow:0 8px 26px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:19px;color:#6e5948;background:#f7efe3}
.invite .tiny{letter-spacing:3px;font-size:11px}
.invite .names{font-family:Georgia,serif;font-size:34px;line-height:1.45}
.invite .line{width:50px;height:1px;background:currentColor}
.invite .phrase{font-size:13px}
.controls{display:grid;gap:10px;background:#fff;border-radius:14px;padding:15px}
.controls label{font-size:13px;font-weight:600}
.controls select,.controls input{padding:11px;border:1px solid #cbd4df;border-radius:10px;width:100%;color:#263347;background:white}
.overlay{position:absolute;inset:36px 0 22px;background:#101a2bbd;display:grid;place-items:center;z-index:25;padding:25px}
.dialog{background:white;color:#20314c;padding:25px;border-radius:20px;width:100%;max-width:320px;text-align:center}
.dialog p{font-size:14px;line-height:1.6}
.toolbar{padding:10px 14px;background:#fff;border-top:1px solid #e7eaf0}
.tinylabel{font-size:11px;color:#8b96a5}
.homecard{background:#ffffff19;border:1px solid #ffffff25;border-radius:16px;padding:16px;margin-top:35px;font-size:13px;color:#eaf1fa}
.spacer{height:12px}
</style>
</head>
<body>

  <div class="camera"></div>
  <div class="status">
    <span id="statusTime">karan</span>


<span class="right">
  <svg class="status-icons"
       viewBox="0 0 108 22"

       aria-label="ปิดเสียง 5G สัญญาณมือถือ แบตเตอรี่ 45 เปอร์เซ็นต์">

<script>
(function(){
'use strict';

const paths={
back:'<path d="m15 18-6-6 6-6"/>',
lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
line:'<path d="M20 11.5c0 4.4-3.8 8-8.5 8-1 0-2-.15-2.9-.45L4 20l1.3-3.7A7.7 7.7 0 0 1 3 11.5C3 7.1 6.8 3.5 11.5 3.5S20 7.1 20 11.5Z"/>',
phone:'<path d="M7 3H4a2 2 0 0 0-2 2c0 9.4 7.6 17 17 17a2 2 0 0 0 2-2v-3l-5-2-2 3a16 16 0 0 1-8-8l3-2-2-5Z"/>',
gallery:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/>',
calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h3"/>',
note:'<path d="M5 3h11l3 3v15H5zM8 10h8M8 14h8M8 18h5"/>',
bag:'<path d="M4 8h16l-1 13H5L4 8ZM9 9V6a3 3 0 0 1 6 0v3"/>',
web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
file:'<path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

mute:'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/>',

signal:'<rect x="3" y="15" width="3.5" height="6" rx="1.75" fill="currentColor" stroke="none"/><rect x="8" y="11" width="3.5" height="10" rx="1.75" fill="currentColor" stroke="none"/><rect x="13" y="7" width="3.5" height="14" rx="1.75" fill="currentColor" stroke="none"/><rect x="18" y="3" width="3.5" height="18" rx="1.75" fill="currentColor" stroke="none"/>',

battery:'<path d="M7 5H17A5 5 0 0 1 22 10V14A5 5 0 0 1 17 19H7A5 5 0 0 1 2 14V10A5 5 0 0 1 7 5Z" fill="currentColor" stroke="none"/><path d="M22 9.5h1v5h-1" fill="currentColor" stroke="none"/>',

batteryLevel:'<path d="M7 5H12V19H7A5 5 0 0 1 2 14V10A5 5 0 0 1 7 5Z" fill="currentColor" stroke="none"/>',
cake:'<path d="M3 12h18v9H3zM3 16h18M7 12V8M12 12V8M17 12V8M7 5v1M12 5v1M17 5v1"/>',
check:'<path d="m4 12 5 5L20 6"/>',
send:'<path d="m3 3 18 9-18 9 4-9-4-9ZM7 12h14"/>'
};

function icon(n,cls=''){
return '<svg class="ico '+cls+'" viewBox="0 0 24 24" aria-hidden="true">'+(paths[n]||paths.file)+'</svg>';
}

const appdefs=[
['LINE','line','#06c755'],
['โทรศัพท์','phone','#56a97f'],
['แกลเลอรี','gallery','#a88bc7'],
['ปฏิทิน','calendar','#6e9bdc'],
['โน้ต','note','#caa85d'],
['คำสั่งซื้อ','bag','#d68b64'],
['เบราว์เซอร์','web','#6d9fc4'],
['นาฬิกา','clock','#938dcf'],
['ไฟล์','file','#899cb7']
];

const key='karan_phone_v2';

let save={
unlock:['LINE'],
flags:{},
replies:{},
card:{color:'ivory',style:'classic',text:'Together, always.'}
};

try{
const old=JSON.parse(localStorage.getItem(key));
if(old){
save={
...save,...old,
flags:old.flags||{},
replies:old.replies||{},
card:{...save.card,...old.card}
};
}
}catch(e){}

let page='lock',chat='';
const screen=document.getElementById('screen');

function persist(){
try{localStorage.setItem(key,JSON.stringify(save))}catch(e){}
}

function unlock(name){
if(!save.unlock.includes(name)){
save.unlock.push(name);
persist();
}
}

function header(title){
return '<div class="apphead"><button class="back" data-go="home" aria-label="ย้อนกลับ">'+icon('back')+'</button><b>'+title+'</b></div>';
}

function appwrap(title,body){
return '<div class="app">'+header(title)+body+'</div>';
}

function render(){

let html='';

if(page==='lock'){
html=`
<div class="lock">

<img class="lock-wallpaper"
     src="https://i.ibb.co/5WfPWvbp/IMG-4436.jpg"
     alt="">

  <div class="date">วันพุธที่ 11 พฤศจิกายน</div>

  <div class="clock">21:36</div>

  <div class="hint">
    ปัดขึ้นเพื่อปลดล็อก
  </div>
</div>
`;
}

else if(page==='home'){
html='<div class="home"><div class="greeting">Karan’s Phone</div><div class="sub">เรื่องราวที่เก็บไว้ในโทรศัพท์เครื่องนี้</div><div class="appgrid">'+appdefs.map(a=>{
const open=save.unlock.includes(a[0]);
return '<button class="appitem" data-app="'+a[0]+'"><span class="appicon '+(open?'':'locked')+'" style="'+(open?'background:'+a[2]:'')+'">'+icon(open?a[1]:'lock')+'</span><span>'+a[0]+'</span></button>';
}).join('')+'</div><div class="homecard">LINE มีข้อความเก่าจากพี่ดุจ<br><span style="opacity:.75">30 มกราคม · วันเกิดอชิ</span></div><button class="pill" style="margin-top:15px;width:100%" data-app="การ์ดแต่งงาน">ทดลองออกแบบการ์ดแต่งงาน</button></div>';
}
else if(page==='LINE'){
html=appwrap('LINE','<div class="chatlist">'+[
['พี่ดุจ','เรื่องเค้กวันเกิดอชิ','duj'],
['อชิ','ขอบคุณนะครับคุณการันต์','achi'],
['ประสานงานออฟฟิศ','ปาย: ยินดีต้อนรับร็อคค่ะ','office'],
['ทีมฝ่ายขาย','เอกสารลูกค้าเรียบร้อยแล้วครับ','sales']
].map(c=>'<div class="chatrow" data-chat="'+c[2]+'"><div class="avatar">'+icon('user')+'</div><div class="body"><div class="name">'+c[0]+'</div><div class="preview">'+c[1]+'</div></div><div class="time">30 ม.ค.</div></div>').join('')+'</div>');
}
else if(page==='chat'){
html=renderChat();
}
else if(page==='ปฏิทิน'){
html=appwrap('ปฏิทิน','<div class="content"><div class="entry"><b>30 มกราคม</b><small>วันเกิดอชิ · ปฏิทินบริษัท</small><p>พี่ดุจช่วยดูเรื่องเค้ก</p><button class="action" data-task="calendar">ดูรายละเอียดรายการ</button></div><div class="entry"><b>ประชุมฝ่ายขาย</b><small>09:30 · ห้องประชุม 2</small></div><div class="entry"><b>ตรวจรายงานยอดขาย</b><small>16:00 · งานฝ่ายขาย</small></div></div>');
}
else if(page==='คำสั่งซื้อ'){
html=appwrap('คำสั่งซื้อ','<div class="content"><div class="entry"><b>'+icon('cake')+' เค้กวันเกิด</b><small>สั่งล่วงหน้า · รับ 30 มกราคม</small><p>ผู้รับสินค้า: พี่ดุจ</p><button class="action" data-task="order">ตรวจสอบรายละเอียด</button></div><div class="entry"><b>อาหารเย็น</b><small>30 มกราคม · จัดส่งที่สำนักงาน</small><p>อาหาร 2 ชุด</p><button class="action" data-task="dinner">เปิดรายการอาหาร</button></div></div>');
}
else if(page==='โทรศัพท์'){
html=appwrap('โทรศัพท์','<div class="content"><div class="entry"><b>ประวัติการโทร</b><small>30 มกราคม</small><p>09:12 · ลูกค้าบริษัท · โทรออก</p><p>13:45 · ฝ่ายขาย · สายเข้า</p><p>19:27 · พนักงานจัดส่ง · สายเข้า</p></div></div>');
}
else if(page==='โน้ต'){
html=appwrap('โน้ต','<div class="content"><div class="entry"><b>งานประจำสัปดาห์</b><p>ติดตามรายงานฝ่ายขาย</p><p>ตรวจเอกสารเสนอราคา</p><p>ยืนยันนัดหมายลูกค้า</p></div><div class="entry"><b>30 มกราคม</b><p>เค้ก — พี่ดุจ</p><p>ตรวจตารางประชุม</p><p>อาหารเย็น</p></div></div>');
}
else if(page==='การ์ดแต่งงาน'){
html=renderCard();
}
else{
html=appwrap(page,'<div class="content"><div class="entry">ข้อมูลส่วนนี้จะเปิดเผยในตอนถัดไป</div></div>');
}

screen.innerHTML=html;
screen.scrollTop=0;
}

function bubble(text,out){
return '<div class="bubble '+(out?'outgoing':'incoming')+'">'+text+'</div>';
}

function renderChat(){
const names={duj:'พี่ดุจ',achi:'อชิ',office:'ประสานงานออฟฟิศ',sales:'ทีมฝ่ายขาย'};
let b='<div class="day">28–30 มกราคม · EP.01</div>';
let choices='';

if(chat==='duj'){
b+=bubble('การันต์ เรื่องเค้กวันเกิดอชิ พี่จัดการให้แล้วนะ');
b+=bubble('ขอบคุณครับ ถ้ามีอะไรให้ผมช่วยเพิ่มเติม บอกได้เลยนะครับ',true);
b+=bubble('พรุ่งนี้พี่จะดูจังหวะเอาเค้กเข้าไปให้นะ');
b+=bubble('ว่าแต่การันต์อยากให้พี่บอกอชิไหมว่าใครเตรียมเค้ก?');

const opts=[
'ไม่ต้องบอกก็ได้ครับ ผมแค่อยากให้อชิมีความสุขในวันเกิด',
'บอกว่าเป็นเค้กจากทุกคนในออฟฟิศก็ได้ครับ',
'แล้วแต่พี่ดุจสะดวกเลยครับ ผมไม่ติดอะไร'
];

if(save.replies.duj){
b+=bubble(save.replies.duj,true);
b+=bubble('ได้เลยจ้ะ พี่จัดการให้ ไม่ต้องห่วง');
b+=bubble('อ้อ วันเกิดอชิอยู่ในปฏิทินบริษัทด้วยนะ');
}else{
choices=opts.map((o,i)=>'<button class="choice" data-reply="duj" data-index="'+i+'">'+o+'</button>').join('');
}
}

if(chat==='achi'){
b+=bubble('สุขสันต์วันเกิดนะครับอชิ ขอให้มีความสุขมาก ๆ นะครับ',true);
b+=bubble('ขอบคุณมากนะครับคุณการันต์');

if(save.replies.achi){
b+=bubble(save.replies.achi,true);
b+=bubble('ขอบคุณนะครับ',false);
}else{
choices=[
'ยินดีครับ',
'ขอให้วันนี้เป็นวันที่ดีนะครับ',
'พักผ่อนด้วยนะครับ'
].map((o,i)=>'<button class="choice" data-reply="achi" data-index="'+i+'">'+o+'</button>').join('');
}
}

if(chat==='office'){
b+=bubble('ปาย: วันนี้มีน้องใหม่เข้าทีมโปรโมชั่น ชื่อร็อคนะคะ');
b+=bubble('ร็อค: สวัสดีครับ ฝากเนื้อฝากตัวด้วยนะครับ');
b+=bubble('อชิ: ยินดีต้อนรับครับ ถ้าต้องประสานงานเอกสารติดต่อผมได้เลยครับ');
b+=bubble('การันต์: ยินดีต้อนรับครับ',true);
}

if(chat==='sales'){
b+=bubble('ฝ่ายขาย: ส่งรายละเอียดลูกค้าเรียบร้อยแล้วครับ');
b+=bubble('การันต์: ขอบคุณครับ รบกวนตรวจตัวเลขอีกครั้งก่อนส่งฉบับสุดท้าย',true);
}

return appwrap(names[chat],'<div class="conversation">'+b+'</div>'+(choices?'<div class="choices"><div class="tinylabel">เลือกข้อความตอบในฐานะการันต์</div>'+choices+'</div>':''));
}

function renderCard(){
const colors={
ivory:['#f7efe3','#6d5846'],
pink:['#f9e8ee','#87596a'],
blue:['#e7eff9','#526f91'],
green:['#eaf0e7','#566d5b']
};
const c=colors[save.card.color]||colors.ivory;

return appwrap('การ์ดแต่งงาน','<div class="cardeditor"><div class="muted">ต้นแบบกิจกรรม EP.12 · ออกแบบได้ตั้งแต่เวอร์ชันทดลอง</div><div class="invite" id="invite" style="background:'+c[0]+';color:'+c[1]+';border-style:'+(save.card.style==='modern'?'solid':'double')+'"><div class="tiny">THE WEDDING OF</div><div class="line"></div><div class="names">Karan<br>&amp;<br>Achi</div><div class="line"></div><div class="tiny">19 JUNE</div><div class="phrase" id="cardPhrase"></div></div><div class="controls"><label>สีการ์ด</label><select id="cardColor"><option value="ivory">ครีม</option><option value="pink">ชมพู</option><option value="blue">ฟ้า</option><option value="green">เขียว</option></select><label>รูปแบบ</label><select id="cardStyle"><option value="classic">คลาสสิก</option><option value="modern">โมเดิร์น</option></select><label>ข้อความบนการ์ด</label><input id="cardText" maxlength="80" placeholder="ข้อความบนการ์ด"><button class="action" data-task="savecard">บันทึกการ์ดเป็นภาพ</button></div></div>');
}

function popup(title,msg){
document.getElementById('modal').innerHTML='<div class="overlay"><div class="dialog"><h3>'+title+'</h3><p>'+msg+'</p><button class="action" data-task="close">ตกลง</button></div></div>';
}

function goApp(name){
if(name==='การ์ดแต่งงาน'){
page=name;
render();
syncCard();
return;
}
if(!save.unlock.includes(name)){
popup('ยังไม่สามารถเปิดได้','สำรวจข้อมูลในแอปที่เปิดอยู่เพื่อเข้าถึงส่วนนี้');
return;
}
page=name;
render();
}

function syncCard(){
const a=document.getElementById('cardColor');
const b=document.getElementById('cardStyle');
const c=document.getElementById('cardText');
const p=document.getElementById('cardPhrase');
if(a){
a.value=save.card.color;
b.value=save.card.style;
c.value=save.card.text;
p.textContent=save.card.text;
}
}

function saveCard(){
const c=document.createElement('canvas');
c.width=900;
c.height=1200;
const x=c.getContext('2d');
const colors={
ivory:['#f7efe3','#6d5846'],
pink:['#f9e8ee','#87596a'],
blue:['#e7eff9','#526f91'],
green:['#eaf0e7','#566d5b']
};
const t=colors[save.card.color]||colors.ivory;
x.fillStyle=t[0];
x.fillRect(0,0,900,1200);
x.strokeStyle=t[1];
x.lineWidth=3;
x.strokeRect(35,35,830,1130);
x.fillStyle=t[1];
x.textAlign='center';
x.font='26px Georgia';
x.fillText('THE WEDDING OF',450,285);
x.font='95px Georgia';
x.fillText('Karan',450,470);
x.font='60px Georgia';
x.fillText('&',450,570);
x.font='95px Georgia';
x.fillText('Achi',450,690);
x.font='32px Georgia';
x.fillText('19 JUNE',450,820);
x.font='26px Arial';
x.fillText(save.card.text.slice(0,48),450,920);

const link=document.createElement('a');
link.download='Karan-Achi-Wedding.png';
link.href=c.toDataURL('image/png');
link.click();
}

document.addEventListener('click',function(e){
const btn=e.target.closest('[data-go],[data-app],[data-chat],[data-reply],[data-task]');
if(!btn)return;

if(btn.dataset.go){
page=btn.dataset.go;
render();
}
else if(btn.dataset.app){
goApp(btn.dataset.app);
}
else if(btn.dataset.chat){
chat=btn.dataset.chat;
page='chat';
render();
}
else if(btn.dataset.reply){
const who=btn.dataset.reply;
const opts=who==='duj'
?[
'ไม่ต้องบอกก็ได้ครับ ผมแค่อยากให้อชิมีความสุขในวันเกิด',
'บอกว่าเป็นเค้กจากทุกคนในออฟฟิศก็ได้ครับ',
'แล้วแต่พี่ดุจสะดวกเลยครับ ผมไม่ติดอะไร'
]
:[
'ยินดีครับ',
'ขอให้วันนี้เป็นวันที่ดีนะครับ',
'พักผ่อนด้วยนะครับ'
];

save.replies[who]=opts[Number(btn.dataset.index)];

if(who==='duj')unlock('ปฏิทิน');
persist();
render();
}
else if(btn.dataset.task){
const task=btn.dataset.task;

if(task==='close'){
document.getElementById('modal').innerHTML='';
}
if(task==='calendar'){
save.flags.calendar=true;
unlock('คำสั่งซื้อ');
popup('รายละเอียดวันเกิด','พี่ดุจช่วยดูเรื่องเค้กแล้ว คุณสามารถตรวจสอบรายการที่เกี่ยวข้องได้');
}
if(task==='order'){
save.flags.order=true;
unlock('โทรศัพท์');
popup('รายการเค้ก','คำสั่งซื้อได้รับการยืนยันแล้ว');
}
if(task==='dinner'){
unlock('โน้ต');
popup('รายการอาหาร','จัดส่งเรียบร้อยแล้ว มีข้อมูลเพิ่มเติมในโน้ต');
}
if(task==='savecard'){
saveCard();
}
}
});

document.addEventListener('change',function(e){
if(e.target.id==='cardColor')save.card.color=e.target.value;
if(e.target.id==='cardStyle')save.card.style=e.target.value;
persist();
if(page==='การ์ดแต่งงาน'){
render();
syncCard();
}
});

document.addEventListener('input',function(e){
if(e.target.id==='cardText'){
save.card.text=e.target.value;
persist();
document.getElementById('cardPhrase').textContent=e.target.value;
}
});

document.getElementById('nav').addEventListener('click',function(){
page='home';
render();
});

let touchY=0;
screen.addEventListener('touchstart',e=>{
touchY=e.touches[0].clientY;
},{passive:true});

screen.addEventListener('touchend',e=>{
if(page==='lock'&&touchY-e.changedTouches[0].clientY>45){
page='home';
render();
}
},{passive:true});

let hold;
document.addEventListener('pointerdown',e=>{
if(e.target.closest('.greeting')){
hold=setTimeout(()=>goApp('การ์ดแต่งงาน'),900);
}
});
document.addEventListener('pointerup',()=>clearTimeout(hold));
document.addEventListener('pointercancel',()=>clearTimeout(hold));

render();
})();
</script>
</body>
</html>
