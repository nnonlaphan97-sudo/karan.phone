<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>KARAN'S PHONE</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  touch-action:pan-y;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,'Noto Sans Thai',sans-serif;
  background:#101018;
  color:#fff;
}

button,input,select,textarea{
  font:inherit;
  touch-action:manipulation;
}

input,select,textarea{
  font-size:16px;
}

button{
  cursor:pointer;
}

#phone{
  position:relative;
  width:100%;
  max-width:440px;
  height:100dvh;
  min-height:0;
  margin:0 auto;
  overflow:hidden;
  background:#10182a;

  border:4px solid #343640;
  border-radius:20px;

  box-shadow:
    0 0 0 2px #171920,
    0 5px 18px rgba(0,0,0,.25);
}

#phone::before{
  content:"";
  position:absolute;
  inset:-12px;
  background:url("https://i.ibb.co/5WfPWvbp/IMG-4436.jpg") center/cover no-repeat;
  filter:blur(6px);
  pointer-events:none;
}
#phone:has(.lock){background:#e9ebf9}
#phone:has(.lock) .status{color:#4b3652}
#phone:has(.lock) .nav span{background:rgba(255,255,255,.2)}
.status{height:36px;padding:9px 10px 0 22px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:20;font-size:13px;font-weight:600;color:#4b3652;background:transparent}

.camera{
  position:absolute;
  z-index:30;
  top:12px;
  left:calc(50% - 6px);
  width:12px;
  height:12px;
  background:#081322;
  border:2px solid #23374e;
  border-radius:50%;
  pointer-events:none;
}

.status .right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:0;
  height:22px;
}

.status-icons{
  width:108px;
  height:22px;
  display:block;
  color:inherit;
  flex-shrink:0;
}

.ico{width:22px;height:22px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.small{width:17px;height:17px}

.screen{
  position:absolute;
  inset:0;
  overflow-y:auto;
  scrollbar-width:none;
}

.screen::-webkit-scrollbar{display:none}
.nav{position:absolute;bottom:0;left:0;width:100%;height:22px;z-index:40;display:flex;align-items:center;justify-content:center;background:transparent}
.nav span{width:105px;height:4px;background:rgba(246,248,253,.35);border-radius:5px}
.lock{
  position:relative;
  height:100%;
  width:100%;
  overflow:hidden;
  text-align:center;
  color:#4c304d;
  touch-action:pan-y;
}

.lock-wallpaper{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:0;
  pointer-events:none;
}


.lock .date{
  position:absolute;
  top:11%;
  left:0;
  width:100%;
  font-size:16px;
  font-weight:500;
  color:#563c58;
  z-index:2;
}

.lock .clock{
  position:absolute;
  top:15%;
  left:0;
  width:100%;
  margin:0;
  font-size:clamp(72px,20vw,102px);
  line-height:1;
  letter-spacing:-5px;
  font-weight:600;
  color:#482b49;
  z-index:2;
}

.lock .hint{
  position:absolute;
  bottom:13%;
  left:0;
  width:100%;
  font-size:12px;
  color:#fff;
  text-shadow:0 1px 5px #64739b;
  z-index:2;
}


.pill{
  border:1px solid #ffffff80;
  background:#ffffff18;
  color:white;
  padding:12px 25px;
  border-radius:28px;
}

/* หน้าใส่รหัส PIN */
.pin-screen{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#fff;
  background:transparent;
  padding-top:clamp(65px,12vh,115px);
}

#phone:has(.lock)::before{
  display:none;
}

.pin-title{
  font-size:18px;
  font-weight:500;
  margin-bottom:23px;
}

.pin-dots{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:35px;
}

.pin-dot{
  width:12px;
  height:12px;
  border:1.5px solid #fff;
  border-radius:50%;
  background:transparent;
}

.pin-dot.filled{
  background:#fff;
}

.pin-keypad{
  display:grid;
  grid-template-columns:repeat(3,72px);
  justify-content:center;
  gap:13px 20px;
}

.pin-key{
  width:72px;
  height:72px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  color:#fff;
  font-size:29px;
  font-weight:400;
  display:flex;
  align-items:center;
  justify-content:center;
}

.pin-key:active{
  background:rgba(255,255,255,.35);
}

.pin-action{
  border:0;
  background:transparent;
  color:#fff;
  font-size:14px;
  padding:12px 0;
}

.pin-bottom{
  width:256px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:17px;
}


.lock-notification{
  position:absolute;
  bottom:4%;
  left:8%;
  width:84%;
  min-height:65px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  border-radius:23px;
  background:rgba(48,58,98,.68);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  color:#fff;
  text-align:left;
  z-index:3;
  border:0;
}

.lock-notification .notification-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#06c755;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.lock-notification .notification-icon .ico{
  width:25px;
  height:25px;
}

.lock-notification strong{
  display:block;
  font-size:13px;
}

.lock-notification small{
  display:block;
  margin-top:4px;
  font-size:12px;
  opacity:.85;
}

.home{
  min-height:100%;
  padding:62px 22px 35px;
  color:#fff;
}


.home-weather{
  display:flex;
  align-items:center;
  gap:18px;
  width:100%;
  color:#fff;
  background:transparent;
  border:0;
  box-shadow:none;
  padding:0;
  text-align:left;
}

.home-weather-icon{
  width:100px;
  height:100px;
  flex-shrink:0;
}

.home-weather-icon svg{
  width:100%;
  height:100%;
}

.home-weather-info{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  min-width:0;
  gap:4px;
}

.home-weather-temp{
  font-size:54px;
  font-weight:400;
  line-height:1;
  letter-spacing:-2px;
}

.home-weather-desc{
  font-size:14px;
  margin:0;
}

.home-weather-location{
  font-size:12px;
  opacity:.85;
  margin:0;
}

.home .appgrid{
  margin-top:40px;
}

.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px 8px}
.appitem{border:0;background:transparent;color:white;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px}
.appicon{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;box-shadow:0 7px 18px #0002}
.appicon .ico{width:29px;height:29px}
.locked{background:#5a6780!important;color:#d2dbe8}
.app{background:#f6f7fb;color:#172033;min-height:100%;padding-bottom:22px}
.apphead{height:56px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 15px;border-bottom:1px solid #e9edf2;position:sticky;top:0;z-index:5}
.back{border:0;background:none;color:#24324a;padding:5px}
.apphead b{font-size:18px}
.content{padding:14px}
.chatlist{background:white}
.chatrow{display:flex;gap:12px;padding:15px 16px;border-bottom:1px solid #eef0f3;align-items:center;cursor:pointer}
.avatar{width:43px;height:43px;background:#d7e4f1;color:#425773;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.chatrow .body{min-width:0;flex:1}
.chatrow .name{font-weight:600;font-size:15px}
.chatrow .preview{font-size:12px;color:#7c8595;margin-top:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chatrow .time{font-size:11px;color:#99a2af}
.conversation{background:#d8e1ee;min-height:calc(100dvh - 116px);padding:16px 12px 85px}
.day{text-align:center;font-size:11px;color:#60738c;margin:12px}
.bubble{max-width:82%;padding:11px 13px;border-radius:15px;font-size:14px;line-height:1.65;margin:8px 0;white-space:pre-wrap}
.incoming{background:#fff;color:#253043;border-top-left-radius:4px;margin-right:auto}
.outgoing{background:#b6ec98;color:#213c2b;border-top-right-radius:4px;margin-left:auto}
.choices{position:sticky;bottom:0;background:#f8fafc;padding:10px;border-top:1px solid #e1e7ef}
.choice{width:100%;padding:10px 12px;background:white;border:1px solid #d5dfeb;border-radius:12px;margin:4px 0;text-align:left;font-size:13px;color:#27364a}
.choice:active{background:#dff5df}
.entry{background:#fff;padding:15px;border-radius:14px;margin:10px 0;border:1px solid #e7ebf1;color:#263347}
.entry small{color:#788597;display:block;margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:#7b879a;font-size:12px}
.action{border:0;border-radius:12px;background:#273d60;color:white;padding:12px 15px}
.action:disabled{opacity:.4}
.notice{padding:11px 14px;background:#eaf4ec;color:#246139;border-radius:12px;font-size:13px;margin:12px 0}
.footerbtn{width:100%;margin-top:15px}
.cardeditor{background:#f7f8fb;min-height:100%;padding:15px}
.invite{max-width:310px;min-height:420px;margin:14px auto;padding:24px 20px;text-align:center;border:1px solid #bca98c;box-shadow:0 8px 26px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:19px;color:#6e5948;background:#f7efe3}
.invite .tiny{letter-spacing:3px;font-size:11px}
.invite .names{font-family:Georgia,serif;font-size:34px;line-height:1.45}
.invite .line{width:50px;height:1px;background:currentColor}
.invite .phrase{font-size:13px}
.controls{display:grid;gap:10px;background:#fff;border-radius:14px;padding:15px}
.controls label{font-size:13px;font-weight:600}
.controls select,.controls input{padding:11px;border:1px solid #cbd4df;border-radius:10px;width:100%;color:#263347;background:white}
.overlay{
  position:absolute;
  inset:36px 0 22px;
  background:#101a2bbd;
  display:grid;
  place-items:center;
  z-index:45;
  padding:25px;
}

.game-banner{
  position:absolute;
  top:43px;
  left:12px;
  right:12px;
  z-index:60;
  border:1px solid rgba(255,255,255,.7);
  border-radius:18px;
  background:rgba(249,250,252,.97);
  color:#191919;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  width:calc(100% - 24px);
}

.game-banner-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#06c755;
  color:#fff;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.game-banner-text{
  flex:1;
  min-width:0;
}

.game-banner-text small{
  display:block;
  color:#73777e;
  font-size:11px;
  margin-bottom:3px;
}

.game-banner-text strong{
  display:block;
  font-size:14px;
}

.game-banner-text span{
  display:block;
  margin-top:4px;
  font-size:13px;
}

.dialog{background:white;color:#20314c;padding:25px;border-radius:20px;width:100%;max-width:320px;text-align:center}
.dialog p{font-size:14px;line-height:1.6}
.toolbar{padding:10px 14px;background:#fff;border-top:1px solid #e7eaf0}
.tinylabel{font-size:11px;color:#8b96a5}
.homecard{background:#ffffff19;border:1px solid #ffffff25;border-radius:16px;padding:16px;margin-top:35px;font-size:13px;color:#eaf1fa}
.spacer{height:12px}


/* ===== LINE 2026 ===== */
.line-app{
  position:relative;
  height:100%;
  min-height:0;
  background:#fff;
  color:#191919;
  padding-top:36px;
  overflow:hidden;
}

.line-scroll{
  height:100%;
  overflow-y:auto;
  padding-bottom:105px;
  scrollbar-width:none;
}

.line-scroll::-webkit-scrollbar{
  display:none;
}

.line-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
  min-height:58px;
}
.line-title{font-size:23px;font-weight:700}
.line-actions{
  display:flex;
  align-items:center;
  gap:2px;
  padding:4px;
  background:#f1f1f1;
  border-radius:30px;
}
.line-iconbtn{
  border:0;background:none;color:#191919;
  padding:3px;display:grid;place-items:center;
}
.line-iconbtn .ico{width:23px;height:23px}
.line-searchbox{
  display:flex;align-items:center;gap:10px;
  margin:6px 16px 14px;padding:11px 13px;
  background:#f3f4f5;border-radius:12px;
}
.line-searchbox input{
  width:100%;border:0;outline:0;
  background:transparent;color:#222;font-size:14px;
}
.line-profile{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:17px 19px;
  background:#fff;
  border:0;
  color:#191919;
  text-align:left;
  cursor:pointer;
}

.line-profile > .ico:last-child{
  transform:rotate(180deg);
  color:#999;
  width:19px;
  height:19px;
}

.line-avatar{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  background:#e5eaf1;color:#58677b;
  flex-shrink:0;
}
.line-avatar .ico{width:26px;height:26px}
.line-avatar.large{width:76px;height:76px}
.line-avatar.large .ico{width:35px;height:35px}
.line-name{font-size:15px;font-weight:600}
.line-sub{font-size:12px;color:#96999f;margin-top:5px}
.line-section{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 19px 9px;font-size:14px;font-weight:700;
}
.line-row{
  display:flex;align-items:center;gap:13px;
  width:100%;padding:12px 18px;
  background:#fff;border:0;color:#191919;
  text-align:left;cursor:pointer;
}
.line-row:active{background:#f4f5f6}
.line-row-body{flex:1;min-width:0}
.line-preview{
  font-size:12px;color:#989ca2;margin-top:6px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.line-time{font-size:11px;color:#a4a7ad;align-self:flex-start}
.line-divider{
  height:8px;
  background:#f5f6f7;
}


.line-home-profile{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:23px 19px 20px;
  background:#fff;
  border:0;
  color:#191919;
  text-align:left;
}

.line-home-profile-name{
  font-size:26px;
  font-weight:700;
}

.line-home-profile-status{
  margin-top:7px;
  color:#999;
  font-size:13px;
}

.line-home-profile-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.line-home-profile-right .line-avatar{
  width:66px;
  height:66px;
}

.line-home-story{
  width:46px;
  height:46px;
  border:2px dashed #ddd;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#999;
}

.line-home-directory{
  padding:12px 19px 18px;
}

.line-home-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0 12px;
  font-size:15px;
}

.line-home-heading button{
  border:0;
  background:none;
  color:#999;
  font-size:12px;
}

.line-directory-row{
  display:flex;
  align-items:center;
  width:100%;
  gap:13px;
  padding:10px 0;
  border:0;
  background:#fff;
  color:#191919;
  text-align:left;
}

.line-directory-mosaic{
  width:58px;
  height:58px;
  flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:2px;
  overflow:hidden;
  border-radius:50%;
  background:#e8ebee;
}

.line-directory-mosaic > span{
  display:grid;
  place-items:center;
}

.line-directory-mosaic .ico{
  width:16px;
  height:16px;
  color:#5c697c;
}

.line-directory-info{
  flex:1;
  min-width:0;
}

.line-directory-info strong{
  display:block;
  font-size:15px;
  font-weight:600;
}

.line-directory-info small{
  display:block;
  margin-top:5px;
  font-size:12px;
  color:#999;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.line-directory-count{
  font-size:13px;
  color:#999;
}

.line-directory-arrow{
  font-size:24px;
  color:#aaa;
}

.line-home-services{
  padding:12px 19px 22px;
}

.line-home-service-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px 8px;
  padding-top:12px;
}

.line-home-service{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  padding:5px 0;
  border:0;
  background:transparent;
  color:#333;
  font-size:11px;
  text-align:center;
}

.line-home-service .ico{
  width:27px;
  height:27px;
}

.line-home-themes{
  padding:12px 19px 28px;
}

.line-home-theme-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-top:10px;
}

.line-home-theme{
  flex:0 0 125px;
  height:150px;
  border-radius:12px;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:12px;
  color:#776d87;
  background:#eee8f4;
}

.line-home-theme:nth-child(2){
  background:#f7e7ed;
  color:#ad788d;
}

.line-home-theme:nth-child(3){
  background:#e4eef7;
  color:#668ca7;
}

.line-section .line-iconbtn{
  transform:rotate(180deg);
}

.line-chat-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 16px 8px;
}

.line-chat-switch{
  display:flex;
  align-items:center;
  gap:3px;
  padding:4px;
  background:#f1f1f1;
  border-radius:30px;
  flex-shrink:0;
}

.line-chat-switch button{
  border:0;
  background:transparent;
  color:#191919;
  border-radius:25px;
  padding:10px 13px;
  font-size:14px;
  font-weight:600;
}

.line-chat-switch button.active{
  background:#191919;
  color:white;
}

.line-chat-tools{
  display:flex;
  align-items:center;
  gap:3px;
  padding:4px;
  border-radius:30px;
  background:#f1f1f1;
}

.line-chat-tools .line-iconbtn{
  width:34px;
  height:35px;
  padding:5px;
}

.line-chat-tools .ico{
  width:20px;
  height:20px;
}

.line-searchbox{
  border-radius:25px;
  margin:8px 16px 12px;
  padding:11px 14px;
}

.line-bottom{
  position:absolute;
  bottom:27px;
  left:25px;
  right:25px;
  height:54px;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:#f3f3f3;
  border:1px solid #e7e7e7;
  border-radius:30px;
  z-index:30;
}

.line-bottom button{
  flex:1;
  min-width:0;
  height:46px;
  padding:4px 0;
  border:none;
  border-radius:25px;
  background:transparent;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-size:10px;
  font-weight:500;
  cursor:pointer;
}

.line-bottom button.active{
  background:#171717;
  color:#fff;
  font-weight:600;
}

.line-bottom button svg{
  width:19px;
  height:19px;
  flex-shrink:0;
}
.line-bottom .ico{width:23px;height:23px}
.line-card{
  margin:10px 16px;padding:17px;

const WEATHER_URL =
  'https://api.open-meteo.com/v1/forecast' +
  '?latitude=13.71&longitude=100.41' +
  '&current=temperature_2m,weather_code,is_day' +
  '&timezone=Asia%2FBangkok';

let weatherData = null;
let weatherUpdatedAt = 0;
let weatherLoading = false;

function weatherDescription(code){
  if(code===0)return 'ท้องฟ้าแจ่มใส';
  if(code===1)return 'ท้องฟ้าโปร่งเป็นส่วนมาก';
  if(code===2)return 'มีเมฆบางส่วน';
  if(code===3)return 'เมฆมาก';
  if(code===45||code===48)return 'มีหมอก';
  if(code>=51&&code<=57)return 'มีฝนละออง';
  if(code>=61&&code<=67)return 'มีฝนตก';
  if(code>=80&&code<=82)return 'มีฝนเป็นช่วง ๆ';
  if(code>=95)return 'มีพายุฝนฟ้าคะนอง';
  return 'สภาพอากาศแปรปรวน';
}

function weatherSVG(code,isDay){
  const rainy=(code>=51&&code<=82)||code>=95;
  const cloudy=code===3||code===45||code===48;

  const sky=isDay
    ? `<circle cx="25" cy="23" r="11" fill="#FFD76A"/>`
    : `<path d="M34 8A17 17 0 1 0 47 34A19 19 0 0 1 34 8Z" fill="#F4E5B5"/>`;

  const cloud=`<path d="M17 47H47C54 47 58 43 58 37C58 31 53 27 47 27C44 19 38 16 31 18C24 19 20 24 19 29C12 29 7 34 7 40C7 44 11 47 17 47Z" fill="#F4F6FF" stroke="#DCE5F4" stroke-width="1.5"/>`;

  const rain=`<g stroke="#91C8FF" stroke-width="3" stroke-linecap="round">
    <path d="M20 51l-3 7M34 51l-3 7M48 51l-3 7"/>
  </g>`;

  return `<svg viewBox="0 0 64 64" width="65" height="65" xmlns="http://www.w3.org/2000/svg">
    ${cloudy?'':sky}
    ${code===0?'':cloud}
    ${rainy?rain:''}
  </svg>`;
}

function showWeather(){
  const temp=document.getElementById('weatherTemp');
  const desc=document.getElementById('weatherDesc');
  const iconBox=document.getElementById('weatherIcon');

  if(!temp||!desc||!iconBox)return;

  if(!weatherData){
    temp.textContent='--°';
    desc.textContent=weatherLoading
      ? 'กำลังโหลดสภาพอากาศ...'
      : 'ไม่สามารถโหลดสภาพอากาศได้';
    return;
  }

  temp.textContent=Math.round(weatherData.temperature_2m)+'°';
  desc.textContent=weatherDescription(weatherData.weather_code);
  iconBox.innerHTML=weatherSVG(
    weatherData.weather_code,
    weatherData.is_day===1
  );
}

async function updateWeather(){
  if(weatherLoading)return;

  if(weatherData && Date.now()-weatherUpdatedAt<600000){
    showWeather();
    return;
  }

  weatherLoading=true;
  showWeather();

  try{
    const response=await fetch(WEATHER_URL,{cache:'no-store'});
    if(!response.ok)throw new Error('Weather API error');

    const data=await response.json();
    if(!data.current ||
       !Number.isFinite(data.current.temperature_2m)){
      throw new Error('Invalid weather data');
    }

    weatherData=data.current;
    weatherUpdatedAt=Date.now();
  }catch(error){
    console.error('Weather:',error);
    if(!weatherData)weatherData=null;
  }finally{
    weatherLoading=false;
    showWeather();
  }
}

let lastBubbleSender = null;

function bubble(text,out){
  const sender = out ? 'me' : chat;
  const showAvatar = !out && lastBubbleSender !== sender;

  lastBubbleSender = sender;

  const avatar = out
    ? ''
    : '<div class="line-message-avatar">'+
        (showAvatar ? lineAvatar(chat) : '')+
      '</div>';

  const meta = out
    ? '<div class="line-message-meta">อ่านแล้ว<br>18:00</div>'
    : '<div class="line-message-meta">18:00</div>';

  const message =
    '<div class="bubble '+(out?'outgoing':'incoming')+'">'+
      text+
    '</div>';

  return '<div class="line-message '+(out?'sent':'received')+'">'+
    (out
      ? meta+message
      : avatar+message+meta)+
  '</div>';
}

function ep2Start(){
  if(save.flags.ep2Started)return;

  save.flags.ep2Started = true;
  persist();
}

function ep2OpenPai(){
  save.flags.ep2PaiOpened = true;
  save.flags.ep2NotesUnlocked = true;

  unlock('โน้ต');
  persist();
}

function ep2CheckLogo(m,y){
  const correct =
    Number(m) === EP2_LOGO_ANSWER.m &&
    Number(y) === EP2_LOGO_ANSWER.y;

  if(correct){
    save.flags.ep2LogoDone = true;
    save.flags.ep2CouponReady = true;
    persist();
  }

  return correct;
}

function ep2ChooseRoute(route){
  if(!ep2InviteRoutes[route])return;

  const data = ep2InviteRoutes[route];

  save.flags.ep2InviteRoute = route;
  save.flags.ep2InviteStep = 0;
  save.flags.ep2InviteHistory = [
    {out:true,text:data.first},
    {out:false,text:data.replies[0]}
  ];

  if(route === 'work'){
    ep2Finish();
  }

  persist();
}

function ep2ContinueInvite(choiceIndex){
  const route = save.flags.ep2InviteRoute;
  const data = ep2InviteRoutes[route];

  if(!data || route === 'work')return;

  const step = save.flags.ep2InviteStep;
  const options = data.choices[step];

  if(!options || !options[choiceIndex])return;

  save.flags.ep2InviteHistory.push({
    out:true,
    text:options[choiceIndex]
  });

  const nextStep = step + 1;

  save.flags.ep2InviteStep = nextStep;

  save.flags.ep2InviteHistory.push({
    out:false,
    text:data.replies[nextStep]
  });

  if(nextStep === data.replies.length - 1){
    ep2Finish();
  }

  persist();
}

function ep2Finish(){
  save.flags.ep2Completed = true;
  persist();
}

function ep2InviteChoices(){
  const route = save.flags.ep2InviteRoute;

  if(save.flags.ep2Completed){
    return '<div class="notice">ภารกิจ EP.02 สำเร็จ — อชิตกลงไปกินข้าวด้วยแล้ว</div>';
  }

  if(!route){
    return [
      ['work',ep2InviteRoutes.work.first],
      ['coupon',ep2InviteRoutes.coupon.first],
      ['alone',ep2InviteRoutes.alone.first]
    ].map(item=>
      '<button class="choice" data-ep2-route="'+item[0]+'">'+
      item[1]+'</button>'
    ).join('');
  }

  const data = ep2InviteRoutes[route];
  const options = data.choices?.[save.flags.ep2InviteStep] || [];

  return options.map((text,index)=>
    '<button class="choice" data-ep2-choice="'+index+'">'+
    text+'</button>'
  ).join('');
}

function ep2InviteMessages(){
  return save.flags.ep2InviteHistory.map(msg=>
    bubble(msg.text,msg.out)
  ).join('');
}

  if(chat==='sales'){
    b+=bubble('ฝ่ายขาย: ส่งรายละเอียดลูกค้าเรียบร้อยแล้วครับ');
    b+=bubble('การันต์: ขอบคุณครับ รบกวนตรวจตัวเลขอีกครั้งก่อนส่งฉบับสุดท้าย',true);
  }

  const chatIcon=(type)=>{
    const shapes={
      clock:'<circle cx="11" cy="11" r="8"/><path d="M11 6v5l4 3M17 17l5 5"/>',
      menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
      plus:'<path d="M12 3v18M3 12h18"/>',
      camera:'<path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>',
      image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><path d="m4 18 6-6 4 4 3-3 4 4"/>',
      mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/>',
      smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14q4 5 8 0"/><path d="M8 9h.01M16 9h.01"/>'
    };

    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
      shapes[type]+
    '</svg>';
  };

  return '<div class="line-chatpage">'+

    '<div class="line-chathead">'+
      '<button data-go="LINE" aria-label="ย้อนกลับ">'+
        lineIcon('back')+
      '</button>'+
      '<b>'+names[chat]+'</b>'+
      '<button data-chat-tool="search" aria-label="ค้นหา">'+
        chatIcon('clock')+
      '</button>'+
      '<button data-line-call="1" aria-label="โทร">'+
        lineIcon('call')+
      '</button>'+
      '<button data-chat-tool="calendar" aria-label="ปฏิทิน">'+
        lineIcon('calendar')+
      '</button>'+
      '<button data-chat-tool="menu" aria-label="เมนู">'+
        chatIcon('menu')+
      '</button>'+
    '</div>'+

    '<div class="line-chatbody" id="lineChatBody">'+
      b+
    '</div>'+

    (choices
      ? '<div class="line-replies">'+
          '<div class="tinylabel">เลือกข้อความตอบในฐานะการันต์</div>'+
          choices+
        '</div>'
      : '')+

    '<div class="line-compose">'+
      '<button data-chat-tool="plus" aria-label="เพิ่มเติม">'+chatIcon('plus')+'</button>'+
      '<button data-chat-tool="camera" aria-label="กล้อง">'+chatIcon('camera')+'</button>'+
      '<button data-chat-tool="image" aria-label="รูปภาพ">'+chatIcon('image')+'</button>'+
      '<input placeholder="Aa" aria-label="พิมพ์ข้อความ" readonly>'+
      '<button data-chat-tool="smile" aria-label="สติกเกอร์">'+chatIcon('smile')+'</button>'+
      '<button data-chat-tool="mic" aria-label="ไมโครโฟน">'+chatIcon('mic')+'</button>'+
    '</div>'+

  '</div>';
}

function popup(title,msg){
  document.getElementById('modal').innerHTML=
    '<div class="overlay"><div class="dialog"><h3>'+
    title+'</h3><p>'+msg+
    '</p><button class="action" data-task="close">ตกลง</button></div></div>';
}

function showGameBanner(who,message){
  const banner=document.getElementById('gameBanner');

  banner.innerHTML=
    '<button class="game-banner" data-banner-chat="'+who+'">'+
      '<span class="game-banner-icon">'+icon('line')+'</span>'+
      '<span class="game-banner-text">'+
        '<small>LINE · ตอนนี้</small>'+
        '<strong>'+(who==='duj'?'พี่ดุจ':'อชิ')+'</strong>'+
        '<span>'+message+'</span>'+
      '</span>'+
    '</button>';
}

function goApp(name){

if(!save.unlock.includes(name)){
popup('ยังไม่สามารถเปิดได้','สำรวจข้อมูลในแอปที่เปิดอยู่เพื่อเข้าถึงส่วนนี้');
return;
}
page=name;

if(name==='GrabFood'){
  grabScreen=save.flags.cakeOrdered?'tracking':'home';
}

render();
}

document.addEventListener('click',function(e){

const bannerChat=e.target.closest('[data-banner-chat]');

if(bannerChat){
  chat=bannerChat.dataset.bannerChat;
  page='chat';

  document.getElementById('gameBanner').innerHTML='';

  render();
  return;
}

/* ===== EP.02 INTERACTIONS ===== */

const ep2Route=e.target.closest('[data-ep2-route]');
const ep2Choice=e.target.closest('[data-ep2-choice]');
const ep2Logo=e.target.closest('[data-ep2-submit-logo]');

if(ep2Route && page==='chat' && chat==='achi'){
  ep2ChooseRoute(ep2Route.dataset.ep2Route);
  render();
  return;
}

if(ep2Choice && page==='chat' && chat==='achi'){
  ep2ContinueInvite(Number(ep2Choice.dataset.ep2Choice));
  render();
  return;
}

if(ep2Logo && page==='chat' && chat==='pai'){

  const m=document.getElementById('ep2M')?.value;
  const y=document.getElementById('ep2Y')?.value;

  if(m==='' || y===''){
    popup('กรอกข้อมูลไม่ครบ','กรุณากรอกค่า M และ Y');
    return;
  }

  if(!ep2CheckLogo(m,y)){
    popup(
      'ค่าสีไม่ถูกต้อง',
      'ลองกลับไปตรวจสอบบันทึก GEMMHOUSE ในแอปโน้ตอีกครั้ง'
    );
    return;
  }

  render();

  popup(
    'ส่งข้อมูลสำเร็จ',
    'ปายได้รับข้อมูลสีโลโก้แล้ว และมีข้อความใหม่จากอชิ'
  );

  return;
}

const birthday=e.target.closest('[data-line-birthday]');
if(birthday && page==='LINE'){
  save.flags.birthdaySeen=true;
  unlock('GrabFood');
  persist();

  popup(
    'วันเกิดอชิ',
    '30 มกราคม วันนี้เป็นวันเกิดของอชิ'
  );
  return;
}
const cakeBtn=e.target.closest('[data-grab-cake]');
const grabBtn=e.target.closest('[data-grab]');

if(cakeBtn && page==='GrabFood'){
  selectedCake=cakeBtn.dataset.grabCake;
  grabScreen='detail';
  render();
  return;
}

if(grabBtn && page==='GrabFood'){
  const action=grabBtn.dataset.grab;

  if(action==='home'){
    grabScreen=save.flags.cakeOrdered?'tracking':'home';
    render();
    return;
  }

  if(action==='order'){
    save.flags.cakeOrdered=true;
    save.flags.orderedCake=selectedCake;
    save.flags.deliveryStatus='shipping';
    grabScreen='tracking';
    persist();
    render();
    return;
  }

  if(action==='incoming'){
    document.getElementById('modal').innerHTML=`
      <div class="overlay">
        <div class="dialog">
          <h3>พนักงานจัดส่ง GrabFood</h3>
          <p>สายเรียกเข้า</p>
          <button class="action" data-delivery-call="answer">
            รับสาย
          </button>
          <button class="action" data-delivery-call="miss">
            ไม่รับสาย
          </button>
        </div>
      </div>`;
    return;
  }

if(action==='contact'){
  save.flags.deliveryStatus='delivered';
  persist();
  render();

  showGameBanner(
    'duj',
    'เห็นน้องปายบอกการันต์ตามหาพี่'
  );

  return;
}
}

const deliveryCall=e.target.closest('[data-delivery-call]');

if(deliveryCall){
  const answered=deliveryCall.dataset.deliveryCall==='answer';

  save.flags.deliveryStatus=answered?'delivered':'delayed';
  persist();

  document.getElementById('modal').innerHTML='';

  render();

  if(answered){
    showGameBanner(
      'duj',
      'เห็นน้องปายบอกการันต์ตามหาพี่'
    );
  }else{
    popup(
      'จัดส่งล่าช้า',
      'พนักงานติดต่อไม่ได้และรถติด กรุณาติดต่อผ่าน GrabFood อีกครั้ง'
    );
  }

  return;
}

/* LINE 2026 interactions */
const ld=e.target.closest('[data-line-directory]');
const lt=e.target.closest('[data-line-tab]');
const ls=e.target.closest('[data-line-sub]');
const lp=e.target.closest('[data-line-profile]');
const lg=e.target.closest('[data-line-group]');
const lc=e.target.closest('[data-line-chat]');
const la=e.target.closest('[data-line-action]');
const lv=e.target.closest('[data-line-service]');
const lcom=e.target.closest('[data-line-community]');
const lj=e.target.closest('[data-line-join]');

if(ld && page==='LINE'){
  lineDirectoryTab=ld.dataset.lineDirectory;
  lineSearch='';
  render();
  return;
}

if(lt && page==='LINE'){
  lineTab=lt.dataset.lineTab;
  lineSearch='';
  render();
  return;
}

if(ls && page==='LINE'){
  lineSubtab=ls.dataset.lineSub;
  lineSearch='';
  render();
  return;
}

if(lp && page==='LINE'){
  lineProfile=lp.dataset.lineProfile;
  lineTab='profile';
  render();
  return;
}

if(lg && page==='LINE'){
  lineGroup=lg.dataset.lineGroup;
  lineTab='groupdetail';
  render();
  return;
}


if(lc && page==='LINE'){
  chat=lc.dataset.lineChat;

  if(chat==='pai' && save.flags.ep2Started){
    ep2OpenPai();
  }

  page='chat';
  render();
  return;
}

if(lv && page==='LINE'){
  const target=lv.dataset.lineService;
  lineTab=target==='newchat'?'chats':target;
  if(target==='friends')lineSubtab='friends';
  render();
  return;
}

if(lcom && page==='LINE'){
  lineOpenchat=lcom.dataset.lineCommunity;
  lineTab='community';
  render();
  return;
}

if(lj && page==='LINE'){
  const id=lj.dataset.lineJoin;
  if(lineJoined.includes(id)){
    lineJoined=lineJoined.filter(x=>x!==id);
  }else{
    lineJoined.push(id);
  }
  render();
  return;
}

if(la && page==='LINE'){
  const action=la.dataset.lineAction;

if(
  action==='favorites' ||
  action==='friends' ||
  action==='groups'
){
  lineDirectoryTab=action;
  lineTab='directory';
  lineSearch='';
  render();
  return;
}
  if(action==='friends'){
    lineTab='chats';
    lineSubtab='friends';
    render();
    return;
  }

  if(action==='call'){
    popup('โทรผ่าน LINE','การโทรเป็นระบบจำลอง ยังไม่เชื่อมกับ LINE จริง');
    return;
  }
  if(action==='todayinfo'||action==='walletinfo'){
    popup('ข้อมูลบริการ','ฟีเจอร์นี้เป็นหน้าจอจำลอง ไม่มีการเชื่อมต่อบริการจริง');
    return;
  }
  if(action==='search'){
    document.getElementById('lineSearchInput')?.focus();
    return;
  }
  lineTab=action;
  if(action==='friends')lineSubtab='friends';
  render();
  return;
}

if(e.target.closest('[data-line-call]')){
  popup('โทรผ่าน LINE','ยังไม่สามารถโทรจริงได้');
  return;
}

const pinBtn=e.target.closest('[data-pin],[data-pin-action]');

if(pinBtn && page==='pin'){

  if(pinBtn.dataset.pinAction==='cancel'){
    pinInput='';
    page='lock';
    render();
    return;
  }

  if(pinBtn.dataset.pinAction==='delete'){
    pinInput=pinInput.slice(0,-1);
    render();
    return;
  }

  if(pinBtn.dataset.pin!==undefined){

    if(pinInput.length>=4)return;

    pinInput+=pinBtn.dataset.pin;

    if(pinInput.length===4){

      if(pinInput===PHONE_PIN){
        pinInput='';
        page='home';
      }else{
        pinInput='';
        alert('รหัส PIN ไม่ถูกต้อง');
      }

    }

    render();
    return;
  }
}

const btn=e.target.closest('[data-go],[data-app],[data-chat],[data-reply],[data-task]');
if(!btn)return;

if(btn.dataset.go){

  const leavingDuj=
    page==='chat' &&
    chat==='duj' &&
    btn.dataset.go==='LINE' &&
    save.flags.deliveryStatus==='delivered' &&
    !save.flags.achiThanked;

  page=btn.dataset.go;

  if(page==='LINE'){
    lineTab='chats';
    lineSubtab='chats';
    lineSearch='';
  }

  if(leavingDuj){
    save.flags.achiThanked=true;
    persist();
  }

  render();

  if(leavingDuj){
    showGameBanner('achi','ขอบคุณครับ');
  }
}

else if(btn.dataset.app){
goApp(btn.dataset.app);
}
else if(btn.dataset.chat){
chat=btn.dataset.chat;
page='chat';
render();
}
else if(btn.dataset.reply){

  const who=btn.dataset.reply;

  const opts=[
    'ยินดีครับ สุขสันต์วันเกิดนะครับ',
    'ไม่เป็นไรครับ หวังว่าจะชอบเค้กนะครับ',
    'ถ้าอชิมีความสุข ผมก็ดีใจแล้วครับ'
  ];

  if(who==='achi'){
    save.replies[who]=opts[Number(btn.dataset.index)];
  if(who==='achi' && save.flags.achiThanked){
  ep2Start();
}
    save.flags.ep01Complete=true;
    persist();
    render();
  }
}
else if(btn.dataset.task){
const task=btn.dataset.task;

if(task==='close'){
document.getElementById('modal').innerHTML='';
}
if(task==='calendar'){
save.flags.calendar=true;
unlock('คำสั่งซื้อ');
popup('รายละเอียดวันเกิด','พี่ดุจช่วยดูเรื่องเค้กแล้ว คุณสามารถตรวจสอบรายการที่เกี่ยวข้องได้');
}
if(task==='order'){
save.flags.order=true;
unlock('โทรศัพท์');
popup('รายการเค้ก','คำสั่งซื้อได้รับการยืนยันแล้ว');
}
if(task==='dinner'){
unlock('โน้ต');
popup('รายการอาหาร','จัดส่งเรียบร้อยแล้ว มีข้อมูลเพิ่มเติมในโน้ต');
}
}
});

document.addEventListener('input',function(e){
  if(e.target.id!=='lineSearchInput')return;

  lineSearch=e.target.value;
  const cursor=e.target.selectionStart;

  render();

  const input=document.getElementById('lineSearchInput');
  if(input){
    input.focus();
    input.setSelectionRange(cursor,cursor);
  }
});
document.getElementById('nav').addEventListener('click',function(){
  if(page==='lock'){
    pinInput='';
    page='pin';
  }else if(page==='pin'){
    return;
  }else{
    page='home';
  }
  render();
});

let touchY=0;

screen.addEventListener('touchstart',e=>{
  touchY=e.touches[0].clientY;
},{passive:true});

screen.addEventListener('touchend',e=>{
  if(page==='lock' &&
     touchY-e.changedTouches[0].clientY>45){

    pinInput='';
    page='pin';
    render();
  }
},{passive:true});

try {
  render();
} catch(error) {
  console.error('Render error:', error);
  alert('เกิดข้อผิดพลาด: ' + error.message);
}

setInterval(()=>{
  if(page==='home')updateWeather();
},600000);
document.addEventListener('gesturestart',function(e){
  e.preventDefault();
},{passive:false});

document.addEventListener('gesturechange',function(e){
  e.preventDefault();
},{passive:false});
})();

</script>
</body>
</html>
