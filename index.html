<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17191e">
<title>KARAN'S PHONE</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#17191e;
 font-family:Arial,"Noto Sans Thai",sans-serif;
}
body{
 display:flex;
 justify-content:center;
 align-items:center;
}
#phone{
  position:relative;
  width:min(100vw,480px,calc(100dvh * 390 / 616));
  aspect-ratio:390/616;
  overflow:hidden;
  background:#d7d3e8;
  border:3px solid #292b35;
  border-radius:15px;
}
#display{
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
}
svg text{
 user-select:none;
 -webkit-user-select:none;
}
.clickable{cursor:pointer}
#dateText,
#timeText {
  paint-order: stroke fill;
  stroke: rgba(42, 38, 60, 0.18);
  stroke-width: 0.7px;
  filter: drop-shadow(0 1.5px 3px rgba(35,30,55,.32));
}
</style>
</head>

<body>
<div id="phone">

<svg id="display"
 xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 390 616"
 preserveAspectRatio="xMidYMid meet">

<defs>
 <filter id="pinBlur" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="12"/>
 </filter>
 <linearGradient id="fallback" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f4e6ef"/>
  <stop offset=".5" stop-color="#dcd7ee"/>
  <stop offset="1" stop-color="#aebddd"/>
 </linearGradient>

 <linearGradient id="musicGlass" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#7982a7"/>
  <stop offset="1" stop-color="#626b91"/>
 </linearGradient>
</defs>

<!-- ==============================
     LOCK SCREEN
============================== -->

<g id="lockPage">

 <rect width="390" height="616" fill="url(#fallback)"/>

 <!-- Wallpaper -->
 <image id="wallpaper"
  x="0" y="0"
  width="390" height="616"
  preserveAspectRatio="xMidYMid slice"
  href="https://i.ibb.co/gMd6pkQ5/IMG-4434.jpg"/>

 <!-- Lock icon -->
<!-- Solid black lock -->
<g id="lockIcon"
 transform="translate(195 49) scale(.75)"
 fill="#17171D">

 <!-- Shackle -->
 <path d="
  M-6 1
  V-5
  A6 6 0 0 1 6 -5
  V1
  H3
  V-5
  A3 3 0 0 0 -3 -5
  V1
  Z"/>

 <!-- Lock body -->
 <rect x="-9" y="0"
  width="18" height="15"
  rx="3.2"/>

 <!-- White keyhole -->
 <circle cx="0" cy="6"
  r="2"
  fill="#FFFFFF"/>

 <path d="M-1 7.5H1L1.5 11H-1.5Z"
  fill="#FFFFFF"/>
</g>

 <!-- Date -->
<text id="dateText"
  x="195" y="105"
  text-anchor="middle"
  font-size="14"
  font-weight="600"
  fill="#35313B">วันพุธที่ 11 พฤศจิกายน</text>

 <!-- Time -->
 <text id="timeText"
  x="195" y="182"
  text-anchor="middle"
  font-size="72"
  font-weight="800"
  letter-spacing="-3"
  fill="#F5F1F2">12:00</text>

 <!-- Bottom shortcuts -->
 <g id="phoneShortcut" class="clickable">
  <circle id="phoneCircle"
   cx="46" cy="572" r="22"
   fill="#858fca" fill-opacity=".9"/>

  <path
   d="M38 564l5-1 3 6-3 3
      q3 5 8 7l3-3 6 3v5
      q-8 3-16-5t-6-15z"
   fill="none"
   stroke="#F5F1F2"
   stroke-width="2"
   stroke-linecap="round"
   stroke-linejoin="round"/>
 </g>

 <!-- Music capsule -->
 <g id="musicWidget">

  <rect id="musicBG"
   x="83" y="548"
   width="224" height="49"
   rx="24.5"
   fill="url(#musicGlass)"
   fill-opacity=".94"/>

  <!-- Album artwork -->
  <g id="albumArt">
   <circle cx="108" cy="572.5" r="18"
    fill="#a6d4d4"/>
   <circle cx="108" cy="572.5" r="13.5"
    fill="#dceee7"/>
   <path d="M95 578Q108 567 121 578"
    fill="none"
    stroke="#77b4b2"
    stroke-width="3"
    stroke-linecap="round"/>
  </g>

  <text id="songTitle"
   x="132" y="569"
   font-size="10.5"
   font-weight="700"
   fill="#F5F1F2">เพลงของการันต์</text>

  <text id="songArtist"
   x="132" y="583"
   font-size="9"
   fill="#F5F1F2"
   opacity=".8">Music Player</text>

  <!-- Previous -->
  <g id="previous" class="clickable"
   transform="translate(243 572.5)"
   fill="#F5F1F2">
   <path d="M-5 0L3-6V6Z"/>
   <rect x="-8" y="-6" width="2" height="12" rx="1"/>
   <rect x="-13" y="-16" width="25" height="32"
    fill="transparent"/>
  </g>

  <!-- Play / Pause -->
  <g id="playButton" class="clickable"
   transform="translate(268 572.5)">
   <path id="playShape"
    d="M-4-7L7 0-4 7Z"
    fill="#F5F1F2"/>
   <rect x="-12" y="-16" width="24" height="32"
    fill="transparent"/>
  </g>

  <!-- Next -->
  <g id="next" class="clickable"
   transform="translate(292 572.5)"
   fill="#F5F1F2">
   <path d="M-3-6L5 0-3 6Z"/>
   <rect x="6" y="-6" width="2" height="12" rx="1"/>
   <rect x="-12" y="-16" width="24" height="32"
    fill="transparent"/>
  </g>

 </g>

 <!-- Camera shortcut -->
 <g id="cameraShortcut" class="clickable">
  <circle id="cameraCircle"
   cx="344" cy="572" r="22"
   fill="#858fca" fill-opacity=".9"/>

  <g fill="none"
   stroke="#F5F1F2"
   stroke-width="1.8"
   stroke-linejoin="round">

   <rect x="332" y="565"
    width="24" height="17" rx="4"/>
   <path d="M338 565l2-4h8l2 4"/>
   <circle cx="344" cy="573.5" r="5"/>
  </g>
 </g>

</g>

<!-- ==============================
     PIN SCREEN
============================== -->

<g id="pinPage" display="none">

 <!-- Blurred lock-screen wallpaper -->
 <image id="pinWallpaper"
  x="0" y="0"
  width="390" height="616"
  preserveAspectRatio="xMidYMid slice"
  href="https://i.ibb.co/gMd6pkQ5/IMG-4434.jpg"
  filter="url(#pinBlur)"/>

 <!-- Dark overlay -->
 <rect width="390" height="616"
  fill="#17171D"
  fill-opacity=".25"/>

 <text x="195" y="130"
  text-anchor="middle"
  font-size="20"
  fill="#35313b">กรอกรหัส PIN</text>

 <g id="pinDots"
  stroke="#35313b"
  stroke-width="1.7"
  fill="none">
  <circle cx="147" cy="164" r="6"/>
  <circle cx="179" cy="164" r="6"/>
  <circle cx="211" cy="164" r="6"/>
  <circle cx="243" cy="164" r="6"/>
 </g>

 <text id="pinError"
  x="195" y="193"
  text-anchor="middle"
  font-size="12"
  fill="#8a4256"></text>

 <g id="keypad"></g>

</g>

<!-- ==============================
     TEMPORARY UNLOCK SCREEN
============================== -->

<g id="unlockedPage" display="none">
 <rect width="390" height="616" fill="#e8edf5"/>

 <text x="195" y="290"
  text-anchor="middle"
  font-size="22"
  fill="#4e6786">ปลดล็อกสำเร็จ</text>

 <text x="195" y="319"
  text-anchor="middle"
  font-size="13"
  fill="#73849c">
  หน้าหลักจะสร้างในขั้นต่อไป
 </text>
</g>

<!-- ==============================
     STATUS BAR
============================== -->

<g id="statusBar">

 <!-- Carrier -->
<text id="carrier"
  x="19" y="23"
  font-size="13"
  font-weight="700"
  fill="#35313B"
  stroke="#181820"
  stroke-opacity=".35"
  stroke-width=".4"
  paint-order="stroke fill">karan</text>

<!-- Samsung-style Silent -->
<g id="silentIcon"
 transform="translate(292 15)"
 fill="none"
 stroke="#35313B"
 stroke-linecap="round"
 stroke-linejoin="round">

 <!-- Speaker -->
 <path d="M0 4H3L7 1V11L3 8H0Z"
  fill="#35313B"
  stroke="none"/>

 <!-- Sound wave -->
 <path d="M9 3
          Q12 6 9 9
          M11 1
          Q16 6 11 11"
  stroke-width="1.3"/>

 <!-- Diagonal mute line -->
 <path d="M-1 0L13 12"
  stroke-width="1.7"/>

</g>

<!-- Mobile signal -->
<g fill="#35313B">
  <rect x="322" y="20" width="2.5" height="6" rx="1"/>
  <rect x="327" y="17" width="2.5" height="9" rx="1"/>
  <rect x="332" y="14" width="2.5" height="12" rx="1"/>
  <rect x="337" y="11" width="2.5" height="15" rx="1"/>
</g>

 <!-- Wi-Fi -->
 <g fill="none"
  stroke="#35313B"
  stroke-width="1.7"
  stroke-linecap="round">
  <path d="M347 16Q353 11 359 16"/>
  <path d="M350 20Q353 17 356 20"/>
  <circle cx="353" cy="23" r="1.4"
   fill="#35313B" stroke="none"/>
 </g>

 <!-- Battery -->
 <g id="batteryIcon">

  <defs>
   <clipPath id="batteryClip">
    <rect x="365" y="12"
     width="20" height="14" rx="5"/>
   </clipPath>
  </defs>

  <!-- Battery background -->
<rect x="365" y="12"
 width="20" height="14"
 rx="5"
 fill="#35313B"
 fill-opacity=".18"
 stroke="#35313B"
 stroke-width="1.3"/>

  <!-- Battery fill -->
  <rect id="batteryFill"
   x="365" y="12"
   width="17" height="14"
   fill="#17171D"
   clip-path="url(#batteryClip)"/>

  <!-- Battery terminal -->
 <rect id="batteryTerminal"
 x="385" y="16"
 width="3" height="6"
 rx="1"
 fill="#35313B"/>

  <!-- Battery number -->
  <text id="batteryLevel"
   x="375" y="22"
   text-anchor="middle"
   font-size="8"
   font-weight="800"
   fill="#FFFFFF">85</text>

 </g>

</g>

<!-- Front camera -->
<g id="frontCamera">
 <circle cx="195" cy="17" r="9" fill="#171922"/>
 <circle cx="195" cy="17" r="6" fill="#05070c"/>
 <circle cx="193" cy="15" r="1.5"
  fill="#53617a" opacity=".55"/>
</g>

<!-- Gesture bar -->
<rect id="gestureBar"
 x="145" y="604"
 width="100" height="4"
 rx="2" fill="#F5F1F2"/>

</svg>
</div>

<script>
"use strict";

/* ==========================================
   MAIN CONFIG
   ปรับตำแหน่งและหน้าตาจากจุดนี้
========================================== */

const CONFIG = {
 pin: "1906",

wallpaper:
  "https://i.ibb.co/gMd6pkQ5/IMG-4434.jpg",
  
 carrier: "karan",

textColor: "#35313B",

 lock: {
  x: 195,
  y: 49,
  scale: 0.75
 },

 date: {
  x: 195,
  y: 105,
  size: 14
 },

 clock: {
  x: 195,
  y: 182,
  size: 72,
  weight: 800
 },

 bottom: {
  y: 572,
  leftX: 46,
  rightX: 344
 },

 music: {
  x: 83,
  y: 548,
  width: 224,
  height: 49,
  background: "#70799d",
  title: "เพลงของการันต์",
  artist: "Music Player",
  playing: false
 },

 battery: {
  level: 85,
  showTerminal: true
 }
};

/* ==========================================
   STATE AND HELPERS
========================================== */

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("display");

let currentPage = "lock";
let enteredPIN = "";
let pinBusy = false;
let swipeStart = null;

const byId = id => document.getElementById(id);

function setAttributes(element, attributes) {
 if (!element) return;
 Object.entries(attributes).forEach(([name,value]) => {
  element.setAttribute(name,String(value));
 });
}

/* ==========================================
   CONFIG RENDER
========================================== */

function applyConfig() {
 const c = CONFIG;

 byId("wallpaper").setAttribute("href",c.wallpaper);
byId("pinWallpaper").setAttribute("href",c.wallpaper);
 byId("carrier").textContent = c.carrier;

 setAttributes(byId("lockIcon"),{
  transform:
   `translate(${c.lock.x} ${c.lock.y}) scale(${c.lock.scale})`
 });

 setAttributes(byId("dateText"),{
  x:c.date.x,
  y:c.date.y,
  "font-size":c.date.size,
  fill:c.textColor
 });

 setAttributes(byId("timeText"),{
  x:c.clock.x,
  y:c.clock.y,
  "font-size":c.clock.size,
  "font-weight":c.clock.weight,
  fill:c.textColor
 });

 byId("songTitle").textContent = c.music.title;
 byId("songArtist").textContent = c.music.artist;

 const m = c.music;
 const centerY = m.y + m.height / 2;

 setAttributes(byId("musicBG"),{
  x:m.x,
  y:m.y,
  width:m.width,
  height:m.height,
  rx:m.height/2,
  fill:m.background
 });

 const musicOffsetX = m.x - 83;
 const musicOffsetY = centerY - 572.5;

 setAttributes(byId("albumArt"),{
  transform:
   `translate(${musicOffsetX} ${musicOffsetY})`
 });

 setAttributes(byId("songTitle"),{
  x:132+musicOffsetX,
  y:569+musicOffsetY
 });

 setAttributes(byId("songArtist"),{
  x:132+musicOffsetX,
  y:583+musicOffsetY
 });

 setAttributes(byId("previous"),{
  transform:
   `translate(${m.x+160} ${centerY})`
 });

 setAttributes(byId("playButton"),{
  transform:
   `translate(${m.x+185} ${centerY})`
 });

 setAttributes(byId("next"),{
  transform:
   `translate(${m.x+209} ${centerY})`
 });

 const leftX = c.bottom.leftX;
 const rightX = c.bottom.rightX;
 const bottomY = c.bottom.y;

 setAttributes(byId("phoneShortcut"),{
  transform:
   `translate(${leftX-46} ${bottomY-572})`
 });

 setAttributes(byId("cameraShortcut"),{
  transform:
   `translate(${rightX-344} ${bottomY-572})`
 });

const level = Math.max(0, Math.min(100, c.battery.level));

byId("batteryLevel").textContent = level;

byId("batteryFill").setAttribute(
  "width",
  20 * level / 100
);

byId("batteryLevel").setAttribute(
  "fill",
  level >= 50 ? "#FFFFFF" : "#17171D"
);

byId("batteryTerminal").setAttribute(
  "display",
  c.battery.showTerminal ? "inline" : "none"
);

updatePlayIcon();
}

/* ==========================================
   CLOCK AND DATE
========================================== */

function updateClock() {
 const now = new Date();

 const time = now.toLocaleTimeString("th-TH",{
  hour:"2-digit",
  minute:"2-digit",
  hour12:false
 });

 const date = now.toLocaleDateString("th-TH",{
  weekday:"long",
  day:"numeric",
  month:"long"
 });

 byId("timeText").textContent=time;
 byId("dateText").textContent=date;
}

/* ==========================================
   MUSIC
========================================== */

function updatePlayIcon() {
 const path = byId("playShape");

 if(CONFIG.music.playing){
  path.setAttribute(
   "d","M-5-7H-1V7H-5ZM2-7H6V7H2Z"
  );
 } else {
  path.setAttribute(
   "d","M-4-7L7 0-4 7Z"
  );
 }
}

byId("playButton").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=!CONFIG.music.playing;
 updatePlayIcon();
});

byId("previous").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=false;
 updatePlayIcon();
});

byId("next").addEventListener("click",event=>{
 event.stopPropagation();
 CONFIG.music.playing=false;
 updatePlayIcon();
});

/* ==========================================
   SCREEN MANAGEMENT
========================================== */

function showPage(page) {
 currentPage=page;

 byId("lockPage").setAttribute(
  "display",page==="lock"?"inline":"none"
 );

 byId("pinPage").setAttribute(
  "display",page==="pin"?"inline":"none"
 );

 byId("unlockedPage").setAttribute(
  "display",page==="unlocked"?"inline":"none"
 );

 byId("statusBar").setAttribute(
  "display",page==="unlocked"?"none":"inline"
 );

 byId("frontCamera").setAttribute(
  "display",page==="unlocked"?"none":"inline"
 );
}

function openPIN() {
 if(currentPage!=="lock")return;

 enteredPIN="";
 pinBusy=false;
 byId("pinError").textContent="";
 updateDots();
 showPage("pin");
}

function updateDots() {
 document.querySelectorAll("#pinDots circle")
  .forEach((dot,index)=>{
   dot.setAttribute(
    "fill",
    index<enteredPIN.length?"#35313b":"none"
   );
  });
}

function pressPIN(value) {
 if(currentPage!=="pin"||pinBusy)return;

 if(value==="cancel"){
  showPage("lock");
  return;
 }

 if(value==="delete"){
  enteredPIN=enteredPIN.slice(0,-1);
  updateDots();
  return;
 }

 if(enteredPIN.length>=4)return;

 enteredPIN+=value;
 updateDots();

 if(enteredPIN.length===4){
  pinBusy=true;

  if(enteredPIN===CONFIG.pin){
   setTimeout(()=>{
    pinBusy=false;
    showPage("unlocked");
   },180);
  }else{
   byId("pinError").textContent=
    "รหัส PIN ไม่ถูกต้อง";

   setTimeout(()=>{
    enteredPIN="";
    pinBusy=false;
    updateDots();
   },450);
  }
 }
}

/* ==========================================
   CREATE SVG PIN KEYPAD
========================================== */


function createKeypad() {
  const keypad = byId("keypad");
  keypad.replaceChildren();

  // ตัวเลข 1–9 และ 0 อยู่ตรงกลางแถวสุดท้าย
  const keys = [
    ["1", 95, 255], ["2", 195, 255], ["3", 295, 255],
    ["4", 95, 337], ["5", 195, 337], ["6", 295, 337],
    ["7", 95, 419], ["8", 195, 419], ["9", 295, 419],
    ["0", 195, 501]
  ];

  keys.forEach(([value, x, y]) => {
    const group = document.createElementNS(NS, "g");
    group.setAttribute("class", "clickable");

    const circle = document.createElementNS(NS, "circle");
    setAttributes(circle, {
      cx: x,
      cy: y,
      r: 32,
      fill: "#FFFFFF",
      "fill-opacity": ".24",
      stroke: "#FFFFFF",
      "stroke-opacity": ".25",
      "stroke-width": 1
    });

    const label = document.createElementNS(NS, "text");
    setAttributes(label, {
      x: x,
      y: y + 10,
      "text-anchor": "middle",
      fill: "#35313B",
      "font-size": 30,
      "font-weight": 400
    });
    label.textContent = value;

    group.append(circle, label);
    group.addEventListener("click", event => {
      event.stopPropagation();
      pressPIN(value);
    });
    keypad.appendChild(group);
  });

  // ปุ่มด้านล่าง แยกจากวงกลมตัวเลข
  [
    ["ฉุกเฉิน", 75, 579, "emergency"],
    ["ยกเลิก", 315, 579, "cancel"]
  ].forEach(([text, x, y, action]) => {
    const group = document.createElementNS(NS, "g");
    group.setAttribute("class", "clickable");

    const hitbox = document.createElementNS(NS, "rect");
    setAttributes(hitbox, {
      x: x - 46,
      y: y - 24,
      width: 92,
      height: 40,
      fill: "transparent"
    });

    const label = document.createElementNS(NS, "text");
    setAttributes(label, {
      x: x,
      y: y,
      "text-anchor": "middle",
      fill: "#35313B",
      "font-size": 14
    });
    label.textContent = text;

    group.append(hitbox, label);

    group.addEventListener("click", event => {
      event.stopPropagation();

      if (action === "cancel") {
        pressPIN("cancel");
      } else {
        // ยังไม่มีระบบโทรฉุกเฉินในเกม
        byId("pinError").textContent =
          "ยังไม่เปิดใช้งานการโทรฉุกเฉิน";
      }
    });

    keypad.appendChild(group);
  });
}

/* ==========================================
   SWIPE TO UNLOCK
========================================== */

function svgY(event) {
 const rect=svg.getBoundingClientRect();
 return (event.clientY-rect.top)*616/rect.height;
}

svg.addEventListener("pointerdown",event=>{
 if(currentPage!=="lock")return;
 swipeStart=svgY(event);
});

svg.addEventListener("pointerup",event=>{
 if(currentPage!=="lock"||swipeStart===null)return;

 const distance=swipeStart-svgY(event);
 swipeStart=null;

 if(distance>35){
  openPIN();
 }
});

svg.addEventListener("pointercancel",()=>{
 swipeStart=null;
});

byId("phoneShortcut").addEventListener("click",openPIN);
byId("cameraShortcut").addEventListener("click",openPIN);

document.addEventListener("keydown",event=>{
 if(currentPage==="pin"){
  if(/^[0-9]$/.test(event.key))pressPIN(event.key);
  else if(event.key==="Backspace")pressPIN("delete");
  else if(event.key==="Escape")pressPIN("cancel");
 }else if(currentPage==="lock"&&event.key==="ArrowUp"){
  openPIN();
 }
});

/* ==========================================
   INITIALIZE
========================================== */

createKeypad();
applyConfig();
updateClock();
setInterval(updateClock,1000);
showPage("lock");
</script>
 
<!-- KARAN HOME + LINE : ONE-POINT ADDON -->

<style>
/* Independent One UI mockup shell. Does not modify lock or PIN geometry. */
#mockShell,#mockShell *{box-sizing:border-box}
#mockShell{position:absolute;inset:0;z-index:180;display:none;background:#fafafa;color:#171717;font-family:Arial,"Noto Sans Thai",sans-serif;font-size:14px;overflow:hidden}
#mockShell button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#mockShell .sysbar{position:absolute;top:0;left:0;right:0;height:35px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;background:transparent;z-index:100;font-size:12px;font-weight:700;pointer-events:none}
#mockShell .sysbar .sysright{display:flex;align-items:center;gap:7px}
#mockShell .sysbar svg{width:52px;height:17px}
#mockShell .appviewport{position:absolute;top:35px;bottom:20px;left:0;right:0;overflow-y:auto;overscroll-behavior:contain}
#mockShell .gesture{position:absolute;bottom:0;left:0;right:0;height:20px;display:flex;justify-content:center;align-items:center;z-index:100;cursor:pointer}
#mockShell .gesture:after{content:"";width:105px;height:4px;background:#3337;border-radius:10px}
#mockShell .home{min-height:100%;padding:27px 15px 85px;background:linear-gradient(#0002,#0003),url('https://i.ibb.co/gMd6pkQ5/IMG-4434.jpg') center/cover;color:white}
#mockShell .weather{display:flex;gap:12px;align-items:center;margin:13px 0 22px;font-size:46px}
#mockShell .weather small{font-size:12px;display:block}
#mockShell .appgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 6px}
#mockShell .appicon{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;min-width:0;text-align:center;color:inherit}
#mockShell .iconbox{width:51px;height:51px;border-radius:15px;background:var(--c);color:var(--fg,#fff);display:grid;place-items:center;box-shadow:0 2px 5px #0002}
#mockShell .iconbox svg{width:29px;height:29px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
#mockShell .homedock{position:absolute;bottom:30px;left:12px;right:12px;display:flex;justify-content:space-around;align-items:center}
#mockShell .homedock .iconbox{width:45px;height:45px}
#mockShell .apphead{position:sticky;top:0;z-index:10;background:#fafafa;padding:11px 17px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#mockShell .apphead h2{font-size:24px;line-height:1.2;margin:0;font-weight:700}
#mockShell .apphead .back{font-size:26px;min-width:28px;text-align:left}
#mockShell .apphead .more{font-size:21px}
#mockShell .search{display:block;width:calc(100% - 32px);margin:9px 16px 14px;border:0;border-radius:24px;background:#eee;padding:12px 15px;outline:0;font-size:14px}
#mockShell .tabs{display:flex;gap:8px;padding:5px 15px 13px;overflow-x:auto}
#mockShell .tabs button{white-space:nowrap;padding:9px 14px;border-radius:22px;background:#ededed;font-size:13px}
#mockShell .tabs button.on{background:#222;color:white}
#mockShell .item{width:100%;min-height:65px;display:flex;align-items:center;gap:12px;padding:10px 18px;text-align:left;border-bottom:1px solid #eee!important}
#mockShell .item .avatar{width:42px;height:42px;border-radius:50%;background:#e4e7ef;display:grid;place-items:center;font-weight:bold;flex-shrink:0;color:#52606c}
#mockShell .item .info{min-width:0;flex:1}
#mockShell .item .info b{display:block;font-size:15px}
#mockShell .item .info small{display:block;color:#888;font-size:12px;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#mockShell .bottomtabs{position:absolute;bottom:20px;left:0;right:0;height:49px;display:flex;align-items:center;justify-content:space-around;background:#fafafa;border-top:1px solid #eee}
#mockShell .bottomtabs button{font-size:12px;color:#777}
#mockShell .bottomtabs button.on{font-weight:700;color:#111}
#mockShell .sheet{padding:14px 17px}
#mockShell .muted{color:#888;font-size:12px}
#mockShell .fab{position:absolute;right:17px;bottom:79px;width:51px;height:51px;border-radius:17px!important;background:#d9e7ff!important;font-size:25px!important;box-shadow:0 4px 12px #0002}
#mockShell .chatmessages{padding:15px 11px 18px;display:flex;flex-direction:column;gap:12px;min-height:100%;background:#d3d9e6}
#mockShell .chatrow{display:flex;align-items:flex-start;gap:7px;max-width:90%}
#mockShell .chatrow.mine{align-self:flex-end;justify-content:flex-end}
#mockShell .chatrow .avatar{height:30px;width:30px;flex-shrink:0;border-radius:50%;background:#e6e8ed;display:grid;place-items:center;font-weight:bold;font-size:12px}
#mockShell .bubble{border-radius:15px;padding:9px 12px;background:white;line-height:1.5;max-width:100%;overflow-wrap:anywhere}
#mockShell .mine .bubble{background:#b5ef8f}
#mockShell .chatcompose{position:absolute;bottom:20px;left:0;right:0;background:white;display:flex;gap:8px;padding:9px}
#mockShell .chatcompose input{flex:1;min-width:0;border:0;background:#f1f1f1;border-radius:25px;padding:10px;outline:none}
#mockShell .chatcompose button{border-radius:22px;background:#06c755;color:white;padding:8px 13px}
#mockShell .gallerygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
#mockShell .phototile{aspect-ratio:1;background:linear-gradient(135deg,#e9d9c9,#b8c7d3);display:grid;place-items:center;font-size:25px;color:#777}
#mockShell .calgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:7px;padding:10px}
#mockShell .calgrid button{height:34px;border-radius:50%}
#mockShell .calgrid button.today{background:#cfe0ff}
#mockShell .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 30px;margin:18px auto;max-width:270px;text-align:center}
#mockShell .keypad button{height:53px;border-radius:50%;background:#f0f0f0;font-size:23px}
#mockShell .card{background:white;border-radius:17px;margin:10px 15px;padding:16px;box-shadow:0 1px 4px #0001}
#mockShell .quick{position:absolute;top:35px;left:0;right:0;background:#edf0f7;padding:20px;z-index:101;border-radius:0 0 25px 25px;display:none}
#mockShell .quick.open{display:block}
#mockShell .quick button{background:#d5dded;border-radius:18px;padding:10px;margin:5px}

/* Two swipeable home pages and icon-only dock */
#mockShell .homepages{min-height:210px}
#mockShell .pagedots{position:absolute;bottom:93px;left:0;right:0;display:flex;justify-content:center;gap:9px;pointer-events:auto}
#mockShell .pagedots button{width:7px;height:7px;padding:0;border-radius:50%;background:#ffffff75}
#mockShell .pagedots button.selected{background:white}
#mockShell .homedock{bottom:29px;z-index:5}
#mockShell .homedock .appicon>span:last-child:not(.iconbox){display:none}
#mockShell .weather-svg svg{width:52px;height:52px;stroke:#fff;fill:none;stroke-width:2}
#mockShell .home{min-height:100%;height:100%;position:relative}
</style>
<script>
(function(){'use strict';
const root=document.createElement('div');root.id='mockShell';document.getElementById('phone').appendChild(root);
const icons={
facebook:'<path d="M17 26V15h4l1-5h-5V8c0-2 1-2 3-2h2V2h-4c-5 0-7 3-7 7v1H8v5h3v11"/>',
messages:'<path d="M4 6h20v14H10l-6 5V6Z"/><path d="M8 11h12M8 15h9"/>',
line:'<path d="M4 12c0-5 4-8 10-8s10 3 10 8-4 8-10 8h-3l-5 3 1-5c-2-2-3-4-3-6Z"/><path d="M9 12h10"/>',
phone:'<path d="M7 3h5l2 5-3 3c2 4 4 6 8 8l3-3 4 2v5c-11 3-22-9-19-20Z"/>',
gallery:'<rect x="3" y="3" width="22" height="22" rx="4"/><circle cx="10" cy="10" r="2"/><path d="m4 21 7-7 5 5 3-3 6 6"/>',
camera:'<rect x="2" y="7" width="24" height="18" rx="4"/><path d="m9 7 2-3h7l2 3"/><circle cx="14" cy="16" r="5"/>',
calendar:'<rect x="3" y="5" width="22" height="20" rx="3"/><path d="M8 2v6M20 2v6M3 11h22"/>',
notes:'<rect x="4" y="3" width="20" height="23" rx="3"/><path d="M9 10h10M9 15h10M9 20h7"/>',
music:'<path d="M12 6v15a4 4 0 1 1-3-4V7l14-3v14a4 4 0 1 1-3-4V5Z"/>',
browser:'<circle cx="14" cy="14" r="11"/><path d="M3 14h22M14 3c-7 6-7 16 0 22M14 3c7 6 7 16 0 22"/>',
instagram:'<rect x="3" y="3" width="22" height="22" rx="6"/><circle cx="14" cy="14" r="5"/><circle cx="21" cy="7" r="1"/>',
mail:'<rect x="2" y="5" width="24" height="18" rx="3"/><path d="m3 7 11 9L25 7"/>',
maps:'<path d="M14 26S5 17 5 11a9 9 0 0 1 18 0c0 6-9 15-9 15Z"/><circle cx="14" cy="11" r="3"/>',
files:'<path d="M2 8V5h9l3 3h12v16H2Z"/>',
clock:'<circle cx="14" cy="14" r="11"/><path d="M14 7v8l5 3"/>',
settings:'<circle cx="14" cy="14" r="4"/><path d="M14 2v4M14 22v4M2 14h4M22 14h4M5 5l3 3M20 20l3 3M23 5l-3 3M8 20l-3 3"/>',
contacts:'<circle cx="14" cy="9" r="5"/><path d="M4 25c0-12 20-12 20 0"/>'};
const apps=[['line','LINE','#06c755'],['facebook','Facebook','#1877f2'],['messages','ข้อความ','#4b9eeb'],['phone','โทรศัพท์','#4db66c'],['gallery','แกลเลอรี','#f3adbe'],['camera','กล้อง','#9daac4'],['calendar','ปฏิทิน','#fff','#d34b50'],['notes','โน้ต','#f6d86b','#5d4e29'],['music','เพลง','#e1a4c8'],['browser','Internet','#8bbfe7'],['instagram','Instagram','#c77bbd'],['mail','Gmail','#fff','#df5555'],['maps','Maps','#9bd2b4'],['files','ไฟล์','#e4bc68'],['clock','นาฬิกา','#d4d8e5','#323842'],['settings','ตั้งค่า','#a9b9d2'],['contacts','รายชื่อ','#c2d8ec','#526784']];
const people=['อชิ','พี่ดุจ','ทานากะซัง','พาย','ป่า','ร็อก'];
const chats=Object.fromEntries(people.map(n=>[n,[{who:'them',text:'สวัสดีครับ คุณการันต์'}]]));
const photos=Array.from({length:18},(_,i)=>({name:'รูปภาพ '+(i+1),date:'11 พฤศจิกายน 2026'}));
const notes=[{title:'รายการสิ่งที่ต้องทำ',body:'รายการสำหรับวันนี้\n- ตรวจอีเมล\n- นัดประชุม'},{title:'ไอเดีย',body:'จดบันทึกที่นี่'}];
let screen='home',history=[],tab='แชต',month=10,year=2026,selectedPerson='อชิ',callDigits='',timer=null,timerSec=0;
const $=id=>document.getElementById(id);
const icon=id=>'<svg viewBox="0 0 28 28" aria-hidden="true">'+icons[id]+'</svg>';
const tile=a=>`<button class="appicon" data-app="${a[0]}"><span class="iconbox" style="--c:${a[2]};--fg:${a[3]||'#fff'}">${icon(a[0])}</span><span>${a[1]}</span></button>`;
const header=(name,extra='')=>`<div class="apphead"><button class="back" data-back>‹</button><h2>${name}</h2><button class="more" data-more>⋮</button></div>${extra}`;
const list=(items,action='open')=>items.map((n,i)=>`<button class="item" data-${action}="${i}"><span class="avatar">${n[0]}</span><span class="info"><b>${n}</b><small>${action==='person'?'แตะเพื่อดูการสนทนา':'แตะเพื่อเปิด'}</small></span><span>›</span></button>`).join('');
const homePages=[['line','facebook','instagram','calendar','messages','music','clock','gallery'],['browser','files','maps']];
const dockApps=['phone','notes','camera'];
let homePage=0;
const findApp=id=>apps.find(a=>a[0]===id);
const homeTile=(id,hideLabel=false)=>{const a=findApp(id);return `<button class="appicon" data-app="${a[0]}" aria-label="${a[1]}"><span class="iconbox" style="--c:${a[2]};--fg:${a[3]||'#fff'}">${icon(a[0])}</span>${hideLabel?'':`<span>${a[1]}</span>`}</button>`;};
const home=()=>`<div class="home"><div class="weather"><span class="weather-svg">${icon('clock')}</span><div>30°<small>มีเมฆบางส่วน</small><small>กรุงเทพมหานคร</small></div></div><div class="homepages"><div class="appgrid">${homePages[homePage].map(id=>homeTile(id)).join('')}</div></div><div class="pagedots">${homePages.map((_,i)=>`<button data-homepage="${i}" aria-label="หน้าที่ ${i+1}" class="${i===homePage?'selected':''}"></button>`).join('')}</div></div><div class="homedock">${dockApps.map(id=>homeTile(id,true)).join('')}</div>`;
function view(){
 let body='',dark=screen==='home';
 if(screen==='home')body=home();
 else if(screen==='line'){body=header('LINE')+`<div class="tabs"><button data-tab="แชต" class="${tab==='แชต'?'on':''}">แชต</button><button data-tab="เพื่อน" class="${tab==='เพื่อน'?'on':''}">เพื่อน</button></div><input class="search" id="lineSearch" placeholder="ค้นหา"/>`+list(people,'person')+`<div style="height:70px"></div>`;}
 else if(screen==='chat'){body=header(selectedPerson)+`<div class="chatmessages" id="chatMessages">${chats[selectedPerson].map(m=>`<div class="chatrow ${m.who==='me'?'mine':''}">${m.who==='them'?`<span class="avatar">${selectedPerson[0]}</span>`:''}<div class="bubble">${escapeHtml(m.text)}</div></div>`).join('')}</div><form class="chatcompose" id="chatForm"><input id="chatInput" placeholder="ข้อความ"/><button>ส่ง</button></form>`;}
 else if(screen==='phone'){body=header('โทรศัพท์')+`<div class="tabs">${['แป้นกด','ล่าสุด','รายชื่อ'].map(t=>`<button data-ptab="${t}" class="${tab===t?'on':''}">${t}</button>`).join('')}</div>`+(tab==='ล่าสุด'?list(['อชิ','พี่ดุจ','พาย'],'dial'):tab==='รายชื่อ'?list(people,'dial'):`<div style="text-align:center;font-size:28px;margin-top:20px;height:35px">${callDigits}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(d=>`<button data-digit="${d}">${d}</button>`).join('')}</div><div style="text-align:center"><button data-action="call" style="background:#4db66c;color:white;border-radius:30px;padding:12px 32px">โทร</button></div>`);}
 else if(screen==='gallery'){body=header('แกลเลอรี')+`<div class="tabs"><button class="on">รูปภาพ</button><button data-action="albums">อัลบั้ม</button></div><div class="gallerygrid">${photos.map((p,i)=>`<button class="phototile" data-photo="${i}">${icon('gallery')}</button>`).join('')}</div>`;}
 else if(screen==='photo'){body=header('รูปภาพ')+`<div class="card" style="height:65%;display:grid;place-items:center;background:#e4e7ed">${icon('gallery')}<p>ตัวอย่างรูปภาพ</p></div><div class="sheet"><button data-action="favorite">♡ รายการโปรด</button>　<button data-action="deletephoto">ลบ</button></div>`;}
 else if(screen==='camera'){body=`<div style="background:#17191e;color:white;height:100%;display:flex;flex-direction:column;justify-content:space-between"><div class="apphead" style="background:#17191e"><button data-back>‹</button><b>กล้อง</b><button data-action="flip">↻</button></div><div style="flex:1;display:grid;place-items:center;background:#30343b">${icon('camera')}<small>กล้องจำลอง</small></div><div style="display:flex;justify-content:space-around;align-items:center;height:105px"><button data-app="gallery">▣</button><button data-action="shutter" style="width:62px;height:62px;border-radius:50%;border:5px solid white;background:#ddd"></button><button data-action="flip">↻</button></div></div>`;}
 else if(screen==='calendar'){let first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();body=header('ปฏิทิน')+`<div class="sheet" style="display:flex;justify-content:space-between"><button data-action="prevmonth">‹</button><b>${year} / ${month+1}</b><button data-action="nextmonth">›</button></div><div class="calgrid">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<b>${x}</b>`).join('')}${Array.from({length:first},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>`<button data-day="${i+1}" class="${i+1===11?'today':''}">${i+1}</button>`).join('')}</div><div class="card"><b>กิจกรรม</b><p class="muted">แตะวันที่เพื่อดูหรือเพิ่มกิจกรรม</p></div>`;}
 else if(screen==='notes'){body=header('Samsung Notes')+`<input class="search" id="notesSearch" placeholder="ค้นหาโน้ต"/>`+notes.map((n,i)=>`<button class="item" data-note="${i}"><span class="avatar">${icon('notes')}</span><span class="info"><b>${escapeHtml(n.title)}</b><small>${escapeHtml(n.body.slice(0,42))}</small></span></button>`).join('')+`<button class="fab" data-action="newnote">＋</button>`;}
 else if(screen==='note'){let n=notes[Number(root.dataset.note)||0];body=header('โน้ต')+`<div class="sheet"><input id="noteTitle" value="${escapeAttr(n.title)}" style="border:0;font-size:21px;width:100%;padding:10px"/><textarea id="noteBody" style="width:100%;height:300px;border:0;padding:10px;font:inherit;resize:none">${escapeHtml(n.body)}</textarea><button data-action="savenote" style="background:#dbe6fb;border-radius:18px;padding:12px">บันทึก</button></div>`;}
 else if(screen==='music'){body=header('Samsung Music')+`<div class="card" style="text-align:center;padding:35px"><div style="font-size:55px">♫</div><h3>เพลงตัวอย่าง</h3><p class="muted">ยังไม่ได้เพิ่มไฟล์เสียง</p><button data-action="musicplay">▶ เล่น / หยุด</button></div><div class="sheet"><b>เพลย์ลิสต์</b><p>เพลงโปรด</p></div>`;}
 else if(screen==='browser'){body=header('Samsung Internet')+`<form id="webForm" class="sheet"><input class="search" id="webQuery" style="width:100%;margin:0" placeholder="ค้นหาหรือป้อน URL"/></form><div class="card"><b>รายการโปรด</b><p>Samsung Internet</p><p class="muted">หน้าเว็บตัวอย่าง — ไม่เปิดเว็บไซต์ภายนอกโดยอัตโนมัติ</p></div>`;}
 else if(screen==='facebook'){body=header('Facebook')+`<div class="sheet"><b>ฟีดข่าว</b><p class="muted">Mockup Facebook สำหรับโทรศัพท์การันต์</p></div>`;}
 else if(screen==='messages'){body=header('ข้อความ')+list(['อชิ','พี่ดุจ'],'person');}
 else if(screen==='instagram'){body=header('Instagram')+`<div class="sheet"><b>karan</b><p class="muted">0 โพสต์ · 0 ผู้ติดตาม · 0 กำลังติดตาม</p><button data-action="follow">แก้ไขโปรไฟล์</button></div><div class="gallerygrid">${photos.slice(0,6).map((p,i)=>`<button class="phototile" data-photo="${i}">${icon('gallery')}</button>`).join('')}</div>`;}
 else if(screen==='mail'){body=header('Gmail')+`<input class="search" placeholder="ค้นหาในอีเมล"/>`+list(['ยินดีต้อนรับสู่กล่องจดหมาย','ตัวอย่างอีเมลการทำงาน'],'email')+`<button class="fab" data-action="composemail">✎</button>`;}
 else if(screen==='maps'){body=header('Maps')+`<input class="search" placeholder="ค้นหาสถานที่"/><div style="height:330px;background:repeating-linear-gradient(45deg,#e6eddf,#e6eddf 28px,#d7e6ed 28px,#d7e6ed 55px);display:grid;place-items:center">แผนที่จำลอง</div><div class="card">สถานที่บันทึกไว้<br><small class="muted">ยังไม่มีสถานที่</small></div>`;}
 else if(screen==='files'){body=header('ไฟล์ส่วนตัว')+`<input class="search" placeholder="ค้นหาไฟล์"/>`+list(['รูปภาพ','ดาวน์โหลด','เอกสาร','เสียง','วิดีโอ'],'folder');}
 else if(screen==='folder'){body=header(root.dataset.folder||'โฟลเดอร์')+`<div class="sheet muted">ยังไม่มีไฟล์ในโฟลเดอร์นี้</div>`;}
 else if(screen==='clock'){body=header('นาฬิกา')+`<div class="tabs">${['ปลุก','นาฬิกาโลก','จับเวลา','ตั้งเวลา'].map(t=>`<button data-ctab="${t}" class="${tab===t?'on':''}">${t}</button>`).join('')}</div><div class="card" style="text-align:center;font-size:30px">${tab==='จับเวลา'||tab==='ตั้งเวลา'?timerSec+' วินาที':'07:00'}</div><div class="sheet" style="text-align:center"><button data-action="timerstart">เริ่ม</button>　<button data-action="timerreset">รีเซ็ต</button></div>`;}
 else if(screen==='settings'){body=header('การตั้งค่า')+list(['การเชื่อมต่อ','เสียงและการสั่น','จอภาพ','วอลเปเปอร์และสไตล์','แบตเตอรี่','เกี่ยวกับโทรศัพท์'],'setting');}
 else if(screen==='contacts'){body=header('รายชื่อ')+`<input class="search" placeholder="ค้นหารายชื่อ"/>`+list(people,'dial');}
 else if(screen==='detail'){body=header(root.dataset.detail||'รายละเอียด')+`<div class="card">ตัวอย่างหน้ารายละเอียด<br><p class="muted">ส่วนนี้ยังเป็น Mockup รอข้อมูลจริง</p></div>`;}
 root.innerHTML=`<div class="sysbar" id="sysbar"><span>karan</span><span class="sysright"><svg viewBox="0 0 52 17"><g fill="currentColor"><rect x="1" y="12" width="4" height="4" rx="1"/><rect x="8" y="9" width="4" height="7" rx="1"/><rect x="15" y="6" width="4" height="10" rx="1"/><rect x="22" y="3" width="4" height="13" rx="1"/></g><path d="M31 7Q39 0 48 7M34 10Q39 6 45 10M38 13h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span style="border:1px solid currentColor;border-radius:5px;padding:1px 3px">85</span></span></div><div class="appviewport" id="appViewport">${body}</div><div class="gesture" data-home title="กลับหน้าหลัก"></div><div class="quick" id="quick"><b>การตั้งค่าด่วน</b><p><button data-action="wifi">Wi-Fi</button><button data-action="sound">เสียง</button><button data-action="brightness">ความสว่าง</button></p><button data-action="quickclose">ปิด</button></div>`;
 root.querySelector('.sysbar').style.color=dark?'#333':'#333';
 if(screen==='chat'){const vp=$('appViewport');vp.style.overflow='hidden';vp.style.display='flex';vp.style.flexDirection='column';vp.querySelector('.chatmessages').style.flex='1';vp.querySelector('.chatmessages').style.minHeight='0';vp.querySelector('.chatcompose').style.position='relative';vp.querySelector('.chatcompose').style.bottom='auto';vp.querySelector('.chatmessages').scrollTop=999999;}
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(v){return escapeHtml(v);}
function go(name){if(screen!==name)history.push(screen);screen=name;view();}
function back(){screen=history.pop()||'home';view();}
function notify(text){const x=document.createElement('div');x.textContent=text;x.style.cssText='position:absolute;z-index:150;top:43px;left:15px;right:15px;background:#fff;border-radius:16px;padding:15px;box-shadow:0 4px 15px #0003';root.append(x);setTimeout(()=>x.remove(),1800)}
root.addEventListener('click',e=>{
const el=e.target.closest('button,[data-home]');if(!el)return;
if(el.dataset.homepage!==undefined){homePage=Number(el.dataset.homepage);view();return;}
if(el.hasAttribute('data-home')){history=[];screen='home';view();return;}
if(el.hasAttribute('data-back')){back();return;}
if(el.dataset.app){go(el.dataset.app);if(screen==='phone')tab='แป้นกด';view();return;}
if(el.dataset.person!==undefined){selectedPerson=people[Number(el.dataset.person)];go('chat');return;}
if(el.dataset.tab){tab=el.dataset.tab;view();return;}
if(el.dataset.ptab){tab=el.dataset.ptab;view();return;}
if(el.dataset.ctab){tab=el.dataset.ctab;view();return;}
if(el.dataset.digit){callDigits+=el.dataset.digit;view();return;}
if(el.dataset.dial!==undefined){notify('โทรจำลอง: '+people[Number(el.dataset.dial)%people.length]);return;}
if(el.dataset.photo!==undefined){root.dataset.photo=el.dataset.photo;go('photo');return;}
if(el.dataset.note!==undefined){root.dataset.note=el.dataset.note;go('note');return;}
if(el.dataset.folder!==undefined){root.dataset.folder=['รูปภาพ','ดาวน์โหลด','เอกสาร','เสียง','วิดีโอ'][Number(el.dataset.folder)];go('folder');return;}
if(el.dataset.email!==undefined||el.dataset.setting!==undefined){root.dataset.detail=el.dataset.email!==undefined?'อีเมล':'การตั้งค่า';go('detail');return;}
if(el.dataset.day){notify('วันที่ '+el.dataset.day+' — ยังไม่มีกิจกรรม');return;}
const a=el.dataset.action;
if(a==='prevmonth'||a==='nextmonth'){month+=a==='prevmonth'?-1:1;if(month<0){month=11;year--}if(month>11){month=0;year++}view()}
else if(a==='newnote'){notes.unshift({title:'โน้ตใหม่',body:''});root.dataset.note='0';go('note')}
else if(a==='savenote'){const n=notes[Number(root.dataset.note)||0];n.title=$('noteTitle').value;n.body=$('noteBody').value;back();notify('บันทึกโน้ตแล้ว')}
else if(a==='shutter'){photos.unshift({name:'ภาพใหม่',date:new Date().toLocaleDateString('th-TH')});notify('บันทึกภาพจำลองในแกลเลอรีแล้ว')}
else if(a==='deletephoto'){photos.splice(Number(root.dataset.photo),1);back()}
else if(a==='timerstart'){if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>{timerSec++;if(screen==='clock')view()},1000)}notify(timer?'เริ่มจับเวลา':'หยุดจับเวลา')}
else if(a==='timerreset'){clearInterval(timer);timer=null;timerSec=0;view()}
else if(a==='call')notify('กำลังโทรจำลอง '+callDigits);
else if(a==='quickclose')$('quick').classList.remove('open');
else if(a)notify('เปิดฟังก์ชันตัวอย่าง: '+a);
else if(el.hasAttribute('data-more'))$('quick').classList.toggle('open');
});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='chatForm'){const t=$('chatInput').value.trim();if(!t)return;chats[selectedPerson].push({who:'me',text:t});view()}else if(e.target.id==='webForm'){notify('คำค้นหาจำลอง: '+$('webQuery').value)}});
root.addEventListener('input',e=>{if(e.target.id==='lineSearch'){let q=e.target.value.toLowerCase();root.querySelectorAll('[data-person]').forEach((el,i)=>el.style.display=people[i].toLowerCase().includes(q)?'flex':'none')}});
let swipeStart=null;root.addEventListener('touchstart',e=>{if(screen==='home')swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});root.addEventListener('touchend',e=>{if(screen!=='home'||!swipeStart)return;const dx=e.changedTouches[0].clientX-swipeStart.x;const dy=e.changedTouches[0].clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){homePage=Math.max(0,Math.min(homePages.length-1,homePage+(dx<0?1:-1)));view();}},{passive:true});
let touchY=null;root.addEventListener('touchstart',e=>{if(e.touches[0].clientY<80)touchY=e.touches[0].clientY},{passive:true});root.addEventListener('touchend',e=>{if(touchY!==null&&e.changedTouches[0].clientY-touchY>65){$('quick').classList.add('open')}touchY=null},{passive:true});
const unlocked=$('unlockedPage');const observer=new MutationObserver(()=>{if(unlocked.getAttribute('display')!=='none'){root.style.display='block';view()}else root.style.display='none'});observer.observe(unlocked,{attributes:true,attributeFilter:['display']});if(unlocked.getAttribute('display')!=='none'){root.style.display='block';view()}
window.KaranMockup={open:go,home:()=>{screen='home';history=[];view()},apps:apps.map(a=>a[1])};
})();
</script>
</body>
</html>
